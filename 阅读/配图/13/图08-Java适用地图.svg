<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 500" role="img" aria-label="Java Harness 适用地图"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#718b9c"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:19px;font-weight:650;fill:#263f50}.h{font-size:16px;font-weight:650;fill:#263f50}.small{font-size:14px;fill:#4b6676}.note{font-size:12px;fill:#66808f}.bullet{font-size:13px;fill:#3f596a}</style><rect width="100%" height="100%" fill="#f7fafb"/><text class="title" x="40" y="42">Java Harness：什么时候优先验证，什么成本要另算</text><rect x="40" y="82" width="260" height="58" rx="12" fill="#e5f2ed" stroke="#a9cdbd"/><text class="h" x="170.0" y="117.0" text-anchor="middle">优先验证</text><rect x="40" y="174" width="260" height="66" rx="10" fill="white" stroke="#d7e2e8"/><text class="bullet" x="58" y="202">• 已有 JVM / Java 工程能力</text><path d="M301 207L359 207" stroke="#7891a3" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="5 5"/><rect x="40" y="260" width="260" height="66" rx="10" fill="white" stroke="#d7e2e8"/><text class="bullet" x="58" y="288">• 目标为常驻服务，多任务等待</text><rect x="40" y="346" width="260" height="66" rx="10" fill="white" stroke="#d7e2e8"/><text class="bullet" x="58" y="374">• 状态契约、并发与诊断可复用</text><rect x="360" y="82" width="260" height="58" rx="12" fill="#f6efe6" stroke="#d3c2a6"/><text class="h" x="490.0" y="117.0" text-anchor="middle">另算成本</text><rect x="360" y="174" width="260" height="66" rx="10" fill="white" stroke="#d7e2e8"/><text class="bullet" x="378" y="202">• 本地分发</text><text class="note" x="378" y="224">包体、启动、内存</text><path d="M621 207L679 207" stroke="#7891a3" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="5 5"/><rect x="360" y="260" width="260" height="66" rx="10" fill="white" stroke="#d7e2e8"/><text class="bullet" x="378" y="288">• PTY、进程控制、平台沙箱</text><rect x="360" y="346" width="260" height="66" rx="10" fill="white" stroke="#d7e2e8"/><text class="bullet" x="378" y="374">• 非 JVM 专有工具的接入与维护</text><rect x="680" y="82" width="260" height="58" rx="12" fill="#faeee6" stroke="#dcb19f"/><text class="h" x="810.0" y="117.0" text-anchor="middle">先比较，不要默认 Java</text><rect x="680" y="174" width="260" height="66" rx="10" fill="white" stroke="#d7e2e8"/><text class="bullet" x="698" y="202">• 产品核心是原生 / 多平台终端</text><rect x="680" y="260" width="260" height="66" rx="10" fill="white" stroke="#d7e2e8"/><text class="bullet" x="698" y="288">• 关键 SDK 或工具在其他生态</text><rect x="680" y="346" width="260" height="66" rx="10" fill="white" stroke="#d7e2e8"/><text class="bullet" x="698" y="374">• 没有跨语言成功率实测可继承</text><text class="small" x="40" y="447">JDK 21 起可用虚拟线程；JDK 24 通过 JEP 491 减少 synchronized 导致的 pinning。版本与运行环境仍要逐项验证。</text><text class="note" x="40" y="474">分类是选型判断辅助，不表示某个语言或框架必然更快、更稳或更省成本。</text></svg>