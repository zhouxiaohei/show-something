<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 445" role="img" aria-label="先决定交付方式，再比较语言"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#718b9c"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:19px;font-weight:650;fill:#263f50}.h{font-size:16px;font-weight:650;fill:#263f50}.small{font-size:14px;fill:#4b6676}.note{font-size:12px;fill:#66808f}.bullet{font-size:13px;fill:#3f596a}</style><rect width="100%" height="100%" fill="#f7fafb"/><text class="title" x="40" y="42">先决定交付方式，再比较语言</text><rect x="405" y="72" width="200" height="72" rx="12" fill="#e8f0f6" stroke="#bdccd7"/><text class="h" x="505.0" y="114.0" text-anchor="middle">你的交付目标</text><path d="M505 144L155 216" stroke="#7891a3" stroke-width="1.8" marker-end="url(#arr)"/><path d="M505 144L505 216" stroke="#7891a3" stroke-width="1.8" marker-end="url(#arr)"/><path d="M505 144L855 216" stroke="#7891a3" stroke-width="1.8" marker-end="url(#arr)"/><rect x="40" y="218" width="260" height="132" rx="12" fill="#e5f2ed" stroke="#a9cdbd"/><text class="h" x="170.0" y="250" text-anchor="middle">提高个人 / 团队效率</text><text class="bullet" x="58" y="278">先比较成品</text><text class="bullet" x="58" y="300">用真实代码库与任务验收</text><rect x="360" y="218" width="260" height="132" rx="12" fill="#eaf0f8" stroke="#a8bccf"/><text class="h" x="490.0" y="250" text-anchor="middle">交付自己的业务应用</text><text class="bullet" x="378" y="278">评估平台 / Harness</text><text class="bullet" x="378" y="300">看工具、状态、权限、升级</text><rect x="680" y="218" width="260" height="132" rx="12" fill="#f6efe6" stroke="#cdbfa4"/><text class="h" x="810.0" y="250" text-anchor="middle">控制 Agent 执行核心</text><text class="bullet" x="698" y="278">自建运行底座</text><text class="bullet" x="698" y="300">此时才直接比较主控语言</text><text class="small" x="40" y="389">用途（Coding / 助手 / 业务自动化）和运行方式（托管 / 自托管 / 本地）是另外两条独立判断轴。</text><text class="note" x="40" y="418">这是选型路线，不是成熟度评分；每个分支仍要用你的任务、环境和失败样本验证。</text></svg>