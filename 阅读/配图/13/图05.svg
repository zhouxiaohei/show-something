<svg role="img" aria-labelledby="fig-cancel-title fig-cancel-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 260"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="fig-cancel-title">停止等待和终止工具执行是不同状态</title><desc id="fig-cancel-desc">取消先阻止后续步骤，再要求执行环境终止；确认后才进入已取消，否则暴露仍在清理的状态。</desc><defs><marker id="fig-cancel-arrow" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4"><path d="M0 0L8 4L0 8Z" fill="#68808a"/></marker></defs><rect x="10" y="77" width="175" height="78" rx="7" fill="#fff" stroke="#b8cdd1"/><text x="97.5" y="122.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172b36">用户取消任务</text><rect x="235" y="77" width="205" height="78" rx="7" fill="#eaf5f1" stroke="#b8cdd1"/><text x="337.5" y="109.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172b36">主控记录取消中</text><text x="337.5" y="135.0" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">阻止后续步骤</text><rect x="495" y="77" width="240" height="78" rx="7" fill="#fff" stroke="#b8cdd1"/><text x="615.0" y="109.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172b36">停止执行环境</text><text x="615.0" y="135.0" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">等待终止确认</text><rect x="805" y="12" width="245" height="80" rx="7" fill="#eaf5f1" stroke="#b8cdd1"/><text x="927.5" y="45.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172b36">确认终止</text><text x="927.5" y="71.0" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">才标记已取消</text><rect x="805" y="162" width="245" height="80" rx="7" fill="#fff5e5" stroke="#b8cdd1"/><text x="927.5" y="195.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172b36">尚未确认</text><text x="927.5" y="221.0" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">保持清理中并暴露状态</text><path d="M185 116H235" fill="none" stroke="#68808a" stroke-width="2" marker-end="url(#fig-cancel-arrow)"/><path d="M440 116H495" fill="none" stroke="#68808a" stroke-width="2" marker-end="url(#fig-cancel-arrow)"/><path d="M735 99H767V52H805" fill="none" stroke="#68808a" stroke-width="2" marker-end="url(#fig-cancel-arrow)"/><text x="769" y="32" font-size="14" font-weight="400" text-anchor="middle" fill="#172b36">确认</text><path d="M735 133H767V202H805" fill="none" stroke="#a77b32" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fig-cancel-arrow)"/><text x="769" y="234" font-size="14" font-weight="400" text-anchor="middle" fill="#172b36">未确认</text></svg>