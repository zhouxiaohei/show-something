<svg role="img" aria-labelledby="fig-deployment-cost-title fig-deployment-cost-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 290"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="fig-deployment-cost-title">同一运行时成本在服务端和本地端的承担方式不同</title><desc id="fig-deployment-cost-desc">左侧一个服务进程共享给多个任务，右侧各设备分别安装运行环境。本图不比较实际内存或启动数值。</desc><defs><marker id="fig-deployment-cost-arrow" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4"><path d="M0 0L8 4L0 8Z" fill="#68808a"/></marker></defs><rect x="15" y="15" width="500" height="255" rx="7" fill="#f6faf8" stroke="#b8cdd1"/><rect x="545" y="15" width="500" height="255" rx="7" fill="#f5f8fb" stroke="#b8cdd1"/><text x="265" y="48" font-size="19" font-weight="700" text-anchor="middle" fill="#172b36">常驻服务：一个 JVM 管理多个任务</text><rect x="45" y="100" width="170" height="100" rx="7" fill="#eaf5f1" stroke="#80b4a3"/><text x="130.0" y="143.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172b36">JVM + Harness</text><text x="130.0" y="169.0" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">共享基础运行成本</text><rect x="305" y="73" width="175" height="40" rx="7" fill="#fff" stroke="#b8cdd1"/><text x="392.5" y="99.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172b36">Agent 任务 A</text><path d="M215 150H260V93H305" fill="none" stroke="#68808a" stroke-width="2" marker-end="url(#fig-deployment-cost-arrow)"/><rect x="305" y="127" width="175" height="40" rx="7" fill="#fff" stroke="#b8cdd1"/><text x="392.5" y="153.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172b36">Agent 任务 B</text><path d="M215 150H260V147H305" fill="none" stroke="#68808a" stroke-width="2" marker-end="url(#fig-deployment-cost-arrow)"/><rect x="305" y="181" width="175" height="40" rx="7" fill="#fff" stroke="#b8cdd1"/><text x="392.5" y="207.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172b36">Agent 任务 C</text><path d="M215 150H260V201H305" fill="none" stroke="#68808a" stroke-width="2" marker-end="url(#fig-deployment-cost-arrow)"/><text x="265" y="247" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">运行时、连接池等可在任务间复用</text><text x="795" y="48" font-size="19" font-weight="700" text-anchor="middle" fill="#172b36">本地工具：每台设备承担一份运行环境</text><rect x="570" y="95" width="140" height="110" rx="7" fill="#fff" stroke="#b8cdd1"/><text x="640.0" y="130.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172b36">设备 1</text><text x="640.0" y="156.0" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">运行时 + 工具</text><text x="640.0" y="182.0" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">当前任务</text><rect x="725" y="95" width="140" height="110" rx="7" fill="#fff" stroke="#b8cdd1"/><text x="795.0" y="130.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172b36">设备 2</text><text x="795.0" y="156.0" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">运行时 + 工具</text><text x="795.0" y="182.0" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">当前任务</text><rect x="880" y="95" width="140" height="110" rx="7" fill="#fff" stroke="#b8cdd1"/><text x="950.0" y="130.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172b36">设备 3</text><text x="950.0" y="156.0" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">运行时 + 工具</text><text x="950.0" y="182.0" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">当前任务</text><text x="795" y="247" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">安装、启动、常驻资源与升级直接影响用户</text></svg>