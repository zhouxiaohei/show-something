<svg role="img" aria-labelledby="recovery-title recovery-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 195"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="recovery-title">任务恢复与业务工具幂等的区别</title><desc id="recovery-desc">Agent 发起创建工单，工具已成功写入但响应丢失。恢复后使用相同业务请求键查询或重试，返回原结果，避免再次创建。</desc><defs><marker id="arrow2" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4"><path d="M0,0L8,4L0,8Z" fill="#667f8a"/></marker></defs><g stroke="#c0d2d5" fill="#fff"><rect x="12" y="30" width="230" height="100" rx="7"/><rect x="283" y="30" width="230" height="100" rx="7" fill="#fff5e5"/><rect x="554" y="30" width="230" height="100" rx="7"/><rect x="825" y="30" width="223" height="100" rx="7" fill="#eaf5f1"/></g><g stroke="#667f8a" stroke-width="2" marker-end="url(#arrow2)"><path d="M242 80H280"/><path d="M513 80H551"/><path d="M784 80H822"/></g><g fill="#172b36" text-anchor="middle" font-size="17"><text x="127" y="64" font-weight="700">请求 createTicket</text><text x="127" y="96" font-size="15">业务键：job-42 / action-3</text><text x="398" y="64" font-weight="700">已写入，响应丢失</text><text x="398" y="96" font-size="15">runtime 尚未确认完成</text><text x="669" y="64" font-weight="700">任务恢复 / 重试</text><text x="669" y="96" font-size="15">保持同一个业务请求键</text><text x="936" y="64" font-weight="700">工具返回原结果</text><text x="936" y="96" font-size="15">而不是再创建一张工单</text><text x="530" y="170" font-size="15">checkpoint 负责执行状态；幂等记录负责业务动作。两者的提交边界必须明确。</text></g></svg>