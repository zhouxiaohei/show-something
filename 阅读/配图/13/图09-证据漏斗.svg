<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 490" role="img" aria-label="证据读取漏斗"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#718b9c"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:19px;font-weight:650;fill:#263f50}.h{font-size:16px;font-weight:650;fill:#263f50}.small{font-size:14px;fill:#4b6676}.note{font-size:12px;fill:#66808f}.bullet{font-size:13px;fill:#3f596a}</style><rect width="100%" height="100%" fill="#f7fafb"/><text class="title" x="40" y="42">证据读取漏斗：从关注度到你自己的任务</text><rect x="40" y="80" width="930" height="70" rx="14" fill="#e8f0f6" stroke="#b8cbd6"/><text class="h" x="100" y="109">1. 仓库 Stars / forks</text><text class="small" x="100" y="133">候选集内累计关注；不等于装机量、增长率或稳定性</text><path d="M505 150L505 172" stroke="#7891a3" stroke-width="1.8" marker-end="url(#arr)"/><rect x="58" y="172" width="894" height="70" rx="14" fill="#eaf0f8" stroke="#b8cbd6"/><text class="h" x="118" y="201">2. 维护 / 版本迹象</text><text class="small" x="118" y="225">归档、默认分支 commit、release 条目；不等于生产 SLO</text><path d="M505 242L505 264" stroke="#7891a3" stroke-width="1.8" marker-end="url(#arr)"/><rect x="76" y="264" width="858" height="70" rx="14" fill="#f0f3f1" stroke="#b8cbd6"/><text class="h" x="136" y="293">3. 真实使用证据</text><text class="small" x="136" y="317">工程博客、具名客户、研究数据；不把试点写成多年生产</text><path d="M505 334L505 356" stroke="#7891a3" stroke-width="1.8" marker-end="url(#arr)"/><rect x="94" y="356" width="822" height="70" rx="14" fill="#e5f2ed" stroke="#b8cbd6"/><text class="h" x="154" y="385">4. 你的目标验证</text><text class="small" x="154" y="409">固定模型 / 工具 / 环境，记录成功率、返工、耗时、费用和失败注入</text><text class="note" x="40" y="464">52 个仓库台账快照：2026-11-03。快照支持入围和替换候选，不能替代目标任务的失败注入与成本验证。</text></svg>