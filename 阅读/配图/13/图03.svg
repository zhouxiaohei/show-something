g-harness-task-arrow)"/><text x="185.0" y="90" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">提交修复任务</text><path d="M300 149H990" fill="none" stroke="#68808a" stroke-width="2" marker-end="url(#fig-harness-task-arrow)"/><text x="645.0" y="139" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">记录任务与当前阶段</text><path d="M300 195H540" fill="none" stroke="#68808a" stroke-width="2" marker-end="url(#fig-harness-task-arrow)"/><text x="420.0" y="185" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">请求下一步动作</text><path d="M540 240H300" fill="none" stroke="#68808a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fig-harness-task-arrow)"/><text x="420.0" y="230" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">返回动作建议</text><path d="M300 286H780" fill="none" stroke="#68808a" stroke-width="2" marker-end="url(#fig-harness-task-arrow)"/><text x="540.0" y="276" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">授权后修改文件 / 运行测试</text><path d="M780 332H300" fill="none" stroke="#68808a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fig-harness-task-arrow)"/><text x="540.0" y="322" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">返回输出与退出状态</text><path d="M300 379H990" fill="none" stroke="#68808a" stroke-width="2" marker-end="url(#fig-harness-task-arrow)"/><text x="645.0" y="369" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">保存结果与可恢复进度</text><path d="M300 426H70" fill="none" stroke="#68808a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fig-harness-task-arrow)"/><text x="185.0" y="416" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">返回产物或等待用户</text><text x="530" y="492" font-size="15" font-weight="400" text-anchor="middle" fill="#172b36">实线：请求或写入　虚线：返回；需要继续时重复模型与工具交互</text></svg>