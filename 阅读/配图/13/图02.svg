<svg role="img" aria-labelledby="fig-layers-title fig-layers-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 375"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="fig-layers-title">Agent 主控与工具、模型、客户端的语言可以分别选择</title><desc id="fig-layers-desc">客户端经应用接口进入 Agent 主控。主控分别调用模型服务、工具与状态存储；工具可以是同进程 Java 方法或跨语言服务。模型计算的语言不同于主控语言。</desc><defs><marker id="arrow" orient="auto-start-reverse" markerWidth="8" markerHeight="8" refX="7" refY="4"><path d="M0,0 L8,4 L0,8Z" fill="#667f8a"/></marker></defs><g fill="none" stroke="#667f8a" stroke-width="2" marker-end="url(#arrow)"><path d="M205 175H285"/><path d="M615 150H720V70H770"/><path d="M615 175H770"/><path d="M615 200H720V280H770"/><path d="M450 232V285"/></g><g stroke="#b7cdd1" fill="#fff"><rect x="20" y="125" width="185" height="100" rx="8"/><rect x="285" y="112" width="330" height="120" rx="8" fill="#eaf5f1" stroke="#126f66"/><rect x="770" y="20" width="270" height="96" rx="8"/><rect x="770" y="133" width="270" height="98" rx="8"/><rect x="770" y="251" width="270" height="96" rx="8"/><rect x="285" y="285" width="330" height="62" rx="8"/></g><g fill="#172b36" text-anchor="middle" font-size="18"><text x="112" y="158" font-weight="700">客户端 / 产品入口</text><text x="112" y="190" font-size="15">Web、IDE、桌面、消息</text><text x="450" y="147" font-weight="700">Agent 主控 / loop / 状态编排</text><text x="450" y="180" font-size="16">Java · Python · TS · Go</text><text x="450" y="207" font-size="16">Rust · C# · Kotlin 等</text><text x="905" y="53" font-weight="700">模型服务</text><text x="905" y="84" font-size="15">远程 API 或独立 GPU 推理栈</text><text x="905" y="164" font-weight="700">领域工具</text><text x="905" y="193" font-size="15">同进程方法 / HTTP / MCP 等</text><text x="905" y="284" font-weight="700">文件 / 浏览器 / 终端环境</text><text x="905" y="316" font-size="15">环境语言与主控语言分开</text><text x="450" y="312" font-weight="700">状态、任务与观测</text><text x="450" y="335" font-size="14">可先合并部署；出现明确需求再拆分</text></g></svg>