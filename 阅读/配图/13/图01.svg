<svg role="img" aria-labelledby="fig-choice-axes-title fig-choice-axes-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 360"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="fig-choice-axes-title">交付形态、用途、运行方式是独立选择</title><desc id="fig-choice-axes-desc">三列分别表示交付形态、用途、运行方式；每列作选择可以得到不同组合，不构成上下游依赖。</desc><defs><marker id="fig-choice-axes-arrow" orient="auto" markerWidth="8" markerHeight="8" refX="7" refY="4"><path d="M0 0L8 4L0 8Z" fill="#68808a"/></marker></defs><text x="170" y="32" font-size="20" font-weight="700" text-anchor="middle" fill="#172b36">交付形态</text><rect x="20" y="58" width="300" height="46" rx="7" fill="#eaf5f1" stroke="#b8cdd1"/><text x="170.0" y="87.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172b36">成品</text><rect x="20" y="119" width="300" height="46" rx="7" fill="#fff" stroke="#b8cdd1"/><text x="170.0" y="148.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172b36">平台 / 可改造底座</text><rect x="20" y="180" width="300" height="46" rx="7" fill="#fff" stroke="#b8cdd1"/><text x="170.0" y="209.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172b36">框架 / SDK / 运行时</text><text x="530" y="32" font-size="20" font-weight="700" text-anchor="middle" fill="#172b36">用途</text><rect x="380" y="58" width="300" height="46" rx="7" fill="#eaf5f1" stroke="#b8cdd1"/><text x="530.0" y="87.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172b36">AI Coding</text><rect x="380" y="119" width="300" height="46" rx="7" fill="#fff" stroke="#b8cdd1"/><text x="530.0" y="148.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172b36">通用 AI 助手</text><rect x="380" y="180" width="300" height="46" rx="7" fill="#fff" stroke="#b8cdd1"/><text x="530.0" y="209.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172b36">业务自动化 / 知识研究</text><text x="890" y="32" font-size="20" font-weight="700" text-anchor="middle" fill="#172b36">运行方式</text><rect x="740" y="58" width="300" height="46" rx="7" fill="#eaf5f1" stroke="#b8cdd1"/><text x="890.0" y="87.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172b36">本地运行</text><rect x="740" y="119" width="300" height="46" rx="7" fill="#fff" stroke="#b8cdd1"/><text x="890.0" y="148.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172b36">自托管服务</text><rect x="740" y="180" width="300" height="46" rx="7" fill="#fff" stroke="#b8cdd1"/><text x="890.0" y="209.0" font-size="17" font-weight="650" text-anchor="middle" fill="#172b36">供应商托管</text><text x="350" y="141" font-size="26" font-weight="600" text-anchor="middle" fill="#71868e">×</text><text x="710" y="141" font-size="26" font-weight="600" text-anchor="middle" fill="#71868e">×</text><path d="M20 262H1040" stroke="#cbdade"/><text x="35" y="300" font-size="17" font-weight="500" text-anchor="start" fill="#172b36">成品使用示例：Codex CLI ＝ 成品 × AI Coding × 本地运行</text><text x="35" y="335" font-size="17" font-weight="500" text-anchor="start" fill="#172b36">自建方案示例：框架 / SDK × 业务 Agent × 自托管服务</text></svg>