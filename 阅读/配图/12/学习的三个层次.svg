<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 450" role="img" aria-label="12/学习的三个层次.svg"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#718b9c"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:18px;font-weight:600;fill:#263f50}.small{font-size:14px;fill:#5a7383}.note{font-size:12px;fill:#6a8392}</style><rect width="100%" height="100%" fill="#f7fafb"/><text class="title" x="36" y="42">持续学习，发生在三个相互影响但不能替代的层次</text><rect x="36" y="78" width="255" height="85" rx="12" fill="#eaeaf7" stroke="#bdccd7"/><text class="title" x="163.5" y="115" text-anchor="middle">模型参数学习</text><text class="small" x="340" y="126">训练更新参数；检验新旧任务的表现</text><path d="M293 121H325" stroke="#7891a3" stroke-width="1.7" marker-end="url(#arr)"/><rect x="36" y="185" width="255" height="85" rx="12" fill="#e5f2ed" stroke="#bdccd7"/><text class="title" x="163.5" y="222" text-anchor="middle">系统经验积累</text><text class="small" x="340" y="233">记忆、技能与反馈被保存，供后续执行使用</text><path d="M293 228H325" stroke="#7891a3" stroke-width="1.7" marker-end="url(#arr)"/><rect x="36" y="292" width="255" height="85" rx="12" fill="#f2eee7" stroke="#bdccd7"/><text class="title" x="163.5" y="329" text-anchor="middle">人的学习</text><text class="small" x="340" y="340">理解、纠错与迁移；形成独立判断</text><path d="M293 335H325" stroke="#7891a3" stroke-width="1.7" marker-end="url(#arr)"/><text class="note" x="36" y="423">记忆写入不会自行更新模型参数；工具辅助产出也不能代替对人的知识与判断的单独检验。</text></svg>