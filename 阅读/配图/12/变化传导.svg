<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 355" role="img" aria-label="12/变化传导.svg"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#718b9c"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:18px;font-weight:600;fill:#263f50}.small{font-size:14px;fill:#5a7383}.note{font-size:12px;fill:#6a8392}</style><rect width="100%" height="100%" fill="#f7fafb"/><text class="title" x="35" y="42">从局部能力到组织变化，中间还有多层机制</text><rect x="35" y="90" width="215" height="112" rx="12" fill="#e5f2ed" stroke="#bdccd7"/><text class="title" x="142.5" y="127" text-anchor="middle">执行更容易</text><text class="small" x="142.5" y="154" text-anchor="middle">更多候选成果</text><path d="M251 145H275" stroke="#7891a3" stroke-width="1.7" marker-end="url(#arr)" stroke-dasharray="5 5"/><rect x="280" y="90" width="215" height="112" rx="12" fill="#e8eff8" stroke="#bdccd7"/><text class="title" x="387.5" y="127" text-anchor="middle">交接重新安排</text><text class="small" x="387.5" y="154" text-anchor="middle">共享环境与新瓶颈</text><path d="M496 145H520" stroke="#7891a3" stroke-width="1.7" marker-end="url(#arr)" stroke-dasharray="5 5"/><rect x="525" y="90" width="215" height="112" rx="12" fill="#f2eee7" stroke="#bdccd7"/><text class="title" x="632.5" y="127" text-anchor="middle">岗位与服务重组</text><text class="small" x="632.5" y="154" text-anchor="middle">任务组合和持续交付</text><path d="M741 145H765" stroke="#7891a3" stroke-width="1.7" marker-end="url(#arr)" stroke-dasharray="5 5"/><rect x="770" y="90" width="215" height="112" rx="12" fill="#eaeaf6" stroke="#bdccd7"/><text class="title" x="877.5" y="127" text-anchor="middle">企业与市场变化</text><text class="small" x="877.5" y="154" text-anchor="middle">采购、入口与竞争</text><path d="M888 205V254H135V209" fill="none" stroke="#95a9b7" stroke-dasharray="5 6" marker-end="url(#arr)"/><text class="small" x="502" y="287" text-anchor="middle">客户需求、现实反馈、维护成本和收益分配，会反过来改变采用方式</text><text class="note" x="35" y="331">条件性解释框架，不是已经估计的因果模型；不能由写代码更快直接推出公司人数或职业机会。</text></svg>