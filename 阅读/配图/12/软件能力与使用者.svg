<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 460" role="img" aria-label="12/软件能力与使用者.svg"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#718b9c"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:18px;font-weight:600;fill:#263f50}.small{font-size:14px;fill:#5a7383}.note{font-size:12px;fill:#6a8392}</style><rect width="100%" height="100%" fill="#f7fafb"/><text class="title" x="40" y="43">同一套业务能力，可以面对不同使用者</text><rect x="50" y="90" width="270" height="110" rx="12" fill="#e8f0f6" stroke="#bdccd7"/><text class="title" x="185.0" y="127" text-anchor="middle">人类使用者</text><text class="small" x="185.0" y="154" text-anchor="middle">通过界面探索与判断</text><rect x="680" y="90" width="270" height="110" rx="12" fill="#e5f2ed" stroke="#bdccd7"/><text class="title" x="815.0" y="127" text-anchor="middle">Agent</text><text class="small" x="815.0" y="154" text-anchor="middle">发现并调用结构化动作</text><path d="M185 201V257H500V291M815 201V257H500" fill="none" stroke="#7c96a6" stroke-width="1.8" marker-end="url(#arr)"/><rect x="310" y="293" width="380" height="100" rx="12" fill="#eaf0f7" stroke="#bdccd7"/><text class="title" x="500.0" y="330" text-anchor="middle">业务系统</text><text class="small" x="500.0" y="357" text-anchor="middle">数据、权限、状态与结果</text><text class="small" x="335" y="131">屏幕界面</text><text class="small" x="481" y="131">可调用动作</text><path d="M380 159H620" stroke="#bccbd6" stroke-dasharray="5 6"/><text class="note" x="40" y="435">WebMCP 是具体技术窗口，仍处提议与试验阶段；并非所有软件都已互通，也不保证跨系统任务成功。</text></svg>