<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 355" role="img" aria-label="12/能力与控制权.svg"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#718b9c"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:18px;font-weight:600;fill:#263f50}.small{font-size:14px;fill:#5a7383}.note{font-size:12px;fill:#6a8392}</style><rect width="100%" height="100%" fill="#f7fafb"/><rect x="55" y="80" width="385" height="150" rx="12" fill="#e5f2ed" stroke="#bdccd7"/><text class="title" x="247.5" y="117" text-anchor="middle">个人与小团队</text><text class="small" x="247.5" y="144" text-anchor="middle">可以调动更大的执行能力</text><rect x="560" y="80" width="385" height="150" rx="12" fill="#ecebf7" stroke="#bdccd7"/><text class="title" x="752.5" y="117" text-anchor="middle">平台与基础设施</text><text class="small" x="752.5" y="144" text-anchor="middle">仍可能控制入口、身份与反馈</text><path d="M447 148H548" stroke="#7891a3" stroke-width="1.7" marker-end="url(#arr)"/><path d="M553 178H452" stroke="#7891a3" stroke-width="1.7" marker-end="url(#arr)"/><text class="small" x="500" y="281" text-anchor="middle">人数、机器执行量、经营覆盖、资产控制、决策权，需要分别观察</text><text class="note" x="55" y="329">两种变化可以同时发生。能力普及、市场分散与收益普及没有自动的一一对应关系。</text></svg>