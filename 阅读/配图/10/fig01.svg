<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm10-1-title dm10-1-desc"><title id="dm10-1-title">能做、会做、能持续交付：三件分开验证的事</title><desc id="dm10-1-desc">以运营人员用 AI 做销售预测表的构造示例引出三个问题：借助工具完成任务的能力、本人掌握的知识与判断、团队持续交付的能力；三者互相影响却不能互相替代，本人判断帮助检查成果，团队流程支持生产与验证，一次成果不错不能直接证明本人掌握了方法。</desc><defs><marker id="dm10-1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">能做、会做、能持续交付：三件分开验证的事</text><text x="25" y="56" font-size="15" fill="#5c6d80">构造示例：一名不熟悉编程的运营人员，用 AI 做出一张销售预测表——同一件事引出三个不同问题</text><g><rect x="25" y="72" width="290" height="210" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="102" font-size="19" fill="#34475b">能做</text><text x="45" y="130" font-size="16" fill="#34475b">借助工具完成任务的能力</text><text x="45" y="158" font-size="15" fill="#5c6d80">检查：预测表是否满足</text><text x="45" y="180" font-size="15" fill="#5c6d80">这一次的需要</text><text x="45" y="214" font-size="15" fill="#5c6d80">对应：本次成果</text><text x="45" y="236" font-size="15" fill="#5c6d80">是否可用</text></g><g><rect x="335" y="72" width="290" height="210" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="355" y="102" font-size="19" fill="#34475b">会做</text><text x="355" y="130" font-size="16" fill="#34475b">本人掌握的知识与判断</text><text x="355" y="158" font-size="15" fill="#5c6d80">检查：能否解释为什么这样算、</text><text x="355" y="180" font-size="15" fill="#5c6d80">换一种数据分布会出什么问题</text><text x="355" y="214" font-size="15" fill="#5c6d80">对应：能否解释、纠错</text><text x="355" y="236" font-size="15" fill="#5c6d80">与迁移</text></g><g><rect x="645" y="72" width="290" height="210" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="665" y="102" font-size="19" fill="#34475b">能持续交付</text><text x="665" y="130" font-size="16" fill="#34475b">团队流程与基础设施</text><text x="665" y="158" font-size="15" fill="#5c6d80">检查：每周都要更新时，谁维护</text><text x="665" y="180" font-size="15" fill="#5c6d80">数据、检查异常、承担模型费用</text><text x="665" y="214" font-size="15" fill="#5c6d80">对应：能否</text><text x="665" y="236" font-size="15" fill="#5c6d80">持续交付</text></g><g><rect x="25" y="308" width="290" height="88" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="338" font-size="16" fill="#34475b">本人判断 → 帮助检查成果</text><text x="45" y="364" font-size="14" fill="#5c6d80">知识帮助核对结果是否可靠</text></g><g><rect x="335" y="308" width="290" height="88" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="355" y="338" font-size="16" fill="#34475b">团队流程 → 支持生产与验证</text><text x="355" y="364" font-size="14" fill="#5c6d80">基础设施承接大规模使用</text></g><g><rect x="645" y="308" width="290" height="88" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="665" y="338" font-size="16" fill="#34475b">一次成果 ≠ 本人掌握</text><text x="665" y="364" font-size="14" fill="#5c6d80">成果好不能直接证明方法已学会</text></g><text x="25" y="440" font-size="16" fill="#34475b">三者互相影响，却不能互相替代：本人懂原理，不保证系统能承担大规模使用；</text><text x="25" y="464" font-size="16" fill="#34475b">知识没有在短期测验中增加，也不抹掉工具当时带来的实际帮助。</text><text x="25" y="494" font-size="14" fill="#5c6d80">图中是本文的分析分工，不是经过估计的因果模型；接下来的七份材料分别照亮这三件事的不同部分。</text></g></svg>
