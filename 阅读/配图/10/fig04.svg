<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm10-4-title dm10-4-desc"><title id="dm10-4-title">任务做快以后，重新找整个流程的限制</title><desc id="dm10-4-desc">完整交付流程包括写代码、检查与审查、测试容量、交付与维护，瓶颈是当前最限制整体进度的环节且会移动；组织观察显示初级技术人员占比从百分之二十七降至百分之九、会议时间增加百分之十六、员工更多建设 AI 规则与流程、招聘规模仍在增长；推演与观察方向包括端到端交付、返工事故、含维护成本与新人独立能力。</desc><defs><marker id="dm10-4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">任务做快以后，重新找整个流程的限制</text><g><rect x="25" y="70" width="190" height="56" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="120" y="104" font-size="18" fill="#34475b" text-anchor="middle">写代码</text></g><path d="M215,98 L236,98" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm10-4-arrow)"/><g><rect x="240" y="70" width="190" height="56" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="335" y="104" font-size="18" fill="#34475b" text-anchor="middle">检查与审查</text></g><path d="M430,98 L451,98" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm10-4-arrow)"/><g><rect x="455" y="70" width="190" height="56" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="550" y="104" font-size="18" fill="#34475b" text-anchor="middle">测试容量</text></g><path d="M645,98 L666,98" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm10-4-arrow)"/><g><rect x="670" y="70" width="190" height="56" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="765" y="104" font-size="18" fill="#34475b" text-anchor="middle">交付与维护</text></g><text x="335" y="148" font-size="14" fill="#739882" text-anchor="middle">软件案例中的限制可能在这里，也可能在别处</text><text x="25" y="176" font-size="15" fill="#5c6d80">瓶颈 = 当前最限制整体进度的环节；它随工作量和其他环节的能力变化，不会永远停在同一处。</text><text x="25" y="198" font-size="15" fill="#5c6d80">类比：切菜更快，出餐仍可能等灶台、等检查、等服务员——这是流程直觉，不是生产函数。</text><g><rect x="25" y="216" width="910" height="118" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="244" font-size="17" fill="#34475b">组织层面的观察（Anthropic 内部研究）[公司观察研究]</text><text x="45" y="274" font-size="19" fill="#34475b">27% → 9%<tspan font-size="14" fill="#5c6d80">　初级技术人员在新聘中的占比</tspan></text><text x="45" y="300" font-size="19" fill="#34475b">+16%<tspan font-size="14" fill="#5c6d80">　非管理技术员工的会议时间（比一年前）</tspan></text><text x="475" y="274" font-size="19" fill="#34475b">更多<tspan font-size="14" fill="#5c6d80">　建设 AI 工作规则、监控工具和任务流程</tspan></text><text x="475" y="300" font-size="19" fill="#34475b">仍在增长<tspan font-size="14" fill="#5c6d80">　公司整体与技术招聘的绝对规模</tspan></text></g><g><rect x="25" y="358" width="910" height="130" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="386" font-size="17" fill="#34475b">由此的推演与观察方向 [综合判断]</text><text x="45" y="414" font-size="16" fill="#34475b">个人少打一些字，并不自动意味着组织少开一些会；</text><text x="45" y="438" font-size="16" fill="#34475b">AI 增加产出，也可能增加需要处理的提议、例外和依赖 [待验证解释]。</text><text x="45" y="468" font-size="15" fill="#5c6d80">值得观察：端到端交付是否变快 · 返工和事故是否变化 · 含维护的成本 · 新人独立能力 · 新增岗位做什么</text></g><text x="25" y="518" font-size="14" fill="#5c6d80">招聘占比下降不能直接解释成裁员，也不能单凭这一家公司推出全市场趋势；</text><text x="25" y="540" font-size="14" fill="#5c6d80">新人怎样获得形成判断力的练习，是这项观察提出但没测完答案的问题。</text></g></svg>
