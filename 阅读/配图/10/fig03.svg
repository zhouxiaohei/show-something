<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm10-3-title dm10-3-desc"><title id="dm10-3-title">成品收益与独立能力收益：两个实验都提示分开看</title><desc id="dm10-3-desc">左栏是 487 名咨询师的随机实验：借助 ChatGPT 表现更好但未达专家基准，撤去工具后知识题未见额外优势。右栏是 133 名专利律师的三个月实验：用 AI 起草时稿件更好且初级收益更大，不用 AI 时收益集中在资深律师。底部是一种待验证解释：有基础的人更容易识别哪些方法有用，通过比较与追问积累知识。</desc><defs><marker id="dm10-3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">成品收益与独立能力收益：两个实验都提示分开看</text><g><rect x="25" y="64" width="440" height="250" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="94" font-size="19" fill="#34475b">咨询师随机实验 [随机实验]</text><text x="45" y="126" font-size="15" fill="#5c6d80">487 名管理咨询师，处理组配 ChatGPT 与培训</text><text x="45" y="156" font-size="16" fill="#34475b">借助工具：三项数据科学任务表现更好</text><text x="45" y="178" font-size="15" fill="#5c6d80">但整体未达到专家基准</text><text x="45" y="208" font-size="16" fill="#34475b">撤去工具：技术知识题未见额外优势</text><text x="45" y="230" font-size="15" fill="#5c6d80">事后不用 ChatGPT 回答，处理组无优势</text><text x="45" y="260" font-size="15" fill="#5c6d80">实验实际发生于 2024 年，检验的是当时的</text><text x="45" y="282" font-size="15" fill="#5c6d80">工具、培训与任务组合 [S4]</text></g><g><rect x="495" y="64" width="440" height="250" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="515" y="94" font-size="19" fill="#34475b">专利律师随机实验 [随机实验／工作论文]</text><text x="515" y="126" font-size="15" fill="#5c6d80">11 家美国知识产权律所、133 名律师、三个月</text><text x="515" y="156" font-size="16" fill="#34475b">用 AI 起草：稿件质量提高，初级律师收益更大</text><text x="515" y="178" font-size="15" fill="#5c6d80">使用 AI 起草助手的即时收益</text><text x="515" y="208" font-size="16" fill="#34475b">不用 AI 修改：收益集中在资深律师</text><text x="515" y="230" font-size="15" fill="#5c6d80">初级律师平均未见收益，成绩分布分化 [S6]</text><text x="515" y="260" font-size="15" fill="#5c6d80">特定工具、样本、任务与观察期；不能推出</text><text x="515" y="282" font-size="15" fill="#5c6d80">整个法律职业的长期结论</text></g><g><rect x="25" y="340" width="910" height="130" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="368" font-size="17" fill="#34475b">一种解释 [待验证解释]：差异从哪来</text><text x="45" y="396" font-size="16" fill="#34475b">有基础的人更容易识别 AI 提供的方法中哪些有用、哪些值得怀疑，通过比较与追问积累知识；</text><text x="45" y="420" font-size="16" fill="#34475b">缺少基础的人可能接受了好稿件，却没有练习同样的判断。</text><text x="45" y="450" font-size="15" fill="#5c6d80">类比：借助导航到了目的地，不意味着已经记住每个路口。</text></g><text x="25" y="496" font-size="14" fill="#5c6d80">"未发现额外收益"不等于证明任何用法都学不到东西；两实验的样本、工具、任务与观察期不同，</text><text x="25" y="518" font-size="14" fill="#5c6d80">不能拼成同一个实验。共同支持的是：评价工具辅助工作时，应分别观察成果和人的能力。</text></g></svg>
