<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm10-2-title dm10-2-desc"><title id="dm10-2-title">写码加速之后：检查重排与基础设施承压</title><desc id="dm10-2-desc">软件生产链：AI 大量生成修改导致人工审查排队，机制是检查贯穿开发过程并按风险分级安排人工，推演是人的精力留给后果更重的部分。基础设施链：每日合并改动从约两千五百次涨到三万次以上，机制是建设 Scion 让历史查询和合并由服务器承担，推演是负载沿工作链向外传导但 Git 仍适合多数代码库。</desc><defs><marker id="dm10-2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">写码加速之后：检查重排与基础设施承压</text><text x="25" y="60" font-size="15" fill="#739882">链 A · 软件生产流程 [团队自述]</text><g><rect x="25" y="70" width="280" height="150" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="96" font-size="14" fill="#739882">事件</text><text x="45" y="122" font-size="16" fill="#34475b">AI 大量生成代码修改，</text><text x="45" y="146" font-size="16" fill="#34475b">逐条等同事阅读会排队</text><text x="45" y="172" font-size="15" fill="#5c6d80">多数代码阅读移交机器，</text><text x="45" y="194" font-size="15" fill="#5c6d80">AI 审查与测试贯穿流程 [S1]</text></g><path d="M305,145 L336,145" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm10-2-arrow)"/><g><rect x="340" y="70" width="280" height="150" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="360" y="96" font-size="14" fill="#739882">机制</text><text x="360" y="122" font-size="16" fill="#34475b">检查贯穿开发过程，</text><text x="360" y="146" font-size="16" fill="#34475b">人按风险加入</text><text x="360" y="172" font-size="15" fill="#5c6d80">低风险自动检查后免人工审批；</text><text x="360" y="194" font-size="15" fill="#5c6d80">高风险人工参与；发起者负责</text></g><path d="M620,145 L651,145" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm10-2-arrow)"/><g><rect x="655" y="70" width="280" height="150" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="675" y="96" font-size="14" fill="#739882">推演</text><text x="675" y="122" font-size="16" fill="#34475b">人的精力留给更难自动</text><text x="675" y="146" font-size="16" fill="#34475b">判断、后果更重的部分</text><text x="675" y="172" font-size="15" fill="#5c6d80">值得做：说清需求、制定验证、</text><text x="675" y="194" font-size="15" fill="#5c6d80">判断风险、处理发布后果</text></g><text x="25" y="248" font-size="15" fill="#739882">链 B · 软件基础设施 [团队自述]</text><g><rect x="25" y="258" width="280" height="150" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="284" font-size="14" fill="#739882">事件</text><text x="45" y="310" font-size="16" fill="#34475b">AI 与自动任务成了</text><text x="45" y="334" font-size="16" fill="#34475b">代码库的主要客户端</text><text x="45" y="360" font-size="15" fill="#5c6d80">每日合并改动：5 月约 2,500 次</text><text x="45" y="382" font-size="15" fill="#5c6d80">→ 9 月超 30,000 次 [S2]</text></g><path d="M305,333 L336,333" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm10-2-arrow)"/><g><rect x="340" y="258" width="280" height="150" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="360" y="284" font-size="14" fill="#739882">机制</text><text x="360" y="310" font-size="16" fill="#34475b">重建版本控制 Scion，</text><text x="360" y="334" font-size="16" fill="#34475b">服务器承担更多工作</text><text x="360" y="360" font-size="15" fill="#5c6d80">历史查询、合并由服务器承担，</text><text x="360" y="382" font-size="15" fill="#5c6d80">客户端按需取数据</text></g><path d="M620,333 L651,333" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm10-2-arrow)"/><g><rect x="655" y="258" width="280" height="150" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="675" y="284" font-size="14" fill="#739882">推演</text><text x="675" y="310" font-size="16" fill="#34475b">负载沿工作链向外传导：</text><text x="675" y="334" font-size="16" fill="#34475b">存取、测试、权限要跟上</text><text x="675" y="360" font-size="15" fill="#5c6d80">原文明确其负载特殊；</text><text x="675" y="382" font-size="15" fill="#5c6d80">Git 仍适合绝大多数代码库</text></g><text x="25" y="438" font-size="14" fill="#5c6d80">注意口径：合并数字属于 Anthropic 的统一代码库，不是 Claude Code 独立仓库的产出数据；</text><text x="25" y="460" font-size="14" fill="#5c6d80">两份材料相互关联，但对象不能混在一起；改动数量不能直接换算成功能价值或代码质量。</text><text x="25" y="490" font-size="14" fill="#5c6d80">它不证明所有代码都可自动合并，也不证明人已不需要理解系统。</text></g></svg>
