<svg role="img" aria-labelledby="planning-title planning-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 485">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="planning-title">谁要求计划，与谁写出计划，是两个问题</title><desc id="planning-desc">四种规划触发方式都可能由模型生成计划内容，程序控制触发与权限。</desc>
<defs><marker id="planning-arrow" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<text x="115" y="57" text-anchor="middle" font-size="18" fill="#203947">自主决定</text><rect x="230" y="25" width="295" height="75" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="377.5" y="68.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 提供普通目标</text><rect x="605" y="25" width="360" height="75" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="785.0" y="68.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 可直接行动或规划</text><path d="M525 63H597" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#planning-arrow)"/><text x="785" y="124" text-anchor="middle" font-size="14" fill="#913f32">不保证显式计划</text><text x="115" y="169" text-anchor="middle" font-size="18" fill="#203947">指令引导</text><rect x="230" y="137" width="295" height="75" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="377.5" y="180.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 注入规划要求</text><rect x="605" y="137" width="360" height="75" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="785.0" y="180.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 理解复杂度与步骤</text><path d="M525 175H597" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#planning-arrow)"/><text x="785" y="236" text-anchor="middle" font-size="14" fill="#913f32">规则文字 ≠ 可靠分类器</text><text x="115" y="281" text-anchor="middle" font-size="18" fill="#203947">计划模式</text><rect x="230" y="249" width="295" height="75" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="377.5" y="292.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 限制动作与阶段</text><rect x="605" y="249" width="360" height="75" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="785.0" y="292.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 调查并产出计划</text><path d="M525 287H597" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#planning-arrow)"/><text x="785" y="348" text-anchor="middle" font-size="14" fill="#913f32">控制权限 ≠ 计划正确</text><text x="115" y="393" text-anchor="middle" font-size="18" fill="#203947">固定规划步骤</text><rect x="230" y="361" width="295" height="75" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="377.5" y="404.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 必须发起规划调用</text><rect x="605" y="361" width="360" height="75" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="785.0" y="404.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 返回结构化计划</text><path d="M525 399H597" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#planning-arrow)"/><text x="785" y="460" text-anchor="middle" font-size="14" fill="#913f32">保证调用 ≠ 保证内容</text></svg>