<svg role="img" aria-labelledby="replan-title replan-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 365">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="replan-title">硬编码能触发纠偏，新的查证路线常由模型决定</title><desc id="replan-desc">程序提供明确失败事件和当前目标，模型解释后改变路线。已知机械分支可由程序直接执行。</desc>
<defs><marker id="replan-arrow" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect x="30" y="35" width="275" height="90" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="167.5" y="73.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 观察到明确事件</text><text x="167.5" y="98.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">测试失败 / 新输入 / 检查点</text><rect x="365" y="35" width="270" height="90" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="500.0" y="73.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 提供结果与有效目标</text><text x="500.0" y="98.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">可在正常下一轮或强制复核</text><rect x="705" y="35" width="265" height="90" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="837.5" y="73.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 解释并决定改向</text><text x="837.5" y="98.5" text-anchor="middle" font-size="15" font-weight="400" fill="#79500e">是否重规划、如何重规划</text><path d="M305 80H357" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#replan-arrow)"/><path d="M635 80H697" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#replan-arrow)"/><rect x="705" y="205" width="265" height="86" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="837.5" y="241.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 保存并执行新路线</text><text x="837.5" y="266.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">仍需后续真实反馈</text><path d="M838 125V198" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#replan-arrow)"/><path d="M838 292V335H165V133" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#replan-arrow)"/><text x="497" y="328" text-anchor="middle" font-size="15" fill="#536673">策略变了之后仍然要继续观察；不能因改过计划就认定纠偏成功</text><rect x="30" y="205" width="605" height="86" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="332.5" y="241.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 规则已知时可直接走固定分支</text><text x="332.5" y="266.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">例如：超时后切备用接口；无需让模型重新发明规则</text></svg>