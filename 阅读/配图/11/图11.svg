<svg role="img" aria-labelledby="context-title context-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 475">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="context-title">外部记忆能保存状态，不能自动保证模型读到并用对</title><desc id="context-desc">持久记录通过程序构造进入模型输入，长原文通常以摘要和索引呈现，按需读取要有动作或程序规则。</desc>
<defs><marker id="context-arrow" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect x="25" y="45" width="270" height="88" rx="12" fill="#edf2fc" stroke="#5a79ba" stroke-width="1.6"/><text x="160.0" y="82.5" text-anchor="middle" font-size="18" font-weight="650" fill="#34508c">持久信息</text><text x="160.0" y="107.5" text-anchor="middle" font-size="15" font-weight="400" fill="#34508c">原目标 / 有效约束 / 计划版本</text><rect x="365" y="45" width="270" height="88" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="500.0" y="82.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 组装当前上下文</text><text x="500.0" y="107.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">选择记录、检索或读取</text><rect x="705" y="45" width="270" height="88" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="840.0" y="82.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 本轮实际看到的输入</text><text x="840.0" y="107.5" text-anchor="middle" font-size="15" font-weight="400" fill="#79500e">只对已经提供的信息推理</text><path d="M295 89H357" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#context-arrow)"/><path d="M635 89H697" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#context-arrow)"/><rect x="25" y="235" width="270" height="88" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="160.0" y="272.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">磁盘 / 数据库中的原文</text><text x="160.0" y="297.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">可追溯内容与原始观察</text><rect x="365" y="235" width="270" height="88" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="500.0" y="272.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">索引、摘要与加载入口</text><text x="500.0" y="297.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">不能替代原文证据</text><path d="M295 279H357" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#context-arrow)"/><path d="M500 235V141" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#context-arrow)"/><path d="M705 106H675V365H160V331" fill="none" stroke="#bf7a12" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#context-arrow)"/><text x="610" y="388" text-anchor="middle" font-size="15" fill="#79500e">按需重读：模型提出请求或程序按规则加载</text><text x="500" y="443" text-anchor="middle" font-size="18" fill="#913f32">写入磁盘 ≠ 模型知道；拿到路径 ≠ 已读全文；摘要正确性也需要检查</text></svg>