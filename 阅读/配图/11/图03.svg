<svg role="img" aria-labelledby="core-title core-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="core-title">最小 loop：不强制先规划，也不默认另调验收模型</title><desc id="core-desc">模型选择动作或候选答复。程序收尾可直接结束，已配置检查则有继续、按检查范围交付、无法判断三类出口。</desc>
<defs><marker id="core-arrow" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect x="40" y="80" width="220" height="92" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="150.0" y="119.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 准备本轮材料</text><text x="150.0" y="144.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">目标、规则、观察、工具</text><rect x="340" y="80" width="275" height="92" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="477.5" y="119.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 判断并选择下一步</text><text x="477.5" y="144.5" text-anchor="middle" font-size="15" font-weight="400" fill="#79500e">理解 / 临时规划 / 校准</text><rect x="735" y="40" width="235" height="86" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="852.5" y="76.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 执行动作</text><text x="852.5" y="101.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">工具 / 已记下的子任务</text><path d="M260 126H332" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#core-arrow)"/><path d="M615 108L727 85" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#core-arrow)"/><text x="670" y="67" text-anchor="middle" font-size="14" fill="#536673">动作请求</text><path d="M850 40V14H150V72" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#core-arrow)"/><text x="490" y="35" text-anchor="middle" font-size="15" fill="#16574c">实际结果进入下一轮；下一轮模型解释结果</text><rect x="735" y="225" width="235" height="86" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="852.5" y="261.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 收尾处理</text><text x="852.5" y="286.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">按协议与已配置检查</text><path d="M615 148L727 250" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#core-arrow)"/><text x="678" y="197" text-anchor="middle" font-size="14" fill="#536673">候选答复</text><rect x="735" y="445" width="235" height="88" rx="12" fill="#fff0ed" stroke="#c46a5b" stroke-width="1.6"/><text x="852.5" y="482.5" text-anchor="middle" font-size="18" font-weight="650" fill="#913f32">[C] 结束本轮</text><text x="852.5" y="507.5" text-anchor="middle" font-size="15" font-weight="400" fill="#913f32">未独立验收的候选输出</text><rect x="350" y="285" width="270" height="85" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="485.0" y="321.0" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">有配置：检查或再调模型</text><text x="485.0" y="346.0" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">[C] 明确检查 / [M] 评审</text><rect x="350" y="445" width="270" height="88" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="485.0" y="482.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 按实际检查范围交付</text><text x="485.0" y="507.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">不把局部通过扩大为全满足</text><rect x="40" y="445" width="240" height="88" rx="12" fill="#fff0ed" stroke="#c46a5b" stroke-width="1.6"/><text x="160.0" y="482.5" text-anchor="middle" font-size="18" font-weight="650" fill="#913f32">[C] 部分完成 / 待复核</text><text x="160.0" y="507.5" text-anchor="middle" font-size="15" font-weight="400" fill="#913f32">无法判断或无法继续</text><path d="M850 311V437" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#core-arrow)"/><text x="900" y="382" text-anchor="middle" font-size="14" fill="#536673">未配置</text><path d="M735 268H665V326H628" fill="none" stroke="#5a79ba" stroke-width="2.2" marker-end="url(#core-arrow)"/><text x="676" y="245" text-anchor="middle" font-size="14" fill="#536673">有配置</text><path d="M485 370V437" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#core-arrow)"/><text x="540" y="410" text-anchor="middle" font-size="14" fill="#536673">允许交付</text><path d="M395 370V404H160V437" fill="none" stroke="#c46a5b" stroke-width="2.2" marker-end="url(#core-arrow)"/><text x="245" y="424" text-anchor="middle" font-size="14" fill="#913f32">未决 / 资源不足</text><path d="M350 326H150V180" fill="none" stroke="#5a79ba" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#core-arrow)"/><text x="225" y="302" text-anchor="middle" font-size="14" fill="#34508c">需修订且可继续</text></svg>