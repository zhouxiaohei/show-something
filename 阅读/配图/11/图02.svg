<svg role="img" aria-labelledby="products-title products-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 535">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="products-title">模型提出下一步，程序执行并检查能否停</title><desc id="products-desc">模型理解内容并提出下一步，程序执行动作、保存进度和处理收尾；箭头是请求和结果交换，不是性能排名。</desc>
<defs><marker id="products-arrow" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<text x="130" y="28" text-anchor="middle" font-size="15" fill="#536673">四家产品 / 框架</text><text x="435" y="28" text-anchor="middle" font-size="15" fill="#536673">模型决定具体怎么做</text><text x="825" y="28" text-anchor="middle" font-size="15" fill="#536673">程序组织执行与收尾</text><text x="130" y="89" text-anchor="middle" font-size="20" fill="#203947">Hermes</text><text x="130" y="114" text-anchor="middle" font-size="13" fill="#536673">公开固定版本核对</text><rect x="285" y="55" width="300" height="88" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="435.0" y="92.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 写步骤、改查证路线</text><text x="435.0" y="117.5" text-anchor="middle" font-size="15" font-weight="400" fill="#79500e">判断材料还缺什么</text><rect x="675" y="55" width="310" height="88" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="830.0" y="92.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 执行动作、记进度</text><text x="830.0" y="117.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">按已配置检查决定是否继续</text><path d="M585 85H667" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#products-arrow)"/><path d="M20 159H985" stroke="#dde6e9"/><path d="M675 120H593" fill="none" stroke="#bf7a12" stroke-width="2.2" marker-end="url(#products-arrow)"/><text x="130" y="209" text-anchor="middle" font-size="20" fill="#203947">AgentScope</text><text x="130" y="234" text-anchor="middle" font-size="13" fill="#536673">固定版本代码核对</text><rect x="285" y="175" width="300" height="88" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="435.0" y="212.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 选择方向、解释结果</text><text x="435.0" y="237.5" text-anchor="middle" font-size="15" font-weight="400" fill="#79500e">提出继续查或准备交付</text><rect x="675" y="175" width="310" height="88" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="830.0" y="212.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 按当前记录接续工作</text><text x="830.0" y="237.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">执行动作 / 等确认 / 返回答复</text><path d="M585 205H667" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#products-arrow)"/><path d="M20 279H985" stroke="#dde6e9"/><path d="M675 240H593" fill="none" stroke="#bf7a12" stroke-width="2.2" marker-end="url(#products-arrow)"/><text x="130" y="329" text-anchor="middle" font-size="20" fill="#203947">Codex</text><text x="130" y="354" text-anchor="middle" font-size="13" fill="#536673">开源执行代码核对</text><rect x="285" y="295" width="300" height="88" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="435.0" y="332.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 选择操作、解释结果</text><text x="435.0" y="357.5" text-anchor="middle" font-size="15" font-weight="400" fill="#79500e">决定怎样修改、提出答复</text><rect x="675" y="295" width="310" height="88" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="830.0" y="332.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 运行操作、返回真实结果</text><text x="830.0" y="357.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">有未办事项或检查时继续</text><path d="M585 325H667" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#products-arrow)"/><path d="M20 399H985" stroke="#dde6e9"/><path d="M675 360H593" fill="none" stroke="#bf7a12" stroke-width="2.2" marker-end="url(#products-arrow)"/><text x="130" y="449" text-anchor="middle" font-size="20" fill="#203947">Claude Code</text><text x="130" y="474" text-anchor="middle" font-size="13" fill="#536673">官方公开机制核对</text><rect x="285" y="415" width="300" height="88" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="435.0" y="452.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 调查、规划、判断遗漏</text><text x="435.0" y="477.5" text-anchor="middle" font-size="15" font-weight="400" fill="#79500e">额外内容评审也依赖模型</text><rect x="675" y="415" width="310" height="88" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="830.0" y="452.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 准备材料、执行动作</text><text x="830.0" y="477.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">可按配置加一道收尾检查</text><path d="M585 445H667" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#products-arrow)"/><path d="M675 480H593" fill="none" stroke="#bf7a12" stroke-width="2.2" marker-end="url(#products-arrow)"/></svg>