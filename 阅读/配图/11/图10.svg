<svg role="img" aria-labelledby="intel-title intel-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="intel-title">情报研判：最早的计划就可能带入错误假设</title><desc id="intel-desc">构造案例展示竞争解释、材料获取、新证据校准和混合验收。仍缺证据则补查，候选产物进入验收，最后按允许交付、修订或未决分支处理。</desc>
<defs><marker id="intel-arrow" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect x="330" y="18" width="340" height="80" rx="12" fill="#edf2fc" stroke="#5a79ba" stroke-width="1.6"/><text x="500.0" y="51.5" text-anchor="middle" font-size="18" font-weight="650" fill="#34508c">用户问题：航迹消失意味着什么？</text><text x="500.0" y="76.5" text-anchor="middle" font-size="15" font-weight="400" fill="#34508c">构造案例，不是实际情报结论</text><rect x="330" y="145" width="340" height="80" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="500.0" y="178.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 提出暂定竞争解释</text><text x="500.0" y="203.5" text-anchor="middle" font-size="15" font-weight="400" fill="#79500e">覆盖缺失 / 数据故障 / 实体异常</text><path d="M500 98V137" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#intel-arrow)"/><rect x="25" y="280" width="275" height="80" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="162.5" y="313.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 获取覆盖与链路信息</text><text x="162.5" y="338.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">事实和数据局限一起返回</text><rect x="362" y="280" width="275" height="80" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="499.5" y="313.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 获取候选补充观察</text><text x="499.5" y="338.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">独立性待模型或人判断</text><rect x="700" y="280" width="275" height="80" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="837.5" y="313.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 获取公开佐证</text><text x="837.5" y="338.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">保留来源与时间口径</text><path d="M430 225L163 272" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#intel-arrow)"/><path d="M500 225V272" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#intel-arrow)"/><path d="M570 225L837 272" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#intel-arrow)"/><rect x="330" y="415" width="340" height="80" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="500.0" y="448.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 解释新证据并校准</text><text x="500.0" y="473.5" text-anchor="middle" font-size="15" font-weight="400" fill="#79500e">同源页面不能当多份独立证据</text><path d="M163 360L390 407" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#intel-arrow)"/><path d="M500 360V407" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#intel-arrow)"/><path d="M837 360L610 407" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#intel-arrow)"/><rect x="25" y="415" width="235" height="80" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="142.5" y="448.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 重规划</text><text x="142.5" y="473.5" text-anchor="middle" font-size="15" font-weight="400" fill="#79500e">补查独立链路</text><path d="M330 455H268" fill="none" stroke="#bf7a12" stroke-width="2.2" marker-end="url(#intel-arrow)"/><path d="M142 415V368" fill="none" stroke="#bf7a12" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#intel-arrow)"/><text x="300" y="407" text-anchor="middle" font-size="14" fill="#79500e">仍缺证据</text><rect x="725" y="415" width="250" height="80" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="850.0" y="448.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 明确条件检查</text><text x="850.0" y="473.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">[M]/[H] 论证验收</text><path d="M670 455H717" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#intel-arrow)"/><text x="695" y="407" text-anchor="middle" font-size="14" fill="#16574c">候选产物</text><rect x="360" y="655" width="270" height="85" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="495.0" y="691.0" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 按检查范围交付</text><text x="495.0" y="716.0" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">允许交付；仍可保留不确定</text><rect x="710" y="655" width="265" height="85" rx="12" fill="#fff0ed" stroke="#c46a5b" stroke-width="1.6"/><text x="842.5" y="691.0" text-anchor="middle" font-size="18" font-weight="650" fill="#913f32">[C] 部分 / 受阻 / 待复核</text><text x="842.5" y="716.0" text-anchor="middle" font-size="15" font-weight="400" fill="#913f32">不能判定或无法继续</text><path d="M725 475H690V555H142V503" fill="none" stroke="#bf7a12" stroke-width="2.2" marker-end="url(#intel-arrow)"/><text x="430" y="546" text-anchor="middle" font-size="15" fill="#79500e">未通过且仍可继续：补查、修订</text><path d="M850 495V595H495V647" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#intel-arrow)"/><text x="610" y="587" text-anchor="middle" font-size="14" fill="#16574c">允许交付</text><path d="M975 455H991V620H842V647" fill="none" stroke="#c46a5b" stroke-width="2.2" marker-end="url(#intel-arrow)"/><text x="842" y="640" text-anchor="middle" font-size="14" fill="#913f32">无法判断 / 资源不足</text><text x="500" y="787" text-anchor="middle" font-size="17" fill="#913f32">调查交付可以完成，事实仍然不确定；结束调查 ≠ 证明真相</text></svg>