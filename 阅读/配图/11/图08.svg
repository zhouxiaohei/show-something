<svg role="img" aria-labelledby="failure-title failure-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="failure-title">为什么清单全绿，任务仍然没完成</title><desc id="failure-desc">原需求包含ABC，模型只建AB，程序保存并按AB自检形成假完成。独立对照发现C时补做，再次漏解时仍可能假完成。</desc>
<defs><marker id="failure-arrow" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect x="20" y="40" width="165" height="100" rx="12" fill="#edf2fc" stroke="#5a79ba" stroke-width="1.6"/><text x="102.5" y="83.5" text-anchor="middle" font-size="18" font-weight="650" fill="#34508c">原要求</text><text x="102.5" y="108.5" text-anchor="middle" font-size="15" font-weight="400" fill="#34508c">A、B、C</text><rect x="220" y="40" width="165" height="100" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="302.5" y="83.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 漏解</text><text x="302.5" y="108.5" text-anchor="middle" font-size="15" font-weight="400" fill="#79500e">只理解 A、B</text><rect x="420" y="40" width="165" height="100" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="502.5" y="83.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 清单</text><text x="502.5" y="108.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">保存 A、B</text><rect x="620" y="40" width="165" height="100" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="702.5" y="83.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 自检</text><text x="702.5" y="108.5" text-anchor="middle" font-size="15" font-weight="400" fill="#79500e">A、B 均完成</text><rect x="820" y="40" width="165" height="100" rx="12" fill="#fff0ed" stroke="#c46a5b" stroke-width="1.6"/><text x="902.5" y="83.5" text-anchor="middle" font-size="18" font-weight="650" fill="#913f32">假完成</text><text x="902.5" y="108.5" text-anchor="middle" font-size="15" font-weight="400" fill="#913f32">宣称全部完成</text><path d="M185 90H212" fill="none" stroke="#c46a5b" stroke-width="2.2" marker-end="url(#failure-arrow)"/><path d="M385 90H412" fill="none" stroke="#c46a5b" stroke-width="2.2" marker-end="url(#failure-arrow)"/><path d="M585 90H612" fill="none" stroke="#c46a5b" stroke-width="2.2" marker-end="url(#failure-arrow)"/><path d="M785 90H812" fill="none" stroke="#c46a5b" stroke-width="2.2" marker-end="url(#failure-arrow)"/><rect x="245" y="240" width="510" height="84" rx="12" fill="#edf2fc" stroke="#5a79ba" stroke-width="1.6"/><text x="500.0" y="275.5" text-anchor="middle" font-size="18" font-weight="650" fill="#34508c">独立对照原需求与实际证据，才有机会发现 C</text><text x="500.0" y="300.5" text-anchor="middle" font-size="15" font-weight="400" fill="#34508c">评审模型或人仍可能再次漏解</text><path d="M102 141V282H237" fill="none" stroke="#5a79ba" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#failure-arrow)"/><rect x="735" y="385" width="250" height="75" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="860.0" y="416.0" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">发现 C：补做或修订</text><text x="860.0" y="441.0" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">重新进入执行与验证</text><path d="M755 282H860V377" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#failure-arrow)"/><text x="866" y="349" text-anchor="middle" font-size="14" fill="#16574c">发现遗漏</text><path d="M500 240V178H902V148" fill="none" stroke="#c46a5b" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#failure-arrow)"/><text x="734" y="169" text-anchor="middle" font-size="14" fill="#913f32">再次漏解时</text><text x="500" y="198" text-anchor="middle" font-size="18" fill="#913f32">后续全部忠实执行，也不能补上最初从未登记的要求</text></svg>