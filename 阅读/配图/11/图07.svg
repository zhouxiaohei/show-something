<svg role="img" aria-labelledby="acceptance-title acceptance-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 485">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="acceptance-title">候选答复之后的四条验收路径</title><desc id="acceptance-desc">普通收尾不保证独立复核。同一模型复核、独立模型评审需要显式调用。代码可以核验明确的实质条件。</desc>
<defs><marker id="acceptance-arrow" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<text x="125" y="55" text-anchor="middle" font-size="17" fill="#203947">A 自行收尾</text><rect x="265" y="25" width="310" height="73" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="420.0" y="67.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 接受正常候选输出</text><rect x="650" y="25" width="320" height="73" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="810.0" y="67.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">结束本轮</text><path d="M575 61H642" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#acceptance-arrow)"/><text x="805" y="122" text-anchor="middle" font-size="14" fill="#913f32">没有额外调用保证</text><text x="125" y="167" text-anchor="middle" font-size="17" fill="#203947">B 同一模型复核</text><rect x="265" y="137" width="310" height="73" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="420.0" y="179.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 强制再发一次请求</text><rect x="650" y="137" width="320" height="73" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="810.0" y="179.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 复核自己的结果</text><path d="M575 173H642" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#acceptance-arrow)"/><text x="805" y="234" text-anchor="middle" font-size="14" fill="#913f32">有调用；仍可能沿用误解</text><text x="125" y="279" text-anchor="middle" font-size="17" fill="#203947">C 独立评审</text><rect x="265" y="249" width="310" height="73" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="420.0" y="291.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 另调评审并给证据</text><rect x="650" y="249" width="320" height="73" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="810.0" y="291.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 检查遗漏与论证</text><path d="M575 285H642" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#acceptance-arrow)"/><text x="805" y="346" text-anchor="middle" font-size="14" fill="#913f32">有调用；评审也可能错</text><text x="125" y="391" text-anchor="middle" font-size="17" fill="#203947">D 代码检查 / 混合</text><rect x="265" y="361" width="310" height="73" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="420.0" y="403.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 测试、规则、环境状态</text><rect x="650" y="361" width="320" height="73" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="810.0" y="403.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 检查条件并分支</text><path d="M575 397H642" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#acceptance-arrow)"/><text x="805" y="458" text-anchor="middle" font-size="14" fill="#913f32">内容项按配置交模型或人</text></svg>