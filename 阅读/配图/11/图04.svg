<svg role="img" aria-labelledby="timeline-title timeline-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="timeline-title">不是每个概念阶段都额外调用一次模型</title><desc id="timeline-desc">一个构造实例中三次正常模型调用与工具执行交织，候选答复后的第四次复核仅在配置时发生。</desc>
<defs><marker id="timeline-arrow" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<text x="500" y="30" text-anchor="middle" font-size="17" fill="#203947">构造回放：对照两份材料，解释矛盾并列未决问题</text><rect x="30" y="70" width="210" height="82" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="135.0" y="104.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 准备</text><text x="135.0" y="129.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">输入与规则</text><rect x="270" y="70" width="210" height="82" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="375.0" y="104.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 调用 1</text><text x="375.0" y="129.5" text-anchor="middle" font-size="15" font-weight="400" fill="#79500e">先读取材料</text><rect x="510" y="70" width="210" height="82" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="615.0" y="104.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 执行</text><text x="615.0" y="129.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">返回实际内容</text><rect x="750" y="70" width="210" height="82" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="855.0" y="104.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 调用 2</text><text x="855.0" y="129.5" text-anchor="middle" font-size="15" font-weight="400" fill="#79500e">发现口径问题</text><path d="M240 111H262" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#timeline-arrow)"/><path d="M480 111H502" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#timeline-arrow)"/><path d="M720 111H742" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#timeline-arrow)"/><rect x="750" y="230" width="210" height="82" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="855.0" y="264.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 再执行</text><text x="855.0" y="289.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">核对口径与日期</text><rect x="510" y="230" width="210" height="82" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="615.0" y="264.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 调用 3</text><text x="615.0" y="289.5" text-anchor="middle" font-size="15" font-weight="400" fill="#79500e">解释与候选答复</text><rect x="270" y="230" width="210" height="82" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="375.0" y="264.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 收尾</text><text x="375.0" y="289.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">有无额外复核配置？</text><rect x="30" y="230" width="210" height="82" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="135.0" y="264.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 可选调用 4</text><text x="135.0" y="289.5" text-anchor="middle" font-size="15" font-weight="400" fill="#79500e">按原要求复核遗漏</text><path d="M855 152V223" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#timeline-arrow)"/><path d="M750 271H728" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#timeline-arrow)"/><path d="M510 271H488" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#timeline-arrow)"/><path d="M270 271H248" fill="none" stroke="#5a79ba" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#timeline-arrow)"/><text x="500" y="367" text-anchor="middle" font-size="17" fill="#79500e">调用 2 可以同时：读懂结果 → 发现新问题 → 改步骤 → 选择下一动作</text></svg>