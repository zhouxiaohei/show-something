<svg role="img" aria-labelledby="organization-title organization-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="organization-title">拆任务不等于预设工作流</title><desc id="organization-desc">比较人预设流程、模型自主循环和混合系统，模型自主循环通过观察持续选择下一步。</desc>
<defs><marker id="organization-arrow" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<text x="30" y="38" text-anchor="start" font-size="18" fill="#34508c">人预设流程</text><rect x="200" y="12" width="210" height="75" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="305.0" y="43.0" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 预定节点与规则</text><text x="305.0" y="68.0" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">步骤主要由人设计</text><rect x="475" y="12" width="210" height="75" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="580.0" y="43.0" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 完成节点任务</text><text x="580.0" y="68.0" text-anchor="middle" font-size="15" font-weight="400" fill="#79500e">仍可在节点内探索</text><rect x="750" y="12" width="210" height="75" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="855.0" y="43.0" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 按条件推进</text><text x="855.0" y="68.0" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">条件也可能调用模型</text><path d="M410 50H467" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#organization-arrow)"/><path d="M685 50H742" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#organization-arrow)"/><text x="30" y="170" text-anchor="start" font-size="18" fill="#79500e">模型自主 loop</text><rect x="200" y="132" width="210" height="85" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="305.0" y="168.0" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 提供目标与观察</text><text x="305.0" y="193.0" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">没有完整预设解题步骤</text><rect x="475" y="132" width="210" height="85" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="580.0" y="168.0" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 决定下一步</text><text x="580.0" y="193.0" text-anchor="middle" font-size="15" font-weight="400" fill="#79500e">必要时拆计划或改计划</text><rect x="750" y="132" width="210" height="85" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="855.0" y="168.0" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 执行并保存结果</text><text x="855.0" y="193.0" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">动作结果回到模型</text><path d="M410 175H467" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#organization-arrow)"/><path d="M685 175H742" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#organization-arrow)"/><path d="M855 219V256H580V221" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#organization-arrow)"/><text x="720" y="280" text-anchor="middle" font-size="15" fill="#536673">计划可以边查边形成，不要求先列完整任务树</text><text x="500" y="332" text-anchor="middle" font-size="17" fill="#16574c">混合系统：外层规定必须经过的阶段，阶段内部交给模型动态处理</text></svg>