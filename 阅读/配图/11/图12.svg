<svg role="img" aria-labelledby="grill-title grill-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="grill-title">grill 是规则驱动的问答循环，问题由模型生成</title><desc id="grill-desc">程序提供技能规则和对话，模型提出一轮问题或判断可以收尾；用户回答进入下一轮。仅等待不需要持续调用模型，一轮可有多题。</desc>
<defs><marker id="grill-arrow" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect x="30" y="45" width="275" height="90" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="167.5" y="83.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 准备规则与当前对话</text><text x="167.5" y="108.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">发起模型处理</text><rect x="365" y="45" width="275" height="90" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="502.5" y="83.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 理解回答与未决问题</text><text x="502.5" y="108.5" text-anchor="middle" font-size="15" font-weight="400" fill="#79500e">提出下一轮，或认为可以收尾</text><rect x="705" y="45" width="270" height="90" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="840.0" y="83.5" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 显示本轮问题</text><text x="840.0" y="108.5" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">保存对话，等待用户</text><path d="M305 90H357" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#grill-arrow)"/><path d="M640 90H697" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#grill-arrow)"/><text x="673" y="32" text-anchor="middle" font-size="14" fill="#79500e">还要追问</text><rect x="705" y="245" width="270" height="85" rx="12" fill="#edf2fc" stroke="#5a79ba" stroke-width="1.6"/><text x="840.0" y="281.0" text-anchor="middle" font-size="18" font-weight="650" fill="#34508c">[H] 用户回答</text><text x="840.0" y="306.0" text-anchor="middle" font-size="15" font-weight="400" fill="#34508c">可一起回答多道题</text><rect x="365" y="245" width="275" height="85" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="502.5" y="281.0" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 把新回答加入输入</text><text x="502.5" y="306.0" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">规则可继续使用，不必重读文件</text><rect x="30" y="245" width="275" height="85" rx="12" fill="#eaf6f2" stroke="#278572" stroke-width="1.6"/><text x="167.5" y="281.0" text-anchor="middle" font-size="18" font-weight="650" fill="#16574c">[C] 显示总结或确认请求</text><text x="167.5" y="306.0" text-anchor="middle" font-size="15" font-weight="400" fill="#16574c">文字要求不等于代码审批门</text><path d="M840 135V237" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#grill-arrow)"/><text x="864" y="195" text-anchor="middle" font-size="14" fill="#34508c">仅等待不需持续推理</text><path d="M705 287H648" fill="none" stroke="#5a79ba" stroke-width="2.2" marker-end="url(#grill-arrow)"/><path d="M500 330V385H15V20H168V37" fill="none" stroke="#5a79ba" stroke-width="2.2" marker-end="url(#grill-arrow)"/><text x="345" y="408" text-anchor="middle" font-size="15" fill="#34508c">回答改变了输入，下一轮由模型理解并生成</text><path d="M365 100H330V287H313" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#grill-arrow)"/><text x="164" y="215" text-anchor="middle" font-size="14" fill="#16574c">模型认为问题已解决时</text><text x="500" y="465" text-anchor="middle" font-size="17" fill="#203947">技能规定怎么问；模型决定具体问什么；程序组织调用。题目数不等于 API 请求数。</text></svg>