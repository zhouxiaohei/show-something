<svg role="img" aria-labelledby="human-title human-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 405">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="human-title">任务最后做成了，可能包含大量人工判断与编排劳动</title><desc id="human-desc">当模型整体能力不足，人承担目标解释、拆分、排序、检查和重规划，再把窄任务交给模型。</desc>
<defs><marker id="human-arrow" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect x="35" y="40" width="280" height="88" rx="12" fill="#fff0ed" stroke="#c46a5b" stroke-width="1.6"/><text x="175.0" y="77.5" text-anchor="middle" font-size="18" font-weight="650" fill="#913f32">模型无法稳定保持整体目标</text><text x="175.0" y="102.5" text-anchor="middle" font-size="15" font-weight="400" fill="#913f32">复杂度或反馈超出可靠能力</text><rect x="365" y="40" width="275" height="88" rx="12" fill="#edf2fc" stroke="#5a79ba" stroke-width="1.6"/><text x="502.5" y="77.5" text-anchor="middle" font-size="18" font-weight="650" fill="#34508c">[H] 接管外层编排</text><text x="502.5" y="102.5" text-anchor="middle" font-size="15" font-weight="400" fill="#34508c">理解 / 拆分 / 排序</text><rect x="700" y="40" width="265" height="88" rx="12" fill="#fff4df" stroke="#bf7a12" stroke-width="1.6"/><text x="832.5" y="77.5" text-anchor="middle" font-size="18" font-weight="650" fill="#79500e">[M] 执行较窄子任务</text><text x="832.5" y="102.5" text-anchor="middle" font-size="15" font-weight="400" fill="#79500e">返回中间答案</text><path d="M315 84H357" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#human-arrow)"/><path d="M640 84H692" fill="none" stroke="#278572" stroke-width="2.2" marker-end="url(#human-arrow)"/><rect x="365" y="225" width="275" height="88" rx="12" fill="#edf2fc" stroke="#5a79ba" stroke-width="1.6"/><text x="502.5" y="262.5" text-anchor="middle" font-size="18" font-weight="650" fill="#34508c">[H] 检查并重新定计划</text><text x="502.5" y="287.5" text-anchor="middle" font-size="15" font-weight="400" fill="#34508c">判断答案 / 保持旧约束</text><path d="M830 128V268H648" fill="none" stroke="#5a79ba" stroke-width="2.2" marker-end="url(#human-arrow)"/><path d="M500 225V136" fill="none" stroke="#5a79ba" stroke-width="2.2" marker-end="url(#human-arrow)"/><text x="220" y="268" text-anchor="middle" font-size="17" fill="#34508c">人承担了反馈控制</text><text x="500" y="369" text-anchor="middle" font-size="18" fill="#203947">衡量系统价值：最终质量 + 人的表达、监督、纠偏与恢复成本</text></svg>