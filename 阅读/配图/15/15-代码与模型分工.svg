<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="代码与模型分工速查表" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><title>代码与模型分工速查表</title><rect width="960" height="640" fill="white"/><rect x="30" y="40" width="330" height="50" fill="#eef1f5" stroke="#d0d7de" stroke-width="1"/><rect x="360" y="40" width="140" height="50" fill="#eef1f5" stroke="#d0d7de" stroke-width="1"/><rect x="500" y="40" width="430" height="50" fill="#eef1f5" stroke="#d0d7de" stroke-width="1"/><text x="195" y="65" text-anchor="middle" fill="#53677d" font-size="17" font-weight="650">环节</text><text x="430" y="65" text-anchor="middle" fill="#53677d" font-size="17" font-weight="650">谁判</text><text x="715" y="65" text-anchor="middle" fill="#53677d" font-size="17" font-weight="650">为什么这么分</text><g font-size="15" font-weight="500"><rect x="30" y="90" width="330" height="64" fill="white" stroke="#d0d7de" stroke-width="1"/><rect x="360" y="90" width="140" height="64" fill="#edf4ff" stroke="#d0d7de" stroke-width="1"/><rect x="500" y="90" width="430" height="64" fill="white" stroke="#d0d7de" stroke-width="1"/><text x="195" y="122" text-anchor="middle" fill="#31414f">白名单、去重、@ 识别</text><text x="430" y="122" text-anchor="middle" fill="#2563eb" font-weight="650">代码</text><text x="715" y="122" text-anchor="middle" fill="#53677d">答案唯一，判错会引发机器人互相触发的死循环</text><rect x="30" y="154" width="330" height="64" fill="#fafbfc" stroke="#d0d7de" stroke-width="1"/><rect x="360" y="154" width="140" height="64" fill="#ebf9f5" stroke="#d0d7de" stroke-width="1"/><rect x="500" y="154" width="430" height="64" fill="#fafbfc" stroke="#d0d7de" stroke-width="1"/><text x="195" y="186" text-anchor="middle" fill="#31414f">接不接单的语义研判</text><text x="430" y="186" text-anchor="middle" fill="#087f75" font-weight="650">模型</text><text x="715" y="186" text-anchor="middle" fill="#53677d">只有语义理解能判断“这是不是在派活”</text><rect x="30" y="218" width="330" height="64" fill="white" stroke="#d0d7de" stroke-width="1"/><rect x="360" y="218" width="140" height="64" fill="#edf4ff" stroke="#d0d7de" stroke-width="1"/><rect x="500" y="218" width="430" height="64" fill="white" stroke="#d0d7de" stroke-width="1"/><text x="195" y="250" text-anchor="middle" fill="#31414f">消息归属路由（纯函数）</text><text x="430" y="250" text-anchor="middle" fill="#2563eb" font-weight="650">代码</text><text x="715" y="250" text-anchor="middle" fill="#53677d">归属必须确定、可测试；路由从状态推导，不存标志位</text><rect x="30" y="282" width="330" height="64" fill="#fafbfc" stroke="#d0d7de" stroke-width="1"/><rect x="360" y="282" width="140" height="64" fill="#ebf9f5" stroke="#d0d7de" stroke-width="1"/><rect x="500" y="282" width="430" height="64" fill="#fafbfc" stroke="#d0d7de" stroke-width="1"/><text x="195" y="314" text-anchor="middle" fill="#31414f">读代码、改代码、跑测试</text><text x="430" y="314" text-anchor="middle" fill="#087f75" font-weight="650">模型</text><text x="715" y="314" text-anchor="middle" fill="#53677d">干活本身，只有语义理解能承担</text><rect x="30" y="346" width="330" height="64" fill="white" stroke="#d0d7de" stroke-width="1"/><rect x="360" y="346" width="140" height="64" fill="#edf4ff" stroke="#d0d7de" stroke-width="1"/><rect x="500" y="346" width="430" height="64" fill="white" stroke="#d0d7de" stroke-width="1"/><text x="195" y="378" text-anchor="middle" fill="#31414f">独立目录、5 秒转后台、30 分钟看护</text><text x="430" y="378" text-anchor="middle" fill="#2563eb" font-weight="650">代码</text><text x="715" y="378" text-anchor="middle" fill="#53677d">模型不自知、不守时，硬机制负责兜底</text><rect x="30" y="410" width="330" height="64" fill="#fafbfc" stroke="#d0d7de" stroke-width="1"/><rect x="360" y="410" width="140" height="64" fill="#ebf9f5" stroke="#d0d7de" stroke-width="1"/><rect x="500" y="410" width="430" height="64" fill="#fafbfc" stroke="#d0d7de" stroke-width="1"/><text x="195" y="442" text-anchor="middle" fill="#31414f">有无实质进展、是否跑偏</text><text x="430" y="442" text-anchor="middle" fill="#087f75" font-weight="650">模型</text><text x="715" y="442" text-anchor="middle" fill="#53677d">“进展”是语义判断；它管对错倾向，不管卡死</text><rect x="30" y="474" width="330" height="64" fill="white" stroke="#d0d7de" stroke-width="1"/><rect x="360" y="474" width="140" height="64" fill="#edf4ff" stroke="#d0d7de" stroke-width="1"/><rect x="500" y="474" width="430" height="64" fill="white" stroke="#d0d7de" stroke-width="1"/><text x="195" y="506" text-anchor="middle" fill="#31414f">授权凭据、规则版本、影子开关</text><text x="430" y="506" text-anchor="middle" fill="#2563eb" font-weight="650">代码</text><text x="715" y="506" text-anchor="middle" fill="#53677d">权限必须可审计，不能依赖模型自觉</text></g><text x="480" y="590" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">规律：模型每次出场都是“判断”，判断完立刻退场；上场、落地、收尾全是代码。</text></svg>
