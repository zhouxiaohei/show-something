<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 425" role="img" aria-label="管理负担转移的收益与代价" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><title>管理负担转移的收益与代价</title><defs><marker id="2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="087f75" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087f75"/></marker><marker id="b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/></marker></defs><rect width="960" height="425" fill="white"/><rect x="35" y="65" width="350" height="90" rx="13" fill="#fff5e7" stroke="#b45309" stroke-width="1.3"/><text x="210.0" y="97" text-anchor="middle" fill="#b45309" font-size="19" font-weight="650">原来由人反复管理</text><text x="210.0" y="124" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">找会话 · 传背景 · 问进度</text><rect x="575" y="65" width="350" height="90" rx="13" fill="#ebf9f5" stroke="#087f75" stroke-width="1.3"/><text x="750.0" y="97" text-anchor="middle" fill="#087f75" font-size="19" font-weight="650">系统保存工作归属</text><text x="750.0" y="124" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">路由 · 工单 · 订阅</text><path d="M385 110 L575 110" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#2563eb)"/><rect x="110" y="250" width="740" height="88" rx="13" fill="#f3f6fa" stroke="#53677d" stroke-width="1.3"/><text x="480.0" y="282" text-anchor="middle" fill="#53677d" font-size="19" font-weight="650">随之增加的程序责任</text><text x="480.0" y="309" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">模型误路由 · 状态一致性 · 来源运维 · 失败恢复</text><path d="M750 155 L750 250" fill="none" stroke="#087f75" stroke-width="2" marker-end="url(#087f75)"/><path d="M210 155 L210 250" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#b45309)"/><text x="480" y="392" text-anchor="middle" fill="#53677d" font-size="18" font-weight="500">收益需要用减少的人工管理，对照新增系统成本来判断</text></svg>