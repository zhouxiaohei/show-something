<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 545" role="img" aria-label="会话之外的持续工作流程"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#718b9c"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:19px;font-weight:650;fill:#263f50}.h{font-size:16px;font-weight:650;fill:#263f50}.small{font-size:13px;fill:#3f596a}.note{font-size:12px;fill:#66808f}</style><rect width="100%" height="100%" fill="#f7fafb"/><text class="title" x="40" y="42">会话之外：一条工作怎么被接住并持续推进</text><rect x="40" y="84" width="205" height="88" rx="12" fill="#e8f0f6" stroke="#bdccd7"/><text class="h" x="142.5" y="114" text-anchor="middle">新消息</text><text class="small" x="142.5" y="140" text-anchor="middle">邮件 / 消息 / 文件</text><path d="M246 128L285 128" stroke="#7891a3" stroke-width="1.8" marker-end="url(#arr)"/><rect x="290" y="84" width="205" height="88" rx="12" fill="#e5f2ed" stroke="#bdccd7"/><text class="h" x="392.5" y="114" text-anchor="middle">来源准入与授权</text><text class="small" x="392.5" y="140" text-anchor="middle">谁可发起？是否合规？</text><path d="M496 128L535 128" stroke="#7891a3" stroke-width="1.8" marker-end="url(#arr)"/><rect x="540" y="84" width="205" height="88" rx="12" fill="#e8f0f6" stroke="#bdccd7"/><text class="h" x="642.5" y="114" text-anchor="middle">路由</text><text class="small" x="642.5" y="140" text-anchor="middle">匹配已有工单 / 建新单</text><path d="M746 128L785 128" stroke="#7891a3" stroke-width="1.8" marker-end="url(#arr)"/><rect x="790" y="84" width="205" height="88" rx="12" fill="#e8f0f6" stroke="#bdccd7"/><text class="h" x="892.5" y="114" text-anchor="middle">工单库</text><text class="small" x="892.5" y="140" text-anchor="middle">目标、授权、状态</text><path d="M890 172L890 228" stroke="#7891a3" stroke-width="1.8" marker-end="url(#arr)"/><rect x="40" y="230" width="260" height="92" rx="12" fill="#f0f3f1" stroke="#bdccd7"/><text class="h" x="170.0" y="260" text-anchor="middle">执行器推进</text><text class="small" x="170.0" y="286" text-anchor="middle">已授权动作 / 记录证据</text><path d="M301 276L355 276" stroke="#7891a3" stroke-width="1.8" marker-end="url(#arr)"/><rect x="360" y="230" width="260" height="92" rx="12" fill="#f0f3f1" stroke="#bdccd7"/><text class="h" x="490.0" y="260" text-anchor="middle">健康检查与恢复</text><text class="small" x="490.0" y="286" text-anchor="middle">进程、中断、外部状态</text><path d="M621 276L675 276" stroke="#7891a3" stroke-width="1.8" marker-end="url(#arr)"/><rect x="680" y="230" width="260" height="92" rx="12" fill="#e5f2ed" stroke="#bdccd7"/><text class="h" x="810.0" y="260" text-anchor="middle">业务验收</text><text class="small" x="810.0" y="286" text-anchor="middle">证据 / 判断是否合格</text><rect x="40" y="354" width="260" height="132" rx="12" fill="#e5f2ed" stroke="#a9cdbd"/><text class="h" x="170" y="381" text-anchor="middle">程序能检查</text><text class="small" x="58" y="408">• 路由目标、授权名单</text><text class="small" x="58" y="432">• 消息抵达、进程状态</text><text class="small" x="58" y="456">• 必填记录是否完整</text><rect x="360" y="354" width="260" height="132" rx="12" fill="#eaf0f8" stroke="#a8bccf"/><text class="h" x="490" y="381" text-anchor="middle">模型 / 人判断</text><text class="small" x="378" y="408">• 任务是否值得做</text><text class="small" x="378" y="432">• 解释是否合理</text><text class="small" x="378" y="456">• 交付是否满足业务目标</text><rect x="680" y="354" width="260" height="132" rx="12" fill="#faeee6" stroke="#dcb19f"/><text class="h" x="810" y="381" text-anchor="middle">必须另验失败</text><text class="small" x="698" y="408">• 错投、重复执行</text><text class="small" x="698" y="432">• 外部副作用</text><text class="small" x="698" y="456">• 恢复后状态不一致</text><text class="note" x="40" y="521">流程来自公开研究原型的设计取舍；它说明组织机制，不表示任意消息都会被正确理解或所有失败都能自动恢复。</text></svg>