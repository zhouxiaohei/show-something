<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="授权三档信任坡道" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><title>授权三档信任坡道</title><defs><marker id="arr-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/></marker></defs><rect width="960" height="400" fill="white"/><rect x="60" y="250" width="240" height="110" rx="13" fill="#edf4ff" stroke="#2563eb" stroke-width="1.3"/><text x="180" y="290" text-anchor="middle" fill="#2563eb" font-size="19" font-weight="650">off</text><text x="180" y="320" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">不接主动工作</text><text x="180" y="344" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">仅回应白名单内的指派</text><rect x="360" y="160" width="240" height="200" rx="13" fill="#ebf9f5" stroke="#087f75" stroke-width="1.8"/><text x="480" y="200" text-anchor="middle" fill="#087f75" font-size="19" font-weight="650">observe（默认）</text><text x="480" y="230" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">照常研判并记录</text><text x="480" y="254" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">“我本来会接这单”</text><text x="480" y="286" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">一行代码不动</text><text x="480" y="322" text-anchor="middle" fill="#087f75" font-size="15" font-weight="650">默认停留在这档</text><rect x="660" y="70" width="240" height="290" rx="13" fill="#fff7e8" stroke="#b45309" stroke-width="1.3"/><text x="780" y="110" text-anchor="middle" fill="#b45309" font-size="19" font-weight="650">auto</text><text x="780" y="140" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">自动接单、执行、提 PR</text><text x="780" y="172" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">人审观察记录后手动放行</text><text x="780" y="212" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">规则收紧时，revalidate</text><text x="780" y="236" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">钩子可挡住已结束工单恢复</text><text x="780" y="290" text-anchor="middle" fill="#b45309" font-size="15" font-weight="650">权限是逐级挣来的</text><path d="M300 260 L352 230" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arr-t)"/><path d="M600 200 L652 170" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arr-t)"/><text x="480" y="384" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">先证明判断靠谱，人才交出执行权；随表现放开，而不是一次给足。</text></svg>
