<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="权限设计四层流水线" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><title>权限设计四层流水线</title><defs><marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><rect width="960" height="470" fill="white"/><rect x="30" y="60" width="200" height="120" rx="13" fill="#edf4ff" stroke="#2563eb" stroke-width="1.3"/><text x="130" y="98" text-anchor="middle" fill="#2563eb" font-size="19" font-weight="650">① 名单与规则</text><text x="130" y="128" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">谁有权指挥，显式声明</text><text x="130" y="154" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">白名单成员或书面规则</text><rect x="258" y="60" width="200" height="120" rx="13" fill="#edf4ff" stroke="#2563eb" stroke-width="1.3"/><text x="358" y="98" text-anchor="middle" fill="#2563eb" font-size="19" font-weight="650">② 两级过滤</text><text x="358" y="128" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">规则先筛资格</text><text x="358" y="154" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">模型再判语义</text><rect x="486" y="60" width="200" height="120" rx="13" fill="#fff7e8" stroke="#b45309" stroke-width="1.6"/><text x="586" y="98" text-anchor="middle" fill="#b45309" font-size="19" font-weight="650">③ 工单 + Mandate</text><text x="586" y="128" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">不可变委托书</text><text x="586" y="154" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">谁派的·哪版规则·做到哪</text><rect x="714" y="60" width="216" height="120" rx="13" fill="#ebf9f5" stroke="#087f75" stroke-width="1.3"/><text x="822" y="98" text-anchor="middle" fill="#087f75" font-size="19" font-weight="650">④ 默认旁观</text><text x="822" y="128" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">只记录“本来会做什么”</text><text x="822" y="154" text-anchor="middle" fill="#53677d" font-size="15" font-weight="500">人审记录后手动放行</text><path d="M230 120 L256 120" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b)"/><path d="M458 120 L484 120" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b)"/><path d="M686 120 L712 120" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b)"/><rect x="30" y="230" width="290" height="130" rx="13" fill="#f5f7fa" stroke="#d0d7de" stroke-width="1"/><text x="175" y="266" text-anchor="middle" fill="#53677d" font-size="16" font-weight="650">事件 ≠ 权限</text><text x="175" y="294" text-anchor="middle" fill="#53677d" font-size="14" font-weight="500">收到消息不扩大授权</text><text x="175" y="318" text-anchor="middle" fill="#53677d" font-size="14" font-weight="500">主动工作默认只记录不执行</text><rect x="335" y="230" width="290" height="130" rx="13" fill="#f5f7fa" stroke="#d0d7de" stroke-width="1"/><text x="480" y="266" text-anchor="middle" fill="#53677d" font-size="16" font-weight="650">可审计</text><text x="480" y="294" text-anchor="middle" fill="#53677d" font-size="14" font-weight="500">每次接单固化为带版本号的凭据</text><text x="480" y="318" text-anchor="middle" fill="#53677d" font-size="14" font-weight="500">事后能还原“当时依据什么”</text><rect x="640" y="230" width="290" height="130" rx="13" fill="#f5f7fa" stroke="#d0d7de" stroke-width="1"/><text x="785" y="266" text-anchor="middle" fill="#53677d" font-size="16" font-weight="650">注意力预算</text><text x="785" y="294" text-anchor="middle" fill="#53677d" font-size="14" font-weight="500">命令 5 秒转后台 · 后台 30 分钟封顶</text><text x="785" y="318" text-anchor="middle" fill="#53677d" font-size="14" font-weight="500">面板只列需要人处理的事</text><path d="M175 215 V228" fill="none" stroke="#d0d7de" stroke-width="1.5"/><path d="M480 215 V228" fill="none" stroke="#d0d7de" stroke-width="1.5"/><path d="M785 215 V228" fill="none" stroke="#d0d7de" stroke-width="1.5"/><text x="480" y="410" text-anchor="middle" fill="#53677d" font-size="14" font-weight="500">四层都不是靠提示词“劝告”，而是由宿主代码落成状态与硬机制；个别约束仍是提示词级别（见正文 6.5）。</text></svg>
