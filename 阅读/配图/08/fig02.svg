<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm08-2-title dm08-2-desc"><title id="dm08-2-title">任务卡解剖</title><desc id="dm08-2-desc">一张退款任务卡的四个组成部分：业务终态、不可接受副作用、对外表达、资源边界，并标注资金安全约束由服务端幂等键保证。</desc><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="38" font-size="22" fill="#34475b">一张任务卡把"做对"拆成四个可观察条件</text><rect x="30" y="70" width="900" height="90" rx="12" fill="#eef3f7" stroke="#5b7a99" stroke-width="2"/><text x="55" y="105" font-size="19" fill="#2c4a68" font-weight="bold">业务终态</text><text x="55" y="135" font-size="17" fill="#34475b">订单最终处于已退款状态，资金动作在支付系统可核对——不是回复里说"已退款"</text><rect x="30" y="180" width="900" height="90" rx="12" fill="#fdf0ef" stroke="#b0605a" stroke-width="2"/><text x="55" y="215" font-size="19" fill="#7a3a34" font-weight="bold">不可接受副作用（不变量）</text><text x="55" y="245" font-size="17" fill="#34475b">不越权读其他商户订单 · 同一请求至多退一次款——退款不可逆，靠服务端幂等键保证，不靠提示词</text><rect x="30" y="290" width="900" height="90" rx="12" fill="#eef7f2" stroke="#4a8a6a" stroke-width="2"/><text x="55" y="325" font-size="19" fill="#2c5a42" font-weight="bold">对外表达</text><text x="55" y="355" font-size="17" fill="#34475b">回复与实际结果一致；失败时明确说明失败，不得声称未发生的退款已完成</text><rect x="30" y="400" width="900" height="90" rx="12" fill="#f2f0fa" stroke="#6a5a9a" stroke-width="2"/><text x="55" y="435" font-size="19" fill="#3a2c68" font-weight="bold">资源边界（次级约束）</text><text x="55" y="465" font-size="17" fill="#34475b">工具调用 ≤6 次、时延与成本上限——影响能否发布，但不能用低成本掩盖错误终态</text><text x="30" y="530" font-size="16" fill="#7a8a99">比较条件另登记：模型/提示词/工具/评分器版本、环境快照、计费口径；同时换多个变量只能评价"整套组合"。</text></g></svg>