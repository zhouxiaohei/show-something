<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm08-3-title dm08-3-desc"><title id="dm08-3-title">三类评分器分工</title><desc id="dm08-3-desc">代码评分器、模型评分器、人工评分器各自适合检查的内容、主要风险与必须补的检查。</desc><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="38" font-size="22" fill="#34475b">三类评分器：可执行的不变量给代码，开放表达才用语义判断</text><rect x="30" y="75" width="290" height="380" rx="14" fill="#eef3f7" stroke="#5b7a99" stroke-width="2"/><text x="50" y="112" font-size="19" fill="#2c4a68" font-weight="bold">代码 / 状态评分器</text><text x="50" y="145" font-size="16" fill="#34475b">查：终态、字段、权限、</text><text x="50" y="170" font-size="16" fill="#34475b">工具参数、调用次数</text><text x="50" y="215" font-size="16" fill="#8a5a5a">风险：断言写错或过死</text><text x="50" y="240" font-size="16" fill="#8a5a5a">断言过期、覆盖假象</text><text x="50" y="285" font-size="16" fill="#2c5a42">补：正例反例核对断言</text><text x="50" y="310" font-size="16" fill="#2c5a42">断言跟随 schema 登记</text><rect x="335" y="75" width="290" height="380" rx="14" fill="#eef7f2" stroke="#4a8a6a" stroke-width="2"/><text x="355" y="112" font-size="19" fill="#2c5a42" font-weight="bold">模型评分器</text><text x="355" y="145" font-size="16" fill="#34475b">查：语气、解释、</text><text x="355" y="170" font-size="16" fill="#34475b">开放式表达质量</text><text x="355" y="215" font-size="16" fill="#8a5a5a">风险：位置/冗长/自增强</text><text x="355" y="240" font-size="16" fill="#8a5a5a">三种系统性偏差（图04）</text><text x="355" y="285" font-size="16" fill="#2c5a42">补：固定量规 + 人工校准</text><text x="355" y="310" font-size="16" fill="#2c5a42">允许回答 Unknown</text><rect x="640" y="75" width="290" height="380" rx="14" fill="#f2f0fa" stroke="#6a5a9a" stroke-width="2"/><text x="660" y="112" font-size="19" fill="#3a2c68" font-weight="bold">人工评分器</text><text x="660" y="145" font-size="16" fill="#34475b">查：高风险判断、</text><text x="660" y="170" font-size="16" fill="#34475b">含糊样本的裁决</text><text x="660" y="215" font-size="16" fill="#8a5a5a">风险：成本高、</text><text x="660" y="240" font-size="16" fill="#8a5a5a">评审者标准不一</text><text x="660" y="285" font-size="16" fill="#2c5a42">补：统一标注规则</text><text x="660" y="310" font-size="16" fill="#2c5a42">记录分歧并抽查</text><text x="30" y="510" font-size="16" fill="#7a8a99">评分器是闭环里唯一"给所有东西打分"的组件——它的失效会伪装成被评对象的失效。</text></g></svg>