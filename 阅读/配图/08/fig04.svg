<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm08-4-title dm08-4-desc"><title id="dm08-4-title">模型评分器的三种系统性偏差</title><desc id="dm08-4-desc">位置偏差、冗长偏差、自增强偏差的表现与缓解手段，依据 MT-Bench 等受控评测研究。</desc><defs><marker id="dm08-4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="38" font-size="22" fill="#34475b">裁判自己会错：三种系统性偏差都有受控实验背书</text><rect x="30" y="70" width="440" height="120" rx="12" fill="#fdf0ef" stroke="#b0605a" stroke-width="2"/><text x="50" y="103" font-size="19" fill="#7a3a34" font-weight="bold">位置偏差</text><text x="50" y="132" font-size="16" fill="#34475b">两个候选交换顺序后，评分结论会翻转</text><text x="50" y="160" font-size="16" fill="#2c5a42">缓解：每次评审做位置交换重评，不一致升级人工</text><rect x="490" y="70" width="440" height="120" rx="12" fill="#fdf6ee" stroke="#b08a5a" stroke-width="2"/><text x="510" y="103" font-size="19" fill="#7a5a2c" font-weight="bold">冗长偏差</text><text x="510" y="132" font-size="16" fill="#34475b">系统性偏好更长更详尽的回答，即使没有增量</text><text x="510" y="160" font-size="16" fill="#2c5a42">缓解：长度与正确性分开计分；长度归一或截断</text><rect x="30" y="210" width="440" height="120" rx="12" fill="#f2f0fa" stroke="#6a5a9a" stroke-width="2"/><text x="50" y="243" font-size="19" fill="#3a2c68" font-weight="bold">自增强偏差</text><text x="50" y="272" font-size="16" fill="#34475b">评审模型偏好同一家族模型的输出风格</text><text x="50" y="300" font-size="16" fill="#2c5a42">缓解：评审与被评跨家族搭配；多评审员投票</text><rect x="490" y="210" width="440" height="120" rx="12" fill="#eef3f7" stroke="#5b7a99" stroke-width="2"/><text x="510" y="243" font-size="19" fill="#2c4a68" font-weight="bold">落点（退款案例）</text><text x="510" y="272" font-size="16" fill="#34475b">"已退款"与"退款失败"两个候选交换位置重评，</text><text x="510" y="300" font-size="16" fill="#34475b">结论翻转的样本直接进人工队列，不信任何位置的分数</text><rect x="30" y="360" width="900" height="100" rx="12" fill="#eef7f2" stroke="#4a8a6a" stroke-width="2"/><text x="55" y="395" font-size="17" fill="#2c5a42" font-weight="bold">证据等级</text><text x="55" y="425" font-size="16" fill="#34475b">三种偏差来自受控评测研究（MT-Bench arXiv:2306.05685；评审公平性 arXiv:2305.17926）：交换顺序可显著缓解位置偏差，</text><text x="55" y="450" font-size="16" fill="#34475b">评审对更长回答有系统性偏好，评审模型也会偏好同家族答案；呈现顺序同样影响结论。</text><text x="30" y="510" font-size="16" fill="#7a8a99">一条纪律：评分器健康度与版本质量放在同一层检查——裁判的失效会伪装成被评对象的失效。</text></g></svg>