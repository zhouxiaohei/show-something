<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm08-5-title dm08-5-desc"><title id="dm08-5-title">线上失败审查六步</title><desc id="dm08-5-desc">从低分或投诉出发的六步审查顺序：确认现象、检查证据、重建条件、最小化样本、写参考结果、决定去向。</desc><defs><marker id="dm08-5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="38" font-size="22" fill="#34475b">线上失败的审查顺序：先分类，再复现，最后决定去向</text><g><rect x="30" y="80" width="285" height="105" rx="12" fill="#eef3f7" stroke="#5b7a99" stroke-width="2"/><text x="50" y="112" font-size="18" fill="#2c4a68" font-weight="bold">① 确认现象</text><text x="50" y="140" font-size="15" fill="#34475b">终态错误 / 越权副作用 /</text><text x="50" y="163" font-size="15" fill="#34475b">回复失实 / 只是评分器拒绝</text><rect x="335" y="80" width="285" height="105" rx="12" fill="#eef3f7" stroke="#5b7a99" stroke-width="2"/><text x="355" y="112" font-size="18" fill="#2c4a68" font-weight="bold">② 检查证据</text><text x="355" y="140" font-size="15" fill="#34475b">Trace、工具结果、审计事件、</text><text x="355" y="163" font-size="15" fill="#34475b">运行版本；确认缺段与采样偏差</text><rect x="640" y="80" width="290" height="105" rx="12" fill="#eef3f7" stroke="#5b7a99" stroke-width="2"/><text x="660" y="112" font-size="18" fill="#2c4a68" font-weight="bold">③ 重建条件</text><text x="660" y="140" font-size="15" fill="#34475b">隔离环境还原商户/同名对象/权限；</text><text x="660" y="163" font-size="15" fill="#34475b">不直接重放含真实凭据的日志</text></g><g><rect x="30" y="230" width="285" height="105" rx="12" fill="#eef7f2" stroke="#4a8a6a" stroke-width="2"/><text x="50" y="262" font-size="18" fill="#2c5a42" font-weight="bold">④ 最小化样本</text><text x="50" y="290" font-size="15" fill="#34475b">脱敏并保留会改变判断的结构：</text><text x="50" y="313" font-size="15" fill="#34475b">商户差异、权限边界、状态转换</text><rect x="335" y="230" width="285" height="105" rx="12" fill="#eef7f2" stroke="#4a8a6a" stroke-width="2"/><text x="355" y="262" font-size="18" fill="#2c5a42" font-weight="bold">⑤ 写参考结果</text><text x="355" y="290" font-size="15" fill="#34475b">明确终态、不变量、允许的</text><text x="355" y="313" font-size="15" fill="#34475b">替代路径和评分依据</text><rect x="640" y="230" width="290" height="105" rx="12" fill="#eef7f2" stroke="#4a8a6a" stroke-width="2"/><text x="660" y="262" font-size="18" fill="#2c5a42" font-weight="bold">⑥ 决定去向</text><text x="660" y="290" font-size="15" fill="#34475b">确认失败→回归集；随机样本→</text><text x="660" y="313" font-size="15" fill="#34475b">代表性质量集；不可复现→调查队列</text></g><path d="M315 132h20M620 132h20M172 185v45M460 185v45M745 185v45" stroke="#5b7a99" stroke-width="1.5" marker-end="url(#dm08-5-arrow)" fill="none"/><rect x="30" y="380" width="900" height="110" rx="12" fill="#faf3ee" stroke="#9a6a4a" stroke-width="2"/><text x="55" y="415" font-size="17" fill="#5a3a2c" font-weight="bold">两种资产，用途不同</text><text x="55" y="445" font-size="16" fill="#34475b">回归集负责记住已确认的教训；代表性质量集负责估计目标分布中的表现。</text><text x="55" y="470" font-size="16" fill="#34475b">投诉可以过采样用于查错，但不能不加权地代表所有请求。</text><text x="30" y="530" font-size="16" fill="#7a8a99">低分也可能来自评分器写错——第四步前别急着改题。</text></g></svg>