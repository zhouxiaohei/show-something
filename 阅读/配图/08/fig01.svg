<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm08-1-title dm08-1-desc"><title id="dm08-1-title">四节点评测闭环</title><desc id="dm08-1-desc">任务契约、离线评测、生产证据、审查与发布四个节点及其反馈关系，审查节点同时回流修订任务与决定版本是否继续。</desc><defs><marker id="dm08-1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="38" font-size="22" fill="#34475b">四个节点：产物不是准确率，是一组能回到责任对象的判断</text><rect x="60" y="90" width="380" height="130" rx="14" fill="#eef3f7" stroke="#5b7a99" stroke-width="2"/><text x="80" y="125" font-size="20" fill="#2c4a68" font-weight="bold">① 任务契约</text><text x="80" y="155" font-size="17" fill="#34475b">什么算成功，什么不可接受</text><text x="80" y="182" font-size="16" fill="#5b7a99">终态 · 不变量 · 比较条件</text><rect x="520" y="90" width="380" height="130" rx="14" fill="#eef7f2" stroke="#4a8a6a" stroke-width="2"/><text x="540" y="125" font-size="20" fill="#2c5a42" font-weight="bold">② 离线评测</text><text x="540" y="155" font-size="17" fill="#34475b">可控条件下新版本是否稳定满足契约</text><text x="540" y="182" font-size="16" fill="#4a8a6a">隔离环境 · 重复比较 · 评分器</text><rect x="60" y="330" width="380" height="130" rx="14" fill="#f2f0fa" stroke="#6a5a9a" stroke-width="2"/><text x="80" y="365" font-size="20" fill="#3a2c68" font-weight="bold">③ 生产证据</text><text x="80" y="395" font-size="17" fill="#34475b">这次线上请求实际发生了什么</text><text x="80" y="422" font-size="16" fill="#6a5a9a">Trace · 审计事件 · 业务终态</text><rect x="520" y="330" width="380" height="130" rx="14" fill="#faf3ee" stroke="#9a6a4a" stroke-width="2"/><text x="540" y="365" font-size="20" fill="#5a3a2c" font-weight="bold">④ 审查与发布</text><text x="540" y="395" font-size="17" fill="#34475b">失败能否成为新知识，版本达不达标</text><text x="540" y="422" font-size="16" fill="#9a6a4a">复现 · 分流 · 风险门禁</text><path d="M440 155h70" stroke="#5b7a99" stroke-width="2" marker-end="url(#dm08-1-arrow)" fill="none"/><path d="M340 220v100" stroke="#6a5a9a" stroke-width="2" marker-end="url(#dm08-1-arrow)" fill="none"/><path d="M620 220v100" stroke="#9a6a4a" stroke-width="2" marker-end="url(#dm08-1-arrow)" fill="none"/><path d="M520 395h-70" stroke="#9a6a4a" stroke-width="2" marker-end="url(#dm08-1-arrow)" fill="none"/><path d="M710 330v-100" stroke="#9a6a4a" stroke-width="2" marker-end="url(#dm08-1-arrow)" fill="none"/><text x="355" y="250" font-size="15" fill="#5b7a99">契约约束两侧</text><text x="445" y="388" font-size="15" fill="#9a6a4a">修订任务/评分器/观测</text><text x="720" y="240" font-size="15" fill="#9a6a4a">决定版本是否继续</text><text x="30" y="510" font-size="16" fill="#7a8a99">每个请求不必依次经过四个服务；契约同时约束离线与生产，两者证据都汇入审查。</text></g></svg>