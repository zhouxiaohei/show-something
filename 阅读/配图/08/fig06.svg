<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm08-6-title dm08-6-desc"><title id="dm08-6-title">pass@k 与 pass^k</title><desc id="dm08-6-desc">同一任务固定成功率 p=0.7、k=3 时，至少一次成功约 97.3% 与全部成功约 34.3% 的对比，说明一次成功和重复可靠不是一回事。</desc><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="38" font-size="22" fill="#34475b">一次成功 ≠ 重复可靠（构造参数 p=0.7，k=3）</text><line x1="120" y1="430" x2="880" y2="430" stroke="#98a4b0" stroke-width="2"/><line x1="120" y1="430" x2="120" y2="80" stroke="#98a4b0" stroke-width="2"/><g><rect x="320" y="88" width="180" height="342" fill="#5b7a99" fill-opacity="0.85"/><text x="410" y="75" font-size="20" fill="#2c4a68" text-anchor="middle" font-weight="bold">97.3%</text><text x="410" y="460" font-size="17" fill="#34475b" text-anchor="middle" font-weight="bold">pass@3</text><text x="410" y="485" font-size="15" fill="#5b7a99" text-anchor="middle">3 次里至少 1 次成功</text><text x="410" y="508" font-size="15" fill="#5b7a99" text-anchor="middle">1-(1-p)^k</text></g><g><rect x="600" y="318" width="180" height="112" fill="#b0605a" fill-opacity="0.85"/><text x="690" y="305" font-size="20" fill="#7a3a34" text-anchor="middle" font-weight="bold">34.3%</text><text x="690" y="460" font-size="17" fill="#34475b" text-anchor="middle" font-weight="bold">pass^3</text><text x="690" y="485" font-size="15" fill="#9a6a4a" text-anchor="middle">3 次全部成功</text><text x="690" y="508" font-size="15" fill="#9a6a4a" text-anchor="middle">p^k</text></g><g stroke="#d0d8df" stroke-width="1"><line x1="120" y1="318" x2="880" y2="318"/><line x1="120" y1="203" x2="880" y2="203"/><line x1="120" y1="88" x2="880" y2="88"/></g><g font-size="14" fill="#98a4b0"><text x="108" y="323" text-anchor="end">33%</text><text x="108" y="208" text-anchor="end">67%</text><text x="108" y="93" text-anchor="end">100%</text></g><text x="30" y="545" font-size="15" fill="#7a8a99">公式推导示意，非产品成绩；相关失败、环境共因和重试副作用会破坏独立性假设。真实用户更关心单次质量与跨重复一致性。</text></g></svg>