<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="cc05-4-title cc05-4-desc"><title id="cc05-4-title">SWE-Journey：用户是谁，比模型多强更能决定成败</title><desc id="cc05-4-desc">同一批模型配四种用户人设的终点失败转通过率：架构师 78.50%、新人开发 35.57%、产品经理 30.48%、非开发者 23.00%，最大落差 55.5 个百分点；多数模型主动提问轮次占比不到 20%。</desc><defs><marker id="cc05-4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">把"对面坐的是谁"变成实验变量：13 家模型 × 四种人设</text><g><rect x="25" y="54" width="910" height="40" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="80" font-size="17" fill="#34475b">30 个长任务实例（594 个子任务，对照补丁约现有专业基准的两倍文件、四倍行数）｜会话平均 18.28 轮</text></g><text x="25" y="136" font-size="18" fill="#34475b">架构师</text><rect x="150" y="116" width="549" height="36" rx="6" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="715" y="140" font-size="18" fill="#34475b">78.50%</text><text x="25" y="200" font-size="18" fill="#34475b">新人开发</text><rect x="150" y="180" width="248" height="36" rx="6" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="414" y="204" font-size="18" fill="#34475b">35.57%</text><text x="25" y="264" font-size="18" fill="#34475b">产品经理</text><rect x="150" y="244" width="212" height="36" rx="6" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="378" y="268" font-size="18" fill="#34475b">30.48%</text><text x="25" y="328" font-size="18" fill="#34475b">非开发者</text><rect x="150" y="308" width="160" height="36" rx="6" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="326" y="332" font-size="18" fill="#34475b">23.00%</text><path d="M820,116 L820,344" fill="none" stroke="#b07a6a" stroke-width="2" marker-start="url(#cc05-4-arrow)" marker-end="url(#cc05-4-arrow)" stroke-dasharray="6 5"/><text x="838" y="236" font-size="16" fill="#8a5a4a">同一批模型</text><text x="838" y="258" font-size="16" fill="#8a5a4a">掉 55.5</text><text x="838" y="280" font-size="16" fill="#8a5a4a">个百分点</text><g><rect x="25" y="368" width="910" height="66" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="394" font-size="19" fill="#34475b">用户表达能力对成功率的影响，远大于模型之间的差距</text><text x="45" y="422" font-size="17" fill="#5c6d80">最强一档模型配架构师能到 93.59%；而多数模型的主动提问轮次占比不到 20%——在"从弱表达恢复意图"上集体不及格</text></g><g><rect x="25" y="450" width="910" height="92" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="478" font-size="17" fill="#5c6d80">方向印证：ZDNet 调查 138 名活跃开发者，约 75% 在用 Claude Code；自发给出的前两条理由——大代码库跨文件改动保持连贯（14%）、先计划再动手需要更少纠正（9%）——恰好落在受控评测测出的两个维度上</text><text x="45" y="504" font-size="17" fill="#5c6d80">边界：模拟用户只是近似真人，任务集只有 30 个实例；调查是自愿应答、有自选偏差——只看分布方向，不做性能结论</text></g></g></svg>
