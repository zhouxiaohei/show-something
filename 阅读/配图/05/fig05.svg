<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="cc05-5-title cc05-5-desc"><title id="cc05-5-title">四类证据：各测到哪一环，外推到哪要停</title><desc id="cc05-5-desc">受控评测、过程诊断、失败案例、使用面调查四类证据各自能支持的判断与不能证明的判断；挡掉全部外推后剩下失败模式存在、组合层面比较与方向印证；综合推断只是当前最优假设。</desc><defs><marker id="cc05-5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">证据评审的路子：每类证据只支持它测过的那一层</text><g><rect x="25" y="56" width="445" height="118" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="84" font-size="19" fill="#34475b">受控评测｜SWE-Together [模型证据]</text><text x="45" y="110" font-size="16" fill="#5c6d80">能支持：纠正量可作独立指标；统一框架下</text><text x="45" y="132" font-size="16" fill="#5c6d80">模型间质量与稳定率差异</text><text x="45" y="160" font-size="16" fill="#8a5a4a">不能：Claude Code 与 Codex 两个产品的优劣</text></g><g><rect x="490" y="56" width="445" height="118" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="510" y="84" font-size="19" fill="#34475b">过程诊断｜TraceProbe [混合证据]</text><text x="510" y="110" font-size="16" fill="#5c6d80">能支持：同解决率下过程结构可显著不同；</text><text x="510" y="132" font-size="16" fill="#5c6d80">失败/有害动作可测</text><text x="510" y="160" font-size="16" fill="#8a5a4a">不能：模型与框架各占多少贡献；用户认知成本</text></g><g><rect x="25" y="190" width="445" height="118" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="218" font-size="19" fill="#34475b">失败案例｜7 个 Codex issue [产品案例]</text><text x="45" y="244" font-size="16" fill="#5c6d80">能支持：累计约束碎裂等失败模式真实存在，</text><text x="45" y="266" font-size="16" fill="#5c6d80">且有复现路径</text><text x="45" y="294" font-size="16" fill="#8a5a4a">不能：发生概率、产品稳定性排名（无分母）</text></g><g><rect x="490" y="190" width="445" height="118" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="510" y="218" font-size="19" fill="#34475b">使用面调查｜138 名开发者 [调查证据]</text><text x="510" y="244" font-size="16" fill="#5c6d80">能支持：活跃使用者的选择分布与理由方向</text><text x="510" y="270" font-size="16" fill="#5c6d80"></text><text x="510" y="294" font-size="16" fill="#8a5a4a">不能：随机抽样结论、实测性能</text></g><path d="M480,308 L480,330" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#cc05-5-arrow)"/><g><rect x="25" y="334" width="910" height="72" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="362" font-size="19" fill="#34475b">把外推全部挡掉后，能站住的是这三件事</text><text x="45" y="390" font-size="17" fill="#5c6d80">失败模式存在 · 组合层面的比较 · 三条独立来源共同指向的方向印证——跨层引用就是过度归因</text></g><g><rect x="25" y="422" width="910" height="86" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="450" font-size="19" fill="#34475b">"Claude 系更适合协商型协作"是当前最优假设 [综合推断]，不是已被成对实验钉死的结论</text><text x="45" y="476" font-size="17" fill="#5c6d80">推翻它的方式：一份同时覆盖模糊意图、纠正吸收、失败解释与多轮迭代的成对实验——盲评是最容易被省掉、也最不能省的一步</text><text x="45" y="500" font-size="17" fill="#5c6d80">知道证据停在哪，才知道下一个实验该测什么</text></g></g></svg>
