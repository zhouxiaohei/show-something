<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="cc05-1-title cc05-1-desc"><title id="cc05-1-title">真实协作链条：六环，断一环全歪</title><desc id="cc05-1-desc">从理解模糊表达到在已有结果上继续迭代的六个环节依次相连，任何一环损坏，后面都可能是高度自洽但整体错误。</desc><defs><marker id="cc05-1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">真实协作链条：四类证据测的都是这条链的不同环节</text><g><rect x="25" y="58" width="910" height="46" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="88" font-size="18" fill="#34475b">① 理解模糊、口语化的表达</text></g><path d="M480,104 L480,122" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#cc05-1-arrow)"/><g><rect x="25" y="126" width="910" height="46" rx="10" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="156" font-size="18" fill="#34475b">② 结合代码与历史对话恢复真实意图</text></g><path d="M480,172 L480,190" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#cc05-1-arrow)"/><g><rect x="25" y="194" width="910" height="46" rx="10" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="224" font-size="18" fill="#34475b">③ 把新纠正合并进累计目标</text></g><path d="M480,240 L480,258" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#cc05-1-arrow)"/><g><rect x="25" y="262" width="910" height="46" rx="10" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="45" y="292" font-size="18" fill="#34475b">④ 长会话与压缩后保持完整约束</text></g><path d="M480,308 L480,326" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#cc05-1-arrow)"/><g><rect x="25" y="330" width="910" height="46" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="360" font-size="18" fill="#34475b">⑤ 依据同一个目标持续执行和验证</text></g><path d="M480,376 L480,394" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#cc05-1-arrow)"/><g><rect x="25" y="398" width="910" height="46" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="428" font-size="18" fill="#34475b">⑥ 在已有结果上继续迭代</text></g><path d="M480,444 L480,466" fill="none" stroke="#b07a6a" stroke-width="2" marker-end="url(#cc05-1-arrow)"/><g><rect x="25" y="470" width="910" height="72" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="498" font-size="19" fill="#34475b">链条上任何一环损坏，后面都可能是"高度自洽但整体错误"</text><text x="45" y="524" font-size="17" fill="#5c6d80">每一步单独看都合理，连起来离目标越来越远——分数打平之后，差距出在这条链上</text></g></g></svg>
