<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="cc05-2-title cc05-2-desc"><title id="cc05-2-title">SWE-Together：用户纠正量成为独立指标</title><desc id="cc05-2-desc">从 11260 条真实会话筛出 109 个任务，统一 OpenCode 框架测 pass@1 与用户纠正量；Claude Opus 4.8 纠正最少且质量与稳定率最高，纠正量与 pass@1 相关负 0.92；右侧标注少纠正不等于便宜与筛选偏差。</desc><defs><marker id="cc05-2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">SWE-Together：把"用户纠正几次"变成了可数的量</text><g><rect x="25" y="56" width="910" height="44" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="84" font-size="17" fill="#34475b">11,260 条真实用户—代理会话 → 109 个可复现任务（筛选 0.97%）｜统一 OpenCode 框架，每个模型独立跑两次</text></g><g><rect x="25" y="116" width="580" height="40" rx="8" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="205" y="142" font-size="17" fill="#34475b">模型</text><text x="400" y="142" font-size="17" fill="#34475b" text-anchor="middle">pass@1</text><text x="530" y="142" font-size="17" fill="#34475b" text-anchor="middle">用户纠正（越低越好）</text></g><g><rect x="25" y="160" width="580" height="40" rx="8" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="186" font-size="17" fill="#34475b">Claude Opus 4.8</text><text x="400" y="186" font-size="17" fill="#34475b" text-anchor="middle">63%</text><text x="530" y="186" font-size="17" fill="#34475b" text-anchor="middle">1.38</text></g><g><rect x="25" y="204" width="580" height="40" rx="8" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="230" font-size="17" fill="#34475b">GPT-5.5</text><text x="400" y="230" font-size="17" fill="#34475b" text-anchor="middle">58%</text><text x="530" y="230" font-size="17" fill="#34475b" text-anchor="middle">1.59</text></g><g><rect x="25" y="248" width="580" height="40" rx="8" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="274" font-size="17" fill="#34475b">DeepSeek V4 Pro</text><text x="400" y="274" font-size="17" fill="#34475b" text-anchor="middle">48%</text><text x="530" y="274" font-size="17" fill="#34475b" text-anchor="middle">1.76</text></g><g><rect x="25" y="292" width="580" height="40" rx="8" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="318" font-size="17" fill="#34475b">MiniMax 2.7</text><text x="400" y="318" font-size="17" fill="#34475b" text-anchor="middle">40%</text><text x="530" y="318" font-size="17" fill="#34475b" text-anchor="middle">2.17</text></g><g><rect x="625" y="116" width="310" height="172" rx="10" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="645" y="144" font-size="18" fill="#34475b">读表三处克制</text><text x="645" y="170" font-size="15" fill="#5c6d80">差距不是数量级（0.21 次）；</text><text x="645" y="192" font-size="15" fill="#5c6d80">Opus 4.6 与 GPT-5.5 纠正量相同，</text><text x="645" y="214" font-size="15" fill="#5c6d80">不支持品牌决定论；</text><text x="645" y="240" font-size="15" fill="#8a5a4a">少纠正不等于便宜：GPT-5.5 约 29.9k</text><text x="645" y="262" font-size="15" fill="#8a5a4a">token 全场最省，Opus 4.8 约 74.0k</text></g><g><rect x="25" y="352" width="910" height="60" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="378" font-size="19" fill="#34475b">纠正量与 pass@1 的 Pearson 相关 −0.92，与稳定解决率 −0.84</text><text x="45" y="402" font-size="17" fill="#5c6d80">真正值得注意的是：更少纠正的同时拿到更高质量与更高稳定成功率——三项同向，不是单点领先</text></g><g><rect x="25" y="428" width="910" height="72" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="456" font-size="17" fill="#5c6d80">样本偏差：0.97% 的筛选转化率意味着任务集偏向"可恢复、目标清晰、结果可观察"的会话</text><text x="45" y="482" font-size="17" fill="#5c6d80">真实协作里大量任务并不满足这三条——这张表对协作全谱系是有偏样本；协作成本要同时算纠偏劳动和运行成本</text></g></g></svg>
