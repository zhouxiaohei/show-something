<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="cc05-3-title cc05-3-desc"><title id="cc05-3-title">TraceProbe：解决率打平，路径成本结构完全不同</title><desc id="cc05-3-desc">同样约 78% 的解决率下，Claude Code 加 Opus 4.6 与 Codex 加 GPT-5.4 的过程指标对比：工具调用 25 对 41、成功率 96.7% 对 91.9%、失败动作占比 3.3% 对 8.0%；Codex 用更多试错换到了同等结果。</desc><defs><marker id="cc05-3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">TraceProbe：2500 条轨迹规范化为九类动作，规则检测反模式</text><g><rect x="25" y="56" width="445" height="252" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="86" font-size="19" fill="#34475b">Claude Code + Opus 4.6</text><text x="45" y="118" font-size="17" fill="#5c6d80">解决率 77.4%</text><text x="45" y="144" font-size="17" fill="#5c6d80">每任务中位步骤 27</text><text x="45" y="170" font-size="17" fill="#5c6d80">工具调用（中位）25 · 成功率 96.7%</text><text x="45" y="196" font-size="17" fill="#5c6d80">保留动作占比 27.6%</text><text x="45" y="222" font-size="17" fill="#34475b">失败动作占比 3.3%</text><text x="45" y="248" font-size="17" fill="#5c6d80">有害动作比例 0.07</text><text x="45" y="280" font-size="16" fill="#5c6d80">更少的动作、更高的工具成功率</text></g><g><rect x="490" y="56" width="445" height="252" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="510" y="86" font-size="19" fill="#34475b">Codex + GPT-5.4</text><text x="510" y="118" font-size="17" fill="#5c6d80">解决率 78.4%</text><text x="510" y="144" font-size="17" fill="#5c6d80">每任务中位步骤 24</text><text x="510" y="170" font-size="17" fill="#5c6d80">工具调用（中位）41 · 成功率 91.9%</text><text x="510" y="196" font-size="17" fill="#5c6d80">保留动作占比 36.2%</text><text x="510" y="222" font-size="17" fill="#8a5a4a">失败动作占比 8.0%（约 2.4 倍）</text><text x="510" y="248" font-size="17" fill="#5c6d80">有害动作比例 0.10</text><text x="510" y="280" font-size="16" fill="#5c6d80">保留动作占比也最大，解决率全场最高</text></g><path d="M252,308 L252,332" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#cc05-3-arrow)"/><path d="M712,308 L712,332" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#cc05-3-arrow)"/><g><rect x="25" y="336" width="910" height="76" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="364" font-size="19" fill="#34475b">解决率只差 1 个百分点，统计上几乎不可区分——但路径的成本结构完全不同</text><text x="45" y="394" font-size="17" fill="#5c6d80">Codex 用更多试错换到了同等结果：单次通过率衡量终点，路径结构衡量到达终点的成本</text></g><g><rect x="25" y="428" width="910" height="86" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="456" font-size="17" fill="#5c6d80">说法要收窄：能说的是"失败动作更多、有害动作更多、工具成功率更低"三个可测维度，不能说成笼统的"Codex 更乱"</text><text x="45" y="482" font-size="17" fill="#5c6d80">这个对比里模型与 scaffold 同时变化，无法分离各自动贡献；它也不测用户纠偏的认知成本和失败解释好不好用</text></g></g></svg>
