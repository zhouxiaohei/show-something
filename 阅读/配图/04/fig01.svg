<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ab04-1-title ab04-1-desc"><title id="ab04-1-title">一次"查工单"请求里混着四种性质不同的动作</title><desc id="ab04-1-desc">客服 Agent 查工单请求被拆成四个动作：识别意图归 LLM，确定目标记录、取 id 查询归代码，解释结果归 LLM；实际执行时中间两步滑到 LLM，导致挑错客户并生成看起来像真的总结。</desc><defs><marker id="ab04-1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">把"查错人"这一步拆开：四种性质不同的动作</text><g><rect x="25" y="60" width="910" height="64" rx="10" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="86" font-size="19" fill="#34475b">① 从用户话里识别"他想查客户张伟"</text><text x="45" y="110" font-size="17" fill="#5c6d80">语义理解 → 归 LLM</text></g><path d="M480,124 L480,154" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ab04-1-arrow)"/><g><rect x="25" y="158" width="910" height="64" rx="10" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="45" y="184" font-size="19" fill="#34475b">② 在三个同名"张伟"里确定目标记录</text><text x="45" y="208" font-size="17" fill="#5c6d80">规则、权限、上下文约束 → 归代码或明确交互</text></g><path d="M480,222 L480,252" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ab04-1-arrow)"/><g><rect x="25" y="256" width="910" height="64" rx="10" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="45" y="282" font-size="19" fill="#34475b">③ 取 customer_id 再查工单</text><text x="45" y="306" font-size="17" fill="#5c6d80">确定性数据访问 → 归代码，不需要"记住"也不需要"复述"那个 id</text></g><path d="M480,320 L480,350" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ab04-1-arrow)"/><g><rect x="25" y="354" width="910" height="64" rx="10" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="380" font-size="19" fill="#34475b">④ 把工单结果解释成人话</text><text x="45" y="404" font-size="17" fill="#5c6d80">表达、总结 → 归 LLM</text></g><path d="M480,418 L480,444" fill="none" stroke="#b07a6a" stroke-width="2" marker-end="url(#ab04-1-arrow)"/><g><rect x="25" y="448" width="910" height="94" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="476" font-size="19" fill="#34475b">实际执行：②③滑到了 LLM 那边</text><text x="45" y="502" font-size="17" fill="#5c6d80">按名字搜索撞上三条记录，挑了错的张伟；拿着空工单生成"近期工单较少，暂无明显异常"的假总结</text><text x="45" y="526" font-size="17" fill="#5c6d80">模型不听话的表象下，往往是把不该给模型的动作给了它</text></g></g></svg>
