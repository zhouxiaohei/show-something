<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ab04-4-title ab04-4-desc"><title id="ab04-4-title">两问判断矩阵：约束该放提示词还是代码</title><desc id="ab04-4-desc">第一问能否容忍偶尔漏一次，第二问约束顺着还是逆着 LLM 的省力路径；四格分别是提示词通常够、提示词为主代码兜底、提示词为辅重点监控、必须代码或硬闸门，底部是三种干预手段的机制差异。</desc><defs><marker id="ab04-4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">两问判断：一个约束该放提示词，还是放代码</text><g><rect x="25" y="54" width="445" height="58" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="78" font-size="18" fill="#34475b">第一问：能不能容忍偶尔漏一次？</text><text x="45" y="100" font-size="16" fill="#5c6d80">不能容忍：权限、安全、强主键、金额、副作用</text></g><g><rect x="490" y="54" width="445" height="58" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="510" y="78" font-size="18" fill="#34475b">第二问：顺着还是逆着 LLM 的省力路径？</text><text x="510" y="100" font-size="16" fill="#5c6d80">省力路径：能现编就直接答、能按名字搜就搜</text></g><g><rect x="165" y="140" width="385" height="44" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="357" y="168" font-size="18" fill="#34475b" text-anchor="middle">能容忍偶尔漏</text></g><g><rect x="565" y="140" width="385" height="44" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="757" y="168" font-size="18" fill="#34475b" text-anchor="middle">不能容忍漏</text></g><g><rect x="25" y="196" width="128" height="108" rx="10" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="89" y="256" font-size="19" fill="#34475b" text-anchor="middle">顺水</text></g><g><rect x="165" y="196" width="385" height="108" rx="10" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="185" y="228" font-size="19" fill="#34475b">提示词通常够</text><text x="185" y="254" font-size="16" fill="#5c6d80">风格、措辞、优先级、偏好、</text><text x="185" y="276" font-size="16" fill="#5c6d80">解释方式——"回答尽量简洁"</text></g><g><rect x="565" y="196" width="385" height="108" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="585" y="228" font-size="19" fill="#34475b">提示词为主，代码兜底</text><text x="585" y="254" font-size="16" fill="#5c6d80">软层提示 + 硬层检查，</text><text x="585" y="276" font-size="16" fill="#5c6d80">模型想偷懒也没关系，硬层接得住</text></g><g><rect x="25" y="316" width="128" height="108" rx="10" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="89" y="376" font-size="19" fill="#34475b" text-anchor="middle">逆水</text></g><g><rect x="165" y="316" width="385" height="108" rx="10" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="185" y="348" font-size="19" fill="#34475b">提示词为辅，重点监控</text><text x="185" y="374" font-size="16" fill="#5c6d80">它在逆着整个训练分布持续做功，</text><text x="185" y="396" font-size="16" fill="#5c6d80">迟早会漏——漏了要有报警</text></g><g><rect x="565" y="316" width="385" height="108" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="585" y="348" font-size="19" fill="#34475b">必须代码或硬闸门</text><text x="585" y="374" font-size="16" fill="#5c6d80">权限、安全、强主键、金额、坐标、</text><text x="585" y="396" font-size="16" fill="#5c6d80">外部副作用——不许模型自觉遵守</text></g><g><rect x="25" y="446" width="925" height="96" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="474" font-size="19" fill="#34475b">三种干预手段的作用点完全不同</text><text x="45" y="500" font-size="17" fill="#5c6d80">提示词 = 对概率分布重新加权（其他路径概率仍在，迟早会漏）· 校验 = 在出口拦截（不合格就不过）</text><text x="45" y="524" font-size="17" fill="#5c6d80">代码 = 改变状态转移函数（唯一能把某条失败路径的概率真正归零的手段）</text></g></g></svg>
