<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ab04-3-title ab04-3-desc"><title id="ab04-3-title">三类问题，三种处理方式</title><desc id="ab04-3-desc">按答案来源分流：语义型由理解产生、交给 LLM；结构型由格式约束、用生成前提示词、生成后校验、生成中约束解码三种手段；权威型由唯一事实来源决定、归代码；下附两条反模式。</desc><defs><marker id="ab04-3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">分流判据：答案由什么产生——理解、格式，还是唯一事实来源</text><g><rect x="25" y="58" width="910" height="82" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="86" font-size="19" fill="#34475b">语义型 → 交给 LLM</text><text x="45" y="112" font-size="17" fill="#5c6d80">识别用户想查什么 · 解释工具返回 · 用人话对比候选方案 · 面向非技术用户解释错误原因</text></g><g><rect x="25" y="158" width="910" height="146" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="45" y="186" font-size="19" fill="#34475b">结构型 → 提示词 + 校验（不是模型不愿意做，是它偶尔会"漂"）</text><text x="45" y="212" font-size="17" fill="#5c6d80">合法 JSON · 字段名固定 · 列表最多 5 项 · 表格不缺列 · 参数符合 schema</text><rect x="45" y="228" width="286" height="56" rx="8" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="188" y="252" font-size="16" fill="#34475b" text-anchor="middle">生成前 · 提示词</text><text x="188" y="272" font-size="15" fill="#5c6d80" text-anchor="middle">请求它"尽量合法"</text><rect x="337" y="228" width="286" height="56" rx="8" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="480" y="252" font-size="16" fill="#34475b" text-anchor="middle">生成后 · 校验</text><text x="480" y="272" font-size="15" fill="#5c6d80" text-anchor="middle">schema/parser，不合法就不过</text><rect x="629" y="228" width="286" height="56" rx="8" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="772" y="252" font-size="16" fill="#34475b" text-anchor="middle">生成中 · 约束解码</text><text x="772" y="272" font-size="15" fill="#5c6d80" text-anchor="middle">非法 token 根本出不来</text></g><g><rect x="25" y="322" width="910" height="106" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="350" font-size="19" fill="#34475b">权威型 → 归代码（有唯一事实来源，或可还原成确定性计算）</text><text x="45" y="376" font-size="17" fill="#5c6d80">id 来自哪条记录 · 有没有权限 · 金额是否超阈值 · 坐标是否在围栏内 · 是否允许执行副作用动作</text><text x="45" y="404" font-size="17" fill="#5c6d80">LLM 提出意图，代码做授权、取值、校验和执行——不要让 LLM"判断一下"</text></g><path d="M480,428 L480,452" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ab04-3-arrow)"/><g><rect x="25" y="456" width="910" height="86" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="484" font-size="19" fill="#34475b">两条反模式</text><text x="45" y="510" font-size="17" fill="#5c6d80">把 JSON 稳定性完全押给提示词（下游要消费就必须有校验）· 用更强提示词替代权限检查（权限必须在工具调用层检查）</text><text x="45" y="532" font-size="17" fill="#5c6d80">这一步分流是后续一切设计的前置分类</text></g></g></svg>
