<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ab04-2-title ab04-2-desc"><title id="ab04-2-title">生成型参数与搬运型参数，以及搬运型的五个风险维度</title><desc id="ab04-2-desc">生成型参数来自语义理解、适合 LLM；搬运型参数是原样搬运上下文里的已有值，风险由语义、长度、唯一性、距离、可校验性五个维度衡量；错误最可怕之处是接口照样返回成功。</desc><defs><marker id="ab04-2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">说"不要让 LLM 传参数"是过度简化，关键要分型</text><g><rect x="25" y="58" width="445" height="86" rx="10" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="86" font-size="19" fill="#34475b">生成型参数｜通常适合 LLM</text><text x="45" y="110" font-size="17" fill="#5c6d80">来自语义理解：name=张伟 · city=上海 · priority=high</text><text x="45" y="132" font-size="17" fill="#5c6d80">用户说"查上海的高优先级客户"，模型抽得出来</text></g><g><rect x="490" y="58" width="445" height="86" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="510" y="86" font-size="19" fill="#34475b">搬运型参数｜取决于风险维度</text><text x="510" y="110" font-size="17" fill="#5c6d80">把上下文里已有的值原样搬走：customer_id=1000020698274</text><text x="510" y="132" font-size="17" fill="#5c6d80">看起来简单，其实很危险——尤其是不透明主键</text></g><path d="M252,144 L252,168" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ab04-2-arrow)"/><path d="M712,144 L712,168" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ab04-2-arrow)"/><g><rect x="25" y="172" width="910" height="56" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="196" font-size="19" fill="#34475b">搬运型错误的伤害不取决于出错概率，而取决于：错了之后，系统有没有信号能发现</text><text x="45" y="219" font-size="17" fill="#5c6d80">错一位 id 命中另一条真实记录时，接口照样 success: true——最可怕的不是失败，而是"成功地错了"</text></g><path d="M480,228 L480,252" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ab04-2-arrow)"/><g><rect x="25" y="256" width="170" height="212" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="110" y="284" font-size="19" fill="#34475b" text-anchor="middle">语义</text><text x="110" y="316" font-size="16" fill="#5c6d80" text-anchor="middle">相对安全：有业务含义</text><text x="110" y="340" font-size="16" fill="#5c6d80" text-anchor="middle">ORDER-SH-2026-001</text><text x="110" y="376" font-size="16" fill="#8a5a4a" text-anchor="middle">高风险：无语义</text><text x="110" y="400" font-size="16" fill="#8a5a4a" text-anchor="middle">1000020698274</text><text x="110" y="440" font-size="15" fill="#5c6d80" text-anchor="middle">错了一眼看不看得出</text></g><g><rect x="210" y="256" width="170" height="212" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="295" y="284" font-size="19" fill="#34475b" text-anchor="middle">长度</text><text x="295" y="316" font-size="16" fill="#5c6d80" text-anchor="middle">相对安全：短</text><text x="295" y="376" font-size="16" fill="#8a5a4a" text-anchor="middle">高风险：长</text><text x="295" y="440" font-size="15" fill="#5c6d80" text-anchor="middle">越长越容易掉位、混淆</text></g><g><rect x="395" y="256" width="170" height="212" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="480" y="284" font-size="19" fill="#34475b" text-anchor="middle">唯一性</text><text x="480" y="316" font-size="16" fill="#5c6d80" text-anchor="middle">相对安全：当前上下文</text><text x="480" y="340" font-size="16" fill="#5c6d80" text-anchor="middle">只有一个候选</text><text x="480" y="376" font-size="16" fill="#8a5a4a" text-anchor="middle">高风险：多个相似候选</text><text x="480" y="440" font-size="15" fill="#5c6d80" text-anchor="middle">相似候选多就容易选错</text></g><g><rect x="580" y="256" width="170" height="212" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="665" y="284" font-size="19" fill="#34475b" text-anchor="middle">距离</text><text x="665" y="316" font-size="16" fill="#5c6d80" text-anchor="middle">相对安全：值就在上一行</text><text x="665" y="376" font-size="16" fill="#8a5a4a" text-anchor="middle">高风险：埋在几步前的</text><text x="665" y="400" font-size="16" fill="#8a5a4a" text-anchor="middle">大段列表里</text><text x="665" y="440" font-size="15" fill="#5c6d80" text-anchor="middle">离得越远越容易取旧值</text></g><g><rect x="765" y="256" width="170" height="212" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="850" y="284" font-size="19" fill="#34475b" text-anchor="middle">可校验性</text><text x="850" y="316" font-size="16" fill="#5c6d80" text-anchor="middle">相对安全：错了格式或</text><text x="850" y="340" font-size="16" fill="#5c6d80" text-anchor="middle">含义明显不对</text><text x="850" y="376" font-size="16" fill="#8a5a4a" text-anchor="middle">高风险：错一位也可能</text><text x="850" y="400" font-size="16" fill="#8a5a4a" text-anchor="middle">命中另一条真实记录</text><text x="850" y="440" font-size="15" fill="#5c6d80" text-anchor="middle">错了有没有信号</text></g><text x="480" y="502" font-size="17" fill="#34475b" text-anchor="middle">五个维度是风险方向标，不给量化阈值；最终回到具体业务问一句：这个值错了，会伤到谁</text></g></svg>
