<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ab04-5-title ab04-5-desc"><title id="ab04-5-title">三层拦截漏斗：错误从概率空间出来，每过一层少一批</title><desc id="ab04-5-desc">模型的全部候选输出经过三层漏斗：生成前的提示词重新加权、生成后的校验拦截不合法输出、动作前的约束执行把可计算失败归零，之后才进入系统与用户；底部对比叠软层与上硬闸两条路线。</desc><defs><marker id="ab04-5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">三层拦截漏斗：每层的作用时机不同</text><g><rect x="25" y="58" width="910" height="52" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="480" y="90" font-size="19" fill="#34475b" text-anchor="middle">模型的全部候选输出（概率空间：失败与成功混在一起）</text></g><path d="M480,110 L480,134" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ab04-5-arrow)"/><g><rect x="130" y="138" width="700" height="86" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="150" y="166" font-size="19" fill="#34475b">第一层 · 提示词（生成前）</text><text x="150" y="192" font-size="17" fill="#5c6d80">对概率分布重新加权</text><text x="150" y="214" font-size="17" fill="#5c6d80">效果：降低失败率，不能归零</text></g><path d="M480,224 L480,248" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ab04-5-arrow)"/><g><rect x="220" y="252" width="520" height="86" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="240" y="280" font-size="19" fill="#34475b">第二层 · 校验（生成后）</text><text x="240" y="306" font-size="17" fill="#5c6d80">schema / parser / 来源检查</text><text x="240" y="328" font-size="17" fill="#5c6d80">效果：拦截不合法输出，可重试</text></g><path d="M480,338 L480,362" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ab04-5-arrow)"/><g><rect x="310" y="366" width="340" height="86" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="330" y="394" font-size="19" fill="#34475b">第三层 · 约束执行（动作前）</text><text x="330" y="420" font-size="17" fill="#5c6d80">权限 / 白名单 / 状态机 / 二次确认</text><text x="330" y="442" font-size="17" fill="#5c6d80">可计算失败在此消除</text></g><path d="M480,452 L480,472" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ab04-5-arrow)"/><g><rect x="370" y="476" width="220" height="40" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="480" y="502" font-size="18" fill="#34475b" text-anchor="middle">进入系统与用户</text></g><text x="45" y="536" font-size="17" fill="#34475b">判断题类失败（语义、质量）靠前两层叠概率手段降漏率；id、金额、权限、格式类失败必须在第三层归零</text><text x="45" y="554" font-size="15" fill="#5c6d80">两条路线：叠软层上限趋近 100% 但不是 100%；上硬闸可以做到系统层面的确定——判据是问题能不能还原成确定性计算</text></g></svg>
