<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm03-3-title dm03-3-desc"><title id="dm03-3-title">四个可检查标准</title><desc id="dm03-3-desc">内部一致、意图明确、可验收、机器友好四个标准及其要点，前两个保证文档不自相矛盾，后两个保证人和机器执行到同一结果。</desc><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="38" font-size="22" fill="#34475b">把口头合伙的默契拆成四条可逐条检查的合同条款</text><rect x="30" y="75" width="440" height="200" rx="14" fill="#eef3f7" stroke="#5b7a99" stroke-width="2"/><text x="50" y="112" font-size="19" fill="#2c4a68" font-weight="bold">① 内部一致（一致性条款）</text><text x="50" y="142" font-size="16" fill="#34475b">每个易变事实只有一个权威定义，其他材料只引用不复制</text><text x="50" y="170" font-size="16" fill="#34475b">易漂移清单：枚举 · 字段 · 上限 · 阈值 ·</text><text x="50" y="197" font-size="16" fill="#34475b">生命周期 · 输出格式 · 失败降级策略</text><text x="50" y="232" font-size="15" fill="#5b7a99">示例比抽象规则更易被 Agent 模仿，示例违规是直接冲突</text><rect x="490" y="75" width="440" height="200" rx="14" fill="#eef7f2" stroke="#4a8a6a" stroke-width="2"/><text x="510" y="112" font-size="19" fill="#2c5a42" font-weight="bold">② 意图明确（范围条款）</text><text x="510" y="142" font-size="16" fill="#34475b">"没有提到"不等于"不做"；模型会用最常见实现补齐留白</text><text x="510" y="170" font-size="16" fill="#34475b">独立列出：本期做什么 · 明确不做什么 ·</text><text x="510" y="197" font-size="16" fill="#34475b">只支持哪些场景 · 拒绝哪些输入 ·</text><text x="510" y="224" font-size="16" fill="#34475b">数据不足怎么办 · 哪些动作要用户确认</text><text x="510" y="255" font-size="15" fill="#4a8a6a">非目标不是附录，是防止范围漂移的重要需求</text><rect x="30" y="295" width="440" height="200" rx="14" fill="#f2f0fa" stroke="#6a5a9a" stroke-width="2"/><text x="50" y="332" font-size="19" fill="#3a2c68" font-weight="bold">③ 可验收（验收条款）</text><text x="50" y="362" font-size="16" fill="#34475b">"简洁""准确""流畅"不能验收</text><text x="50" y="390" font-size="16" fill="#34475b">每条关键需求都能判断真假，可直接转化为</text><text x="50" y="417" font-size="16" fill="#34475b">测试、门禁或评测用例</text><text x="50" y="448" font-size="15" fill="#6a5a9a">行业对应物：BDD 可执行验收 · Pact 契约测试</text><rect x="490" y="295" width="440" height="200" rx="14" fill="#faf3ee" stroke="#9a6a4a" stroke-width="2"/><text x="510" y="332" font-size="19" fill="#5a3a2c" font-weight="bold">④ 机器友好（可执行格式）</text><text x="510" y="362" font-size="16" fill="#34475b">编号需求 · 字段表 · 状态机 · 正反例 ·</text><text x="510" y="389" font-size="16" fill="#34475b">条件—行为句式 · 术语表</text><text x="510" y="416" font-size="16" fill="#34475b">When/While 受控句式即 EARS 模式的应用</text><text x="510" y="448" font-size="15" fill="#9a6a4a">结构比辞藻重要：Agent 靠结构定位信息</text><text x="30" y="530" font-size="16" fill="#7a8a99">前两个保证文档不自己打自己，后两个保证文档能被人和机器执行到同一个结果。</text></g></svg>