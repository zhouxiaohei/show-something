<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm03-4-title dm03-4-desc"><title id="dm03-4-title">发布前两道关卡</title><desc id="dm03-4-desc">关卡一一致性与完整性检查管文档不自相矛盾，关卡二意图回放管文档是否表达正确意图，两道关卡都只产出问题清单，拍板权在人。</desc><defs><marker id="dm03-4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="38" font-size="22" fill="#34475b">AI 检查，人拍板：两道关卡只产出问题清单</text><rect x="30" y="80" width="440" height="250" rx="14" fill="#eef3f7" stroke="#5b7a99" stroke-width="2"/><text x="50" y="118" font-size="19" fill="#2c4a68" font-weight="bold">关卡一：一致性与完整性检查</text><text x="50" y="148" font-size="16" fill="#34475b">只找问题，不直接重写。输出：</text><text x="50" y="180" font-size="16" fill="#34475b">① 自相矛盾（两处原文+章节）</text><text x="50" y="207" font-size="16" fill="#34475b">② 信息缺口（边界/异常/验收）</text><text x="50" y="234" font-size="16" fill="#34475b">③ 术语漂移 · ④ 示例违规 · ⑤ 决策冲突</text><rect x="50" y="262" width="400" height="46" rx="8" fill="#dcf0e5"/><text x="250" y="291" font-size="15" fill="#2c5a42" text-anchor="middle">旁证：ALICE 自动发现需求矛盾可行 · Kiro 产品化</text><rect x="490" y="80" width="440" height="250" rx="14" fill="#f2f0fa" stroke="#6a5a9a" stroke-width="2"/><text x="510" y="118" font-size="19" fill="#3a2c68" font-weight="bold">关卡二：意图回放</text><text x="510" y="148" font-size="16" fill="#34475b">一致不代表意图正确。让 AI 复述：</text><text x="510" y="180" font-size="16" fill="#34475b">目标用户是谁 · 用户问题是什么</text><text x="510" y="207" font-size="16" fill="#34475b">何时行动 · 何时沉默 · 失败怎么处理</text><text x="510" y="234" font-size="16" fill="#34475b">再给边界输入，看它依据哪条需求</text><rect x="510" y="262" width="400" height="46" rx="8" fill="#e5dcf0"/><text x="710" y="291" font-size="15" fill="#3a2c68" text-anchor="middle">复述偏离=文档表达有问题；人也答不上=需求未决定</text><path d="M250 330v40M710 330v40" stroke="#98a4b0" stroke-width="2" marker-end="url(#dm03-4-arrow)" fill="none"/><rect x="30" y="385" width="900" height="80" rx="12" fill="#fdf6ee" stroke="#b08a5a" stroke-width="2"/><text x="480" y="418" font-size="18" fill="#5a4a2c" text-anchor="middle" font-weight="bold">两道关卡 → 一张问题清单 → 产品负责人拍板</text><text x="480" y="445" font-size="15" fill="#7a6a4a" text-anchor="middle">关卡一管"不自相矛盾"，关卡二管"矛盾之外还要是对的"；AI 是需求体检工具，不是权威来源</text><text x="30" y="510" font-size="16" fill="#7a8a99">行业对应物只解决一半：校验"是否遵守契约"，不校验"契约是否表达了正确的业务意图"。</text></g></svg>