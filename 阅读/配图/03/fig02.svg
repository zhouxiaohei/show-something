<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm03-2-title dm03-2-desc"><title id="dm03-2-title">一个歧义被三条链路放大</title><desc id="dm03-2-desc">PRD 写两项结果、工程规则改为单结果且回写遗漏，三个 Agent 并行各自自洽实现，联调才发现跨端返工。</desc><defs><marker id="dm03-2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="38" font-size="22" fill="#34475b">漂移 + 并行：一个问题膨胀成一次跨端返工</text><rect x="60" y="70" width="840" height="80" rx="12" fill="#fdf6ee" stroke="#b08a5a" stroke-width="2"/><text x="85" y="100" font-size="17" fill="#5a4a2c" font-weight="bold">起点 → 漂移</text><text x="85" y="128" font-size="16" fill="#34475b">PRD 写"最多两项" → 工程改成"唯一结果"，写进门禁代码、提示词、接口 schema——唯独没有回写 PRD</text><path d="M480 150v40" stroke="#98a4b0" stroke-width="2" marker-end="url(#dm03-2-arrow)" fill="none"/><rect x="30" y="200" width="290" height="170" rx="12" fill="#eef3f7" stroke="#5b7a99" stroke-width="2"/><text x="50" y="235" font-size="18" fill="#2c4a68" font-weight="bold">前端 Agent</text><text x="50" y="265" font-size="16" fill="#34475b">读到 PRD</text><text x="50" y="292" font-size="16" fill="#34475b">→ 双卡自适应布局</text><text x="50" y="330" font-size="15" fill="#5b7a99">自洽 ✓</text><rect x="335" y="200" width="290" height="170" rx="12" fill="#eef3f7" stroke="#5b7a99" stroke-width="2"/><text x="355" y="235" font-size="18" fill="#2c4a68" font-weight="bold">后端 Agent</text><text x="355" y="265" font-size="16" fill="#34475b">读到 schema + 门禁</text><text x="355" y="292" font-size="16" fill="#34475b">→ 单结果生命周期</text><text x="355" y="330" font-size="15" fill="#5b7a99">自洽 ✓</text><rect x="640" y="200" width="290" height="170" rx="12" fill="#eef3f7" stroke="#5b7a99" stroke-width="2"/><text x="660" y="235" font-size="18" fill="#2c4a68" font-weight="bold">测试 Agent</text><text x="660" y="265" font-size="16" fill="#34475b">读到门禁代码</text><text x="660" y="292" font-size="16" fill="#34475b">→ 断言"单轮输出数=1"</text><text x="660" y="330" font-size="15" fill="#5b7a99">自洽 ✓</text><rect x="30" y="400" width="900" height="70" rx="12" fill="#fdf0ef" stroke="#b0605a" stroke-width="2"/><text x="55" y="430" font-size="17" fill="#7a3a34" font-weight="bold">联调才炸：没有任何一处代码报错——每一处都符合它读到的那份规格</text><text x="55" y="455" font-size="15" fill="#7a3a34">局部正确组合成全局错误</text><text x="30" y="515" font-size="16" fill="#7a8a99">教训：解法不是"更努力地写好 PRD"，而是给每个易变事实指定唯一权威位置，变更回写规格。</text></g></svg>