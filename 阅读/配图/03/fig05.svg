<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm03-5-title dm03-5-desc"><title id="dm03-5-title">控制点与行业对应物</title><desc id="dm03-5-desc">本文五个控制点与契约测试、BDD、EARS、规格驱动开发等行业实践的对应关系，以及对应物只解决半个问题的边界。</desc><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="38" font-size="22" fill="#34475b">每个控制点都能借用成熟工具，但工具只解决半个问题</text><rect x="30" y="70" width="360" height="66" rx="10" fill="#eef3f7" stroke="#5b7a99" stroke-width="2"/><text x="50" y="97" font-size="16" fill="#2c4a68" font-weight="bold">发布前找冲突（关卡一）</text><text x="50" y="122" font-size="14" fill="#5b7a99">一致性体检，只找不改</text><rect x="440" y="70" width="250" height="66" rx="10" fill="#dcf0e5" stroke="#4a8a6a" stroke-width="2"/><text x="460" y="97" font-size="16" fill="#2c5a42" font-weight="bold">契约测试 Pact</text><text x="460" y="122" font-size="14" fill="#2c5a42">集成前校验同一契约</text><rect x="30" y="156" width="360" height="66" rx="10" fill="#eef3f7" stroke="#5b7a99" stroke-width="2"/><text x="50" y="183" font-size="16" fill="#2c4a68" font-weight="bold">可验收标准（§3.3）</text><text x="50" y="208" font-size="14" fill="#5b7a99">每条需求能判断真假</text><rect x="440" y="156" width="250" height="66" rx="10" fill="#dcf0e5" stroke="#4a8a6a" stroke-width="2"/><text x="460" y="183" font-size="16" fill="#2c5a42" font-weight="bold">BDD（Given/When/Then）</text><text x="460" y="208" font-size="14" fill="#2c5a42">验收文字变测试场景</text><rect x="30" y="242" width="360" height="66" rx="10" fill="#eef3f7" stroke="#5b7a99" stroke-width="2"/><text x="50" y="269" font-size="16" fill="#2c4a68" font-weight="bold">受控句式（§3.4）</text><text x="50" y="294" font-size="14" fill="#5b7a99">条件—行为，结构优先</text><rect x="440" y="242" width="250" height="66" rx="10" fill="#dcf0e5" stroke="#4a8a6a" stroke-width="2"/><text x="460" y="269" font-size="16" fill="#2c5a42" font-weight="bold">EARS 需求句法</text><text x="460" y="294" font-size="14" fill="#2c5a42">IEEE 提出的受控句法</text><rect x="30" y="328" width="360" height="66" rx="10" fill="#eef3f7" stroke="#5b7a99" stroke-width="2"/><text x="50" y="355" font-size="16" fill="#2c4a68" font-weight="bold">单一事实源（§3.1）</text><text x="50" y="380" font-size="14" fill="#5b7a99">易变事实只有一个权威位置</text><rect x="440" y="328" width="250" height="66" rx="10" fill="#dcf0e5" stroke="#4a8a6a" stroke-width="2"/><text x="460" y="355" font-size="16" fill="#2c5a42" font-weight="bold">规格驱动开发</text><text x="460" y="380" font-size="14" fill="#2c5a42">Spec Kit · Kiro</text><rect x="30" y="414" width="360" height="66" rx="10" fill="#eef3f7" stroke="#5b7a99" stroke-width="2"/><text x="50" y="441" font-size="16" fill="#2c4a68" font-weight="bold">变更影响账单（§六）</text><text x="50" y="466" font-size="14" fill="#5b7a99">决定落回权威规格</text><rect x="440" y="414" width="250" height="66" rx="10" fill="#dcf0e5" stroke="#4a8a6a" stroke-width="2"/><text x="460" y="441" font-size="16" fill="#2c5a42" font-weight="bold">契约变更通知</text><text x="460" y="466" font-size="14" fill="#2c5a42">版本化 API 治理</text><path d="M390 103h50M390 189h50M390 275h50M390 361h50M390 447h50" stroke="#98a4b0" stroke-width="2" marker-end="url(#dm03-5-arrow)" fill="none"/><rect x="720" y="70" width="210" height="410" rx="12" fill="#fdf0ef" stroke="#b0605a" stroke-width="2"/><text x="740" y="105" font-size="17" fill="#7a3a34" font-weight="bold">半个问题边界</text><text x="740" y="140" font-size="15" fill="#34475b">对应物校验的是</text><text x="740" y="165" font-size="15" fill="#34475b">"是否遵守契约"，</text><text x="740" y="190" font-size="15" fill="#34475b">不校验"契约是否</text><text x="740" y="215" font-size="15" fill="#34475b">表达了正确的</text><text x="740" y="240" font-size="15" fill="#34475b">业务意图"</text><text x="740" y="280" font-size="15" fill="#7a3a34" font-weight="bold">→ 后者仍是</text><text x="740" y="305" font-size="15" fill="#7a3a34" font-weight="bold">关卡二和</text><text x="740" y="330" font-size="15" fill="#7a3a34" font-weight="bold">产品负责人的事</text><text x="30" y="520" font-size="16" fill="#7a8a99">逐项对齐后可以直接借用成熟工具；映射是作者归纳，各工具的能力边界以实际版本为准。</text></g></svg>