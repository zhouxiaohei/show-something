<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm03-1-title dm03-1-desc"><title id="dm03-1-title">两类读者的行为分叉</title><desc id="dm03-1-desc">同一份含歧义的 PRD，人类读者发现冲突后去问去翻记录、偏差在人肉实现前被拦截；Agent 读者不询问、选定一种解释并同时写进代码测试接口页面。</desc><defs><marker id="dm03-1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="38" font-size="22" fill="#34475b">同一份文档，两种命运：人会把问题问出来，机器只挑一个版本</text><rect x="240" y="70" width="480" height="60" rx="12" fill="#fdf6ee" stroke="#b08a5a" stroke-width="2"/><text x="480" y="98" font-size="17" fill="#5a4a2c" text-anchor="middle" font-weight="bold">同一份含歧义的 PRD</text><text x="480" y="120" font-size="15" fill="#7a6a4a" text-anchor="middle">"一次请求最多两项结果" vs "一轮只允许唯一结果"</text><path d="M300 130 160 200M660 130 800 200" stroke="#98a4b0" stroke-width="2" marker-end="url(#dm03-1-arrow)" fill="none"/><rect x="40" y="205" width="330" height="215" rx="14" fill="#eef7f2" stroke="#4a8a6a" stroke-width="2"/><text x="60" y="240" font-size="19" fill="#2c5a42" font-weight="bold">人类读者（决策文档）</text><text x="60" y="275" font-size="16" fill="#34475b">发现两处冲突</text><text x="60" y="305" font-size="16" fill="#34475b">→ 去问 / 翻会议记录</text><text x="60" y="335" font-size="16" fill="#34475b">→ 澄清后收敛到同一版本</text><rect x="60" y="360" width="290" height="40" rx="8" fill="#dcf0e5"/><text x="205" y="386" font-size="16" fill="#2c5a42" text-anchor="middle" font-weight="bold">偏差在人肉实现前被拦截</text><rect x="590" y="205" width="330" height="215" rx="14" fill="#fdf0ef" stroke="#b0605a" stroke-width="2"/><text x="610" y="240" font-size="19" fill="#7a3a34" font-weight="bold">Agent 读者（执行文档）</text><text x="610" y="275" font-size="16" fill="#34475b">发现两处冲突</text><text x="610" y="305" font-size="16" fill="#34475b">→ 不询问，选定一种解释</text><text x="610" y="335" font-size="16" fill="#34475b">→ 同时写进 代码·测试·接口·页面</text><rect x="610" y="360" width="290" height="40" rx="8" fill="#f5dbd8"/><text x="755" y="386" font-size="16" fill="#7a3a34" text-anchor="middle" font-weight="bold">一套自洽的错误实现，人承担返工</text><text x="30" y="475" font-size="16" fill="#7a8a99">分叉不在阅读能力，而在遇到歧义后的行为：人把 PRD 当"待澄清的意图记录"，Agent 把它当"待执行的规格本身"。</text><text x="30" y="510" font-size="16" fill="#7a8a99">歧义本身的成本不高，高的是歧义被并行执行的成本。</text></g></svg>