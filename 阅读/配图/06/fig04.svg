<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm06-4-title dm06-4-desc"><title id="dm06-4-title">四步通用解法与 Claude Code 官方工作流对应</title><desc id="dm06-4-desc">裁决输入、定目标、沟通对齐、混乱就重构四步，分别对应官方 Explore、Plan、Implement 与 /clear；不做第四次纠正，重开的交付物是一份更好的任务书。</desc><defs><marker id="dm06-4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">通用解法 · 四步流程，与 Claude Code 官方工作流对齐</text><g><rect x="25" y="62" width="212" height="270" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="131" y="92" font-size="19" fill="#34475b" text-anchor="middle">① 裁决输入</text><text x="37" y="122" font-size="17" fill="#5c6d80" text-anchor="start">先定"什么算数"：</text><text x="37" y="146" font-size="17" fill="#5c6d80" text-anchor="start">日志、旧猜测、过时</text><text x="37" y="170" font-size="17" fill="#5c6d80" text-anchor="start">文档里谁算权威；每</text><text x="37" y="194" font-size="17" fill="#5c6d80" text-anchor="start">类任务有权威来源</text><text x="37" y="250" font-size="17" fill="#34475b" text-anchor="start">官方对应 Explore</text></g><g><rect x="257" y="62" width="212" height="270" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="363" y="92" font-size="19" fill="#34475b" text-anchor="middle">② 定目标</text><text x="269" y="122" font-size="17" fill="#5c6d80" text-anchor="start">要解决什么、现状、</text><text x="269" y="146" font-size="17" fill="#5c6d80" text-anchor="start">要做成什么样；目标</text><text x="269" y="170" font-size="17" fill="#5c6d80" text-anchor="start">必须带验收：怎么算</text><text x="269" y="194" font-size="17" fill="#5c6d80" text-anchor="start">修好、怎么算调研完</text><text x="269" y="250" font-size="17" fill="#34475b" text-anchor="start">官方对应 Plan</text></g><g><rect x="489" y="62" width="212" height="270" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="595" y="92" font-size="19" fill="#34475b" text-anchor="middle">③ 沟通对齐</text><text x="501" y="122" font-size="17" fill="#5c6d80" text-anchor="start">动手前先复述目标、</text><text x="501" y="146" font-size="17" fill="#5c6d80" text-anchor="start">约束、已否决项；</text><text x="501" y="170" font-size="17" fill="#5c6d80" text-anchor="start">小步走，跑偏马上纠</text><text x="501" y="194" font-size="17" fill="#5c6d80" text-anchor="start">正，不攒到第四次</text><text x="501" y="250" font-size="17" fill="#34475b" text-anchor="start">官方对应 Implement</text></g><g><rect x="721" y="62" width="212" height="270" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="827" y="92" font-size="19" fill="#34475b" text-anchor="middle">④ 混乱就重构</text><text x="733" y="122" font-size="17" fill="#5c6d80" text-anchor="start">不做第四次纠正；</text><text x="733" y="146" font-size="17" fill="#5c6d80" text-anchor="start">窗口堆死就开新窗口，</text><text x="733" y="170" font-size="17" fill="#5c6d80" text-anchor="start">只带结论不带过程，</text><text x="733" y="194" font-size="17" fill="#5c6d80" text-anchor="start">重写任务书</text><text x="733" y="250" font-size="17" fill="#34475b" text-anchor="start">官方对应 /clear</text></g><path d="M239,182 L255,182" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm06-4-arrow)"/><path d="M471,182 L487,182" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm06-4-arrow)"/><path d="M703,182 L719,182" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm06-4-arrow)"/><path d="M480,332 L480,354" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm06-4-arrow)"/><g><rect x="25" y="358" width="910" height="150" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="388" font-size="19" fill="#34475b">不做第四次纠正——"再想想""再试一次"不是第四步，是在原地加轮次</text><text x="45" y="420" font-size="17" fill="#5c6d80">官方阈值：同一问题纠正超过两次，就 /clear，并带着学到的东西重写更具体的 prompt</text><text x="45" y="448" font-size="17" fill="#5c6d80">重开的交付物是一份更好的任务书，不是一个更空的窗口；空窗口配旧问题＝把失败重放一遍</text><text x="45" y="476" font-size="17" fill="#5c6d80">如实交代：官方没给"这套流程提升成功率"的量化数字，四步与官方工作流的对应是本文标注的</text></g><text x="480" y="540" font-size="17" fill="#5c6d80" text-anchor="middle">官方理由：Separate research and planning from implementation to avoid solving the wrong problem</text></g></svg>
