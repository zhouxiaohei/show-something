<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm06-2-title dm06-2-desc"><title id="dm06-2-title">四种答不对的分诊与三问检测</title><desc id="dm06-2-desc">缺料、歧义、冲突、能力四种答不对各有症状与处置，只有冲突该重开；冲突用三个问题一分钟分诊，任一踩中就是冲突型，三问全过还乱则是需求自相矛盾。</desc><defs><marker id="dm06-2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">先把"答不对"分成四种：混着治，会把"你没说清"误诊成"上下文有病"</text><g><rect x="25" y="62" width="220" height="190" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="135" y="92" font-size="19" fill="#34475b" text-anchor="middle">缺料</text><text x="39" y="120" font-size="17" fill="#5c6d80" text-anchor="start">第一轮就答偏，多问两句</text><text x="39" y="144" font-size="17" fill="#5c6d80" text-anchor="start">才发现关键信息你没给</text><text x="39" y="184" font-size="17" fill="#34475b" text-anchor="start">→ 补材料，不用重开</text></g><g><rect x="250" y="62" width="220" height="190" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="360" y="92" font-size="19" fill="#34475b" text-anchor="middle">歧义</text><text x="264" y="120" font-size="17" fill="#5c6d80" text-anchor="start">答得对，但不是你要的</text><text x="264" y="144" font-size="17" fill="#5c6d80" text-anchor="start">那个对</text><text x="264" y="184" font-size="17" fill="#34475b" text-anchor="start">→ 改写成可判定条件</text></g><g><rect x="475" y="62" width="220" height="190" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="585" y="92" font-size="19" fill="#34475b" text-anchor="middle">冲突（该重开）</text><text x="489" y="120" font-size="17" fill="#5c6d80" text-anchor="start">前几轮对，某一轮之后</text><text x="489" y="144" font-size="17" fill="#5c6d80" text-anchor="start">开始反复错，越纠越偏</text><text x="489" y="184" font-size="17" fill="#34475b" text-anchor="start">→ 重开，并重写任务书</text></g><g><rect x="700" y="62" width="220" height="190" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="810" y="92" font-size="19" fill="#34475b" text-anchor="middle">能力</text><text x="714" y="120" font-size="17" fill="#5c6d80" text-anchor="start">超出模型当前能力：</text><text x="714" y="144" font-size="17" fill="#5c6d80" text-anchor="start">长链路推理、超大重构</text><text x="714" y="184" font-size="17" fill="#34475b" text-anchor="start">→ 换模型或拆任务</text></g><path d="M585,252 L585,274" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm06-2-arrow)"/><g><rect x="25" y="278" width="910" height="150" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="306" font-size="19" fill="#34475b">三问分诊（一分钟）——任一踩中，就是冲突型</text><text x="45" y="334" font-size="17" fill="#5c6d80">① 它能不能准确复述当前目标、已否决的方案、完成判据？——不能，就是冲突</text><text x="45" y="362" font-size="17" fill="#5c6d80">② 纠正第二次之后，是改对了，还是换了个错法？——换错法，就是冲突</text><text x="45" y="390" font-size="17" fill="#5c6d80">③ 删掉它的上一轮回答、只留原始材料，它还这么答吗？——答法变了，就是冲突</text></g><path d="M480,428 L480,450" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm06-2-arrow)"/><g><rect x="25" y="454" width="910" height="78" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="482" font-size="19" fill="#34475b">三问全过还是乱＝需求自相矛盾，人来裁决；重开两次还错，就别再重开</text><text x="45" y="510" font-size="17" fill="#5c6d80">官方阈值可抄：同一问题纠正超过两次，就 /clear 并带着学到的东西重写 prompt（Claude Code 官方文档）</text></g></g></svg>
