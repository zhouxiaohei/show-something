<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm06-1-title dm06-1-desc"><title id="dm06-1-title">新建与更新的信息结构不对称</title><desc id="dm06-1-desc">新建请求只有目标一条力线；更新请求同时携带现状、旧决定的理由与新目标三股力，外加一条只藏在现状里、从没写进请求的兼容性约束，产物还必须与没被提到的部分兼容。</desc><defs><marker id="dm06-1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">更新难，不在"改"，在同时维护三个值，其中一个还没人说出口</text><g><rect x="25" y="62" width="910" height="84" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="92" font-size="19" fill="#34475b">新建：一条力线</text><text x="45" y="120" font-size="17" fill="#5c6d80">目标 G → 产物 X；上下文里只有一个方向的力，验收是阳性命题（能跑、满足需求、测试能过）</text></g><path d="M480,146 L480,168" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm06-1-arrow)"/><g><rect x="25" y="172" width="910" height="250" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="200" font-size="19" fill="#34475b">更新：三股力，一股缺席</text><g><rect x="45" y="215" width="200" height="64" rx="10" fill="#ffffff" stroke="#98a4b0" stroke-width="1.5"/><text x="145" y="242" font-size="19" fill="#34475b" text-anchor="middle">现状 S</text><text x="145" y="264" font-size="17" fill="#5c6d80" text-anchor="middle">含未说出口的约束</text></g><g><rect x="265" y="215" width="200" height="64" rx="10" fill="#ffffff" stroke="#98a4b0" stroke-width="1.5"/><text x="365" y="242" font-size="19" fill="#34475b" text-anchor="middle">旧决定的理由 R</text><text x="365" y="264" font-size="17" fill="#5c6d80" text-anchor="middle">原来为什么那样</text></g><g><rect x="485" y="215" width="200" height="64" rx="10" fill="#ffffff" stroke="#98a4b0" stroke-width="1.5"/><text x="585" y="242" font-size="19" fill="#34475b" text-anchor="middle">新目标 G'</text><text x="585" y="264" font-size="17" fill="#5c6d80" text-anchor="middle">这次要做成什么样子</text></g><g><rect x="705" y="215" width="230" height="64" rx="10" fill="none" stroke="#98a4b0" stroke-width="1.5" stroke-dasharray="6 4"/><text x="820" y="242" font-size="19" fill="#34475b" text-anchor="middle">兼容性约束</text><text x="820" y="264" font-size="17" fill="#5c6d80" text-anchor="middle">从没写进请求</text></g><path d="M145,279 L145,308" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm06-1-arrow)"/><path d="M365,279 L365,308" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm06-1-arrow)"/><path d="M585,279 L585,308" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm06-1-arrow)"/><path d="M820,279 L820,296 L690,296 L690,308" fill="none" stroke="#98a4b0" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#dm06-1-arrow)"/><g><rect x="45" y="312" width="640" height="50" rx="10" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="365" y="343" font-size="19" fill="#34475b" text-anchor="middle">产物 X'（须与现状里没被提到的那部分兼容）</text></g><text x="725" y="343" font-size="17" fill="#5c6d80" text-anchor="start">虚线是全图的关键：它不在请求里，只在现状里</text></g><path d="M480,422 L480,444" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm06-1-arrow)"/><g><rect x="25" y="448" width="910" height="84" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="478" font-size="19" fill="#34475b">缺席约束：人省掉"不许动什么"，模型拿到的不是"只许改这一处的材料"，是"一份可以被重写的材料"</text><text x="45" y="506" font-size="17" fill="#5c6d80">后果是改动溢出：只要一个开关，得到一次重构；写清"不许动什么"的价值通常高于把"要改什么"写得更细</text></g><text x="480" y="552" font-size="17" fill="#5c6d80" text-anchor="middle">兼容性约束新建时不存在，更新时它一直在；更新的验收是阴性命题：改对了，而且没改坏别的地方</text></g></svg>
