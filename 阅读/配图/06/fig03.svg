<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm06-3-title dm06-3-desc"><title id="dm06-3-title">冲突不会暴露，它会被解释成自洽：三份证据</title><desc id="dm06-3-desc">Laban 实验显示多轮比单轮平均低 39%，早期答案变成后续前提；Breunig 把这类失效命名为上下文冲突；TRUTH DECAY 显示持续施压下第 7 次追问降到 30.23%，模型锚定已写下的结论。</desc><defs><marker id="dm06-3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">机制二 · 矛盾不会举手报告，它会被解释成一套自洽的东西</text><g><rect x="25" y="62" width="910" height="120" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="90" font-size="19" fill="#34475b">证据一 · Laban 2025-05-09［论文］：早期的错误会变成后续的前提</text><text x="45" y="118" font-size="17" fill="#5c6d80">同一份完整提示拆成多轮，六个生成任务平均低 39%；o3 从 98.1 掉到 64.1——信息没少，只是分了几轮说</text><text x="45" y="146" font-size="17" fill="#5c6d80">机制：信息不全时过早写下方案；方案不消失，变成后续推理必须相容的前例</text></g><path d="M480,182 L480,196" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm06-3-arrow)"/><g><rect x="25" y="200" width="910" height="120" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="228" font-size="19" fill="#34475b">证据二 · Breunig 2025-06-22［工程博客］：这类失效有名字——上下文冲突（context clash）</text><text x="45" y="256" font-size="17" fill="#5c6d80">窗口里新增的信息与已有信息互相矛盾；裁决失败的样子和分心一样：答了一个看似相关、实际不对的东西</text><text x="45" y="284" font-size="17" fill="#5c6d80">注意：四分类是给现象起名，不是量化结论；未被 Anthropic、LangChain、Manus 的官方框架采纳</text></g><path d="M480,320 L480,334" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm06-3-arrow)"/><g><rect x="25" y="338" width="910" height="120" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="366" font-size="19" fill="#34475b">证据三 · TRUTH DECAY 2025-02-04［论文］：顺着错走之后，就回不来了</text><text x="45" y="394" font-size="17" fill="#5c6d80">持续施压下，Claude 第 1 次追问 76.74% → 第 7 次 30.23%，低于随机猜；Llama 3.1 8B 从 29.33% 崩到 5.11%</text><text x="45" y="422" font-size="17" fill="#5c6d80">解释：模型把连贯性排在真实性前面，已写下的结论约束后续回答，越纠越顺着走</text></g><path d="M480,458 L480,472" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm06-3-arrow)"/><g><rect x="25" y="476" width="910" height="68" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="504" font-size="19" fill="#34475b">合起来：每一轮都在给下一轮加一条"必须与之相容"的前例；轮次越多，可回退的空间越小</text><text x="45" y="530" font-size="17" fill="#5c6d80">所以检测靠复述和对照证据，不是让它"再想想"——那只是让它在同一套解释里写得更长、更自信</text></g></g></svg>
