<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm06-5-title dm06-5-desc"><title id="dm06-5-title">重开不是清空：交接四件事与需求侧出口</title><desc id="dm06-5-desc">重开时交接四件事：不能变的结果、已证明走不通的路、现在客观是什么、怎么算完成；要删的是过程不是证据；重开两次还错说明问题在需求侧，出口不在上下文里。</desc><defs><marker id="dm06-5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">重开不是清空 · 交接四件事，出口在需求侧</text><g><rect x="25" y="62" width="470" height="340" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="92" font-size="19" fill="#34475b">交接四件事（顺序有讲究）</text><text x="45" y="128" font-size="19" fill="#34475b">① 不能变的结果</text><text x="45" y="152" font-size="17" fill="#5c6d80">一句话，能判定对错的那种</text><text x="45" y="184" font-size="19" fill="#34475b">② 已经证明走不通的路</text><text x="45" y="208" font-size="17" fill="#5c6d80">方案＋否决理由＋证据；不留十二次试错过程</text><text x="45" y="240" font-size="19" fill="#34475b">③ 现在客观是什么</text><text x="45" y="264" font-size="17" fill="#5c6d80">不要转述，让它自己读代码、读 diff、读文件</text><text x="45" y="296" font-size="19" fill="#34475b">④ 怎么算完成</text><text x="45" y="320" font-size="17" fill="#5c6d80">可执行的验证方式，不是"看起来对"</text><text x="45" y="356" font-size="17" fill="#5c6d80">先约束、再走不通、最后才是要做什么；</text><text x="45" y="378" font-size="17" fill="#5c6d80">反过来写，约束会变成事后装饰</text></g><g><rect x="515" y="62" width="420" height="170" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="535" y="92" font-size="19" fill="#34475b">重开后的第一条消息</text><text x="535" y="120" font-size="17" fill="#5c6d80">不该是"帮我改 X"；</text><text x="535" y="144" font-size="17" fill="#5c6d80">该是"先复述：目标、约束、</text><text x="535" y="168" font-size="17" fill="#5c6d80">已否决项、完成判据"。</text><text x="535" y="196" font-size="17" fill="#34475b">复述错了＝任务书错了，这时改任务书最便宜</text></g><g><rect x="515" y="246" width="420" height="156" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="535" y="274" font-size="19" fill="#34475b">要删的是过程，不是证据</text><text x="535" y="302" font-size="17" fill="#5c6d80">"erasing failure removes evidence"</text><text x="535" y="326" font-size="17" fill="#5c6d80">（Manus 工程博客）留"方案 A 因何被否"，</text><text x="535" y="350" font-size="17" fill="#5c6d80">删"我们试了 12 次的报错原文"</text><text x="535" y="378" font-size="17" fill="#34475b">判据：这条信息还能不能约束未来的选择</text></g><g><rect x="25" y="416" width="910" height="116" rx="12" fill="#fdf3e3" stroke="#c49a58" stroke-width="1.5"/><text x="45" y="446" font-size="19" fill="#34475b">重开两次还错，就别再重开——问题在需求侧，出口不在上下文里</text><text x="45" y="474" font-size="17" fill="#5c6d80">重开不免费：新窗口前缀缓存失效，缓存 0.30 vs 未缓存 3 美元/百万 token，差 10 倍（Manus）</text><text x="45" y="502" font-size="17" fill="#5c6d80">判据不是"感觉有点乱"：它还能准确复述任务模型就留着继续；复述不出，才重开</text></g><text x="480" y="554" font-size="17" fill="#5c6d80" text-anchor="middle">本文管冲突轴；噪声轴（信息变旧、约束悄悄丢失）的对症输入模板在第 01 篇 §七</text></g></svg>
