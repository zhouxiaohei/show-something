<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1240" role="img" aria-labelledby="memory13-11-title memory13-11-desc"><title id="memory13-11-title">按内容性质判定优先依据</title><desc id="memory13-11-desc">偏好、事实经验和正式要求采用不同依据，测试标准与本次结果分开判断。</desc><defs><marker id="memory13-11-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">个人与团队冲突：先判断内容，再选择依据</text><g><rect x="25" y="100" width="440" height="140" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="245.0" y="160.5" font-size="19" fill="#34475b" text-anchor="middle">个人记忆 / 当前观察</text><text x="245.0" y="196.5" font-size="17" fill="#5c6d80" text-anchor="middle">可能更及时，也可能只是猜测</text></g><g><rect x="495" y="100" width="440" height="140" rx="12" fill="#eef4fc" stroke="#6b87ac" stroke-width="1.5"/><text x="715.0" y="160.5" font-size="19" fill="#34475b" text-anchor="middle">团队共享资料／记忆</text><text x="715.0" y="196.5" font-size="17" fill="#5c6d80" text-anchor="middle">可能是有效规范，也可能已经陈旧</text></g><g><rect x="340" y="345" width="280" height="125" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="480.0" y="401.5" font-size="19" fill="#34475b" text-anchor="middle">核对适用范围</text><text x="480.0" y="427.5" font-size="19" fill="#34475b" text-anchor="middle">判断内容性质</text></g><path d="M245,240 L245,285 L420,285 L420,340" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-11-arrow)"/><path d="M715,240 L715,285 L540,285 L540,340" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-11-arrow)"/><g><rect x="25" y="585" width="280" height="180" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="165.0" y="654.0" font-size="19" fill="#34475b" text-anchor="middle">个人表达与协作偏好</text><text x="165.0" y="690.0" font-size="17" fill="#5c6d80" text-anchor="middle">本人最近明确的偏好</text><text x="165.0" y="713.0" font-size="17" fill="#5c6d80" text-anchor="middle">满足强制交付要求</text></g><g><rect x="340" y="585" width="280" height="180" rx="12" fill="#eef4fc" stroke="#6b87ac" stroke-width="1.5"/><text x="480.0" y="654.0" font-size="19" fill="#34475b" text-anchor="middle">事实与技术经验</text><text x="480.0" y="690.0" font-size="17" fill="#5c6d80" text-anchor="middle">匹配前提、核对验证</text><text x="480.0" y="713.0" font-size="17" fill="#5c6d80" text-anchor="middle">再比较信息时间</text></g><g><rect x="655" y="585" width="280" height="180" rx="12" fill="#fff5e5" stroke="#b59a67" stroke-width="1.5"/><text x="795.0" y="654.0" font-size="19" fill="#34475b" text-anchor="middle">正式规范与测试要求</text><text x="795.0" y="690.0" font-size="17" fill="#5c6d80" text-anchor="middle">有效规则及获准例外</text><text x="795.0" y="713.0" font-size="17" fill="#5c6d80" text-anchor="middle">测试结果看本次证据</text></g><path d="M480,470 L480,525 L165,525 L165,580" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-11-arrow)"/><path d="M480,470 L480,580" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-11-arrow)"/><path d="M480,470 L480,525 L795,525 L795,580" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-11-arrow)"/><g><rect x="25" y="955" width="910" height="110" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="480.0" y="1000.5" font-size="19" fill="#34475b" text-anchor="middle">依据不足或仍无法判定：回查并保留冲突</text><text x="480.0" y="1036.5" font-size="17" fill="#5c6d80" text-anchor="middle">记录来源和未确认状态；不因本地或共享的位置静默覆盖</text></g><path d="M165,765 L165,855 L420,855 L420,950" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-11-arrow)" stroke-dasharray="6 5"/><path d="M795,765 L795,855 L540,855 L540,950" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-11-arrow)" stroke-dasharray="6 5"/><path d="M480,765 L480,950" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-11-arrow)" stroke-dasharray="6 5"/><text x="555" y="905" font-size="17" fill="#34475b" text-anchor="start">不能判定时才回查</text><text x="25" y="1135" font-size="17" fill="#5c6d80" text-anchor="start">这是本文的判定建议，不是Anthropic或AWS的默认排序。资料归属不自动决定权威；正式新版即使保存在本地，也</text><text x="25" y="1160" font-size="17" fill="#5c6d80" text-anchor="start">应按有效来源核对。</text></g></svg>