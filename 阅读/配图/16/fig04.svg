<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 915" role="img" aria-labelledby="memory13-4-title memory13-4-desc"><title id="memory13-4-title">目录、证据指针与文件图</title><desc id="memory13-4-desc">关系的对象和维护方式不同，不能统一称为同一种图记忆。</desc><defs><marker id="memory13-4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="21" fill="#34475b" text-anchor="start">三种联系：目录指主题、摘要指证据、文件连文件</text><g><rect x="25" y="100" width="280" height="140" rx="12" fill="#eef4fc" stroke="#6b87ac" stroke-width="1.5"/><text x="165.0" y="160.5" font-size="19" fill="#34475b" text-anchor="middle">Claude入口</text><text x="165.0" y="196.5" font-size="17" fill="#5c6d80" text-anchor="middle">MEMORY.md目录</text></g><g><rect x="340" y="100" width="280" height="140" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="480.0" y="160.5" font-size="19" fill="#34475b" text-anchor="middle">保存指向</text><text x="480.0" y="196.5" font-size="17" fill="#5c6d80" text-anchor="middle">主题名 / 简短说明 / 路径</text></g><g><rect x="655" y="100" width="280" height="140" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="160.5" font-size="19" fill="#34475b" text-anchor="middle">主题文件</text><text x="795.0" y="196.5" font-size="17" fill="#5c6d80" text-anchor="middle">反馈、画像、项目等正文</text></g><path d="M305,170.0 L335,170.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-4-arrow)"/><path d="M620,170.0 L650,170.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-4-arrow)"/><g><rect x="25" y="335" width="280" height="140" rx="12" fill="#eef4fc" stroke="#6b87ac" stroke-width="1.5"/><text x="165.0" y="395.5" font-size="19" fill="#34475b" text-anchor="middle">Codex综合摘要</text><text x="165.0" y="431.5" font-size="17" fill="#5c6d80" text-anchor="middle">跨任务信息</text></g><g><rect x="340" y="335" width="280" height="140" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="480.0" y="395.5" font-size="19" fill="#34475b" text-anchor="middle">保存来源</text><text x="480.0" y="431.5" font-size="17" fill="#5c6d80" text-anchor="middle">任务摘要路径 / 任务信息</text></g><g><rect x="655" y="335" width="280" height="140" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="395.5" font-size="19" fill="#34475b" text-anchor="middle">生成的任务摘要</text><text x="795.0" y="431.5" font-size="17" fill="#5c6d80" text-anchor="middle">不是原始会话JSONL</text></g><path d="M305,405.0 L335,405.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-4-arrow)"/><path d="M620,405.0 L650,405.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-4-arrow)"/><g><rect x="25" y="570" width="280" height="140" rx="12" fill="#eef4fc" stroke="#6b87ac" stroke-width="1.5"/><text x="165.0" y="630.5" font-size="19" fill="#34475b" text-anchor="middle">ReMe笔记</text><text x="165.0" y="666.5" font-size="17" fill="#5c6d80" text-anchor="middle">例如订单验收.md</text></g><g><rect x="340" y="570" width="280" height="140" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="480.0" y="630.5" font-size="19" fill="#34475b" text-anchor="middle">来源与文件链接</text><text x="480.0" y="666.5" font-size="17" fill="#5c6d80" text-anchor="middle">程序可维护file_graph</text></g><g><rect x="655" y="570" width="280" height="140" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="630.5" font-size="19" fill="#34475b" text-anchor="middle">相关笔记</text><text x="795.0" y="666.5" font-size="17" fill="#5c6d80" text-anchor="middle">例如数据库配置.md</text></g><path d="M305,640.0 L335,640.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-4-arrow)"/><path d="M620,640.0 L650,640.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-4-arrow)"/><text x="25" y="805" font-size="17" fill="#5c6d80" text-anchor="start">箭头是保存的引用/关联，不是运行调用。文件图不自动包含实体消歧与关系有效时间；改名、删除和更正时也要维</text><text x="25" y="830" font-size="17" fill="#5c6d80" text-anchor="start">护链接。示例名为教学构造。</text></g></svg>