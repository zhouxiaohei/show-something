<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1150" role="img" aria-labelledby="memory13-10-title memory13-10-desc"><title id="memory13-10-title">个人记忆与可选团队共享</title><desc id="memory13-10-desc">保留个人四类职责，将选择性的共享提交、审核、保存与后续读取画清。</desc><defs><marker id="memory13-10-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">个人四类继续维护，有共享价值的内容再提交</text><rect x="25" y="110" width="430" height="410" rx="14" fill="#fafbfc" stroke="#b6c1cb"/><text x="45" y="150" font-size="19" fill="#34475b" text-anchor="start">个人侧：沿用原Agent机制</text><g><rect x="45" y="185" width="185" height="125" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="137.5" y="238.0" font-size="19" fill="#34475b" text-anchor="middle">会话记录</text><text x="137.5" y="274.0" font-size="17" fill="#5c6d80" text-anchor="middle">程序保存经过</text></g><g><rect x="250" y="185" width="185" height="125" rx="12" fill="#eef4fc" stroke="#6b87ac" stroke-width="1.5"/><text x="342.5" y="238.0" font-size="19" fill="#34475b" text-anchor="middle">当前上下文</text><text x="342.5" y="274.0" font-size="17" fill="#5c6d80" text-anchor="middle">组织本次材料</text></g><g><rect x="45" y="345" width="185" height="125" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="137.5" y="398.0" font-size="19" fill="#34475b" text-anchor="middle">持久指令</text><text x="137.5" y="434.0" font-size="17" fill="#5c6d80" text-anchor="middle">人 / 应用维护</text></g><g><rect x="250" y="345" width="185" height="125" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="342.5" y="398.0" font-size="19" fill="#34475b" text-anchor="middle">Memory</text><text x="342.5" y="434.0" font-size="17" fill="#5c6d80" text-anchor="middle">原机制生成与更新</text></g><g><rect x="570" y="345" width="365" height="140" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="752.5" y="394.0" font-size="19" fill="#34475b" text-anchor="middle">共享更新建议</text><text x="752.5" y="430.0" font-size="17" fill="#5c6d80" text-anchor="middle">人提交 / AI整理</text><text x="752.5" y="453.0" font-size="17" fill="#5c6d80" text-anchor="middle">注明依据和适用条件</text></g><path d="M435,410 L565,410" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-10-arrow)"/><text x="470" y="320" font-size="17" fill="#34475b" text-anchor="start">选择性提交</text><g><rect x="570" y="590" width="365" height="130" rx="12" fill="#fff5e5" stroke="#b59a67" stroke-width="1.5"/><text x="752.5" y="645.5" font-size="19" fill="#34475b" text-anchor="middle">有权维护者检查</text><text x="752.5" y="681.5" font-size="17" fill="#5c6d80" text-anchor="middle">内容、依据与适用范围</text></g><path d="M750,485 L750,585" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-10-arrow)"/><g><rect x="570" y="820" width="365" height="145" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="752.5" y="883.0" font-size="19" fill="#34475b" text-anchor="middle">团队共享资料／记忆</text><text x="752.5" y="919.0" font-size="17" fill="#5c6d80" text-anchor="middle">现有文档 / 规则 / 可选知识库</text></g><path d="M750,720 L750,815" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-10-arrow)"/><path d="M935,890 L950,890 L950,80 L342,80 L342,180" fill="none" stroke="#6485a8" stroke-width="2" marker-end="url(#memory13-10-arrow)" stroke-dasharray="6 5"/><text x="485" y="105" font-size="17" fill="#34475b" text-anchor="start">后续按需读取共享内容</text><g><rect x="25" y="640" width="430" height="155" rx="12" fill="#eef4fc" stroke="#6b87ac" stroke-width="1.5"/><text x="240.0" y="696.5" font-size="19" fill="#34475b" text-anchor="middle">保存后的生效时间另看实现</text><text x="240.0" y="732.5" font-size="17" fill="#5c6d80" text-anchor="middle">共享正文已更新，不等于旧会话已采用</text><text x="240.0" y="755.5" font-size="17" fill="#5c6d80" text-anchor="middle">成员需要同步或重新读取</text></g><text x="25" y="1035" font-size="17" fill="#5c6d80" text-anchor="start">实线是生成与保存；虚线是后续按需读取。审核后共享是本文选择的流程，平台也可以提供自动维护；没有共享需求</text><text x="25" y="1060" font-size="17" fill="#5c6d80" text-anchor="start">时不必建设独立知识库。</text></g></svg>