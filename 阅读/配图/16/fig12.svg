<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1290" role="img" aria-labelledby="memory13-12-title memory13-12-desc"><title id="memory13-12-title">跨项目适用范围的痛点与待解决问题</title><desc id="memory13-12-desc">范围过窄会漏用，范围过宽会串用；项目与产品是待评估方向而非已确定模型。</desc><defs><marker id="memory13-12-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">待解决：一条经验究竟适用于哪些项目</text><g><rect x="25" y="110" width="910" height="145" rx="12" fill="#eef4fc" stroke="#6b87ac" stroke-width="1.5"/><text x="480.0" y="173.0" font-size="19" fill="#34475b" text-anchor="middle">教学例：旧鉴权组件的迁移经验</text><text x="480.0" y="209.0" font-size="17" fill="#5c6d80" text-anchor="middle">订单、支付、库存适用；运营已换新组件</text></g><g><rect x="25" y="400" width="440" height="145" rx="12" fill="#fff5e5" stroke="#b59a67" stroke-width="1.5"/><text x="245.0" y="463.0" font-size="19" fill="#34475b" text-anchor="middle">各自只查本项目</text><text x="245.0" y="499.0" font-size="17" fill="#5c6d80" text-anchor="middle">没有关联入口，支付和库存容易漏用</text></g><g><rect x="495" y="400" width="440" height="145" rx="12" fill="#fff5e5" stroke="#b59a67" stroke-width="1.5"/><text x="715.0" y="463.0" font-size="19" fill="#34475b" text-anchor="middle">按整个产品通用</text><text x="715.0" y="499.0" font-size="17" fill="#5c6d80" text-anchor="middle">运营可能误用旧组件经验</text></g><path d="M480,255 L480,315 L245,315 L245,395" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-12-arrow)"/><path d="M480,255 L480,315 L715,315 L715,395" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-12-arrow)"/><g><rect x="25" y="705" width="910" height="155" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="480.0" y="761.5" font-size="19" fill="#34475b" text-anchor="middle">谁来确认和维护适用范围？</text><text x="480.0" y="797.5" font-size="17" fill="#5c6d80" text-anchor="middle">哪些项目、组件和版本适用</text><text x="480.0" y="820.5" font-size="17" fill="#5c6d80" text-anchor="middle">变化后怎样修订，个人与共享内容怎样对照</text></g><path d="M245,545 L245,625 L420,625 L420,700" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-12-arrow)"/><path d="M715,545 L715,625 L540,625 L540,700" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-12-arrow)"/><g><rect x="25" y="1000" width="910" height="120" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="480.0" y="1050.5" font-size="19" fill="#34475b" text-anchor="middle">候选方向：项目／产品、关联项目集合、组件与版本条件</text><text x="480.0" y="1086.5" font-size="17" fill="#5c6d80" text-anchor="middle">尚未选定方案；平台组合与筛选能力不替业务决定适用性</text></g><path d="M480,860 L480,995" fill="none" stroke="#8c79b5" stroke-width="2" marker-end="url(#memory13-12-arrow)" stroke-dasharray="6 5"/><text x="25" y="1185" font-size="17" fill="#5c6d80" text-anchor="start">实线展示问题及痛点，虚线表示后续研究方向。此图记录尚待解决的业务语义，不把候选方案画成已实现的记忆分层</text><text x="25" y="1210" font-size="17" fill="#5c6d80" text-anchor="start">。</text></g></svg>