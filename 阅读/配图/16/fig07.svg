<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 915" role="img" aria-labelledby="memory13-7-title memory13-7-desc"><title id="memory13-7-title">OpenClaw生成与保存分工</title><desc id="memory13-7-desc">日记先保留经历，后台通过门槛发布精选；当前偏好与整理报告用途不同。</desc><defs><marker id="memory13-7-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">OpenClaw Memory：现场日记与长期精选分开</text><g><rect x="25" y="100" width="280" height="140" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="165.0" y="160.5" font-size="19" fill="#34475b" text-anchor="middle">现场观察与经历</text><text x="165.0" y="196.5" font-size="17" fill="#5c6d80" text-anchor="middle">主模型工作中或压缩前记录</text></g><g><rect x="340" y="100" width="280" height="140" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="480.0" y="160.5" font-size="19" fill="#34475b" text-anchor="middle">按日日记</text><text x="480.0" y="196.5" font-size="17" fill="#5c6d80" text-anchor="middle">memory/日期.md</text></g><g><rect x="655" y="100" width="280" height="140" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="160.5" font-size="19" fill="#34475b" text-anchor="middle">后台整理判断</text><text x="795.0" y="196.5" font-size="17" fill="#5c6d80" text-anchor="middle">LLM参与；程序检查来源门槛</text></g><path d="M305,170.0 L335,170.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-7-arrow)"/><path d="M620,170.0 L650,170.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-7-arrow)"/><g><rect x="655" y="365" width="280" height="145" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="428.0" font-size="19" fill="#34475b" text-anchor="middle">MEMORY.md精选正文</text><text x="795.0" y="464.0" font-size="17" fill="#5c6d80" text-anchor="middle">通过检查后发布；索引另更新</text></g><path d="M795,240 L795,360" fill="none" stroke="#548775" stroke-width="2" marker-end="url(#memory13-7-arrow)"/><g><rect x="25" y="365" width="565" height="145" rx="12" fill="#fff5e5" stroke="#b59a67" stroke-width="1.5"/><text x="307.5" y="428.0" font-size="19" fill="#34475b" text-anchor="middle">人或合格明确请求可维护偏好与精选</text><text x="307.5" y="464.0" font-size="17" fill="#5c6d80" text-anchor="middle">USER.md保留现行偏好；不是每问必后台重写</text></g><path d="M590,438 L650,438" fill="none" stroke="#b59a67" stroke-width="2" marker-end="url(#memory13-7-arrow)" stroke-dasharray="6 5"/><g><rect x="25" y="620" width="910" height="120" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="480.0" y="670.5" font-size="19" fill="#34475b" text-anchor="middle">整理过程另留DREAMS日记和可选报告</text><text x="480.0" y="706.5" font-size="17" fill="#5c6d80" text-anchor="middle">模型与程序生成供审阅，不当作新的事实再次提升</text></g><text x="25" y="815" font-size="17" fill="#5c6d80" text-anchor="start">这些文件属于当前Agent工作区，可以涉及多个项目。候选和改写前版本另存机器状态；未经采纳不算正式精选。</text></g></svg>