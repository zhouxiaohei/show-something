<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 950" role="img" aria-labelledby="memory13-1-title memory13-1-desc"><title id="memory13-1-title">四类记忆如何形成与保存</title><desc id="memory13-1-desc">分别展示记录、组织、人工维护及模型生成，重点是原料、生成者与存放。</desc><defs><marker id="memory13-1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">四类材料：原料 → 生成与处理 → 产物和保存</text><g><rect x="25" y="90" width="280" height="140" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="165.0" y="150.5" font-size="19" fill="#34475b" text-anchor="middle">会话记录</text><text x="165.0" y="186.5" font-size="17" fill="#5c6d80" text-anchor="middle">消息、回复、工具事件</text></g><g><rect x="340" y="90" width="280" height="140" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="480.0" y="150.5" font-size="19" fill="#34475b" text-anchor="middle">程序记录</text><text x="480.0" y="186.5" font-size="17" fill="#5c6d80" text-anchor="middle">无需再调记忆LLM</text></g><g><rect x="655" y="90" width="280" height="140" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="150.5" font-size="19" fill="#34475b" text-anchor="middle">运行档案</text><text x="795.0" y="186.5" font-size="17" fill="#5c6d80" text-anchor="middle">JSONL / 数据库</text></g><path d="M305,160.0 L335,160.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-1-arrow)"/><path d="M620,160.0 L650,160.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-1-arrow)"/><g><rect x="25" y="270" width="280" height="140" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="165.0" y="330.5" font-size="19" fill="#34475b" text-anchor="middle">当前上下文</text><text x="165.0" y="366.5" font-size="17" fill="#5c6d80" text-anchor="middle">选入历史、指令、已读记忆</text></g><g><rect x="340" y="270" width="280" height="140" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="480.0" y="330.5" font-size="19" fill="#34475b" text-anchor="middle">程序组织；必要时压缩</text><text x="480.0" y="366.5" font-size="17" fill="#5c6d80" text-anchor="middle">摘要可用模型生成</text></g><g><rect x="655" y="270" width="280" height="140" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="330.5" font-size="19" fill="#34475b" text-anchor="middle">当前工作材料</text><text x="795.0" y="366.5" font-size="17" fill="#5c6d80" text-anchor="middle">运行对象；部分恢复材料另存</text></g><path d="M305,340.0 L335,340.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-1-arrow)"/><path d="M620,340.0 L650,340.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-1-arrow)"/><g><rect x="25" y="450" width="280" height="140" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="165.0" y="510.5" font-size="19" fill="#34475b" text-anchor="middle">持久指令</text><text x="165.0" y="546.5" font-size="17" fill="#5c6d80" text-anchor="middle">个人默认、项目与目录约定</text></g><g><rect x="340" y="450" width="280" height="140" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="480.0" y="510.5" font-size="19" fill="#34475b" text-anchor="middle">人 / 应用维护</text><text x="480.0" y="546.5" font-size="17" fill="#5c6d80" text-anchor="middle">可委托模型起草或编辑</text></g><g><rect x="655" y="450" width="280" height="140" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="510.5" font-size="19" fill="#34475b" text-anchor="middle">规则原文</text><text x="795.0" y="546.5" font-size="17" fill="#5c6d80" text-anchor="middle">文件 / 代码 / 配置</text></g><path d="M305,520.0 L335,520.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-1-arrow)"/><path d="M620,520.0 L650,520.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-1-arrow)"/><g><rect x="25" y="630" width="280" height="140" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="165.0" y="690.5" font-size="19" fill="#34475b" text-anchor="middle">Memory</text><text x="165.0" y="726.5" font-size="17" fill="#5c6d80" text-anchor="middle">反馈、事实、经历与方法</text></g><g><rect x="340" y="630" width="280" height="140" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="480.0" y="690.5" font-size="19" fill="#34475b" text-anchor="middle">人 / 模型维护；程序导入</text><text x="480.0" y="726.5" font-size="17" fill="#5c6d80" text-anchor="middle">模型可独立提炼；程序校验同步</text></g><g><rect x="655" y="630" width="280" height="140" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="679.0" font-size="19" fill="#34475b" text-anchor="middle">可复用内容</text><text x="795.0" y="715.0" font-size="17" fill="#5c6d80" text-anchor="middle">原文 / 主题 / 条目 / 摘要 /</text><text x="795.0" y="738.0" font-size="17" fill="#5c6d80" text-anchor="middle"> 卡片</text></g><path d="M305,700.0 L335,700.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-1-arrow)"/><path d="M620,700.0 L650,700.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-1-arrow)"/><text x="25" y="855" font-size="17" fill="#5c6d80" text-anchor="start">箭头表示原料被加工并保存。当前上下文不是另一份必有Markdown库；源材料和提炼产物也不要求物理存为四个数</text><text x="25" y="880" font-size="17" fill="#5c6d80" text-anchor="start">据库。</text></g></svg>