<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 935" role="img" aria-labelledby="memory13-8-title memory13-8-desc"><title id="memory13-8-title">Hermes的事实与方法产物</title><desc id="memory13-8-desc">主模型与条件review都可维护；工具保存与LLM提炼分开。</desc><defs><marker id="memory13-8-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">Hermes：事实写短条目，方法经验另存</text><g><rect x="25" y="100" width="280" height="140" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="165.0" y="160.5" font-size="19" fill="#34475b" text-anchor="middle">当前交流 / 用户纠正</text><text x="165.0" y="196.5" font-size="17" fill="#5c6d80" text-anchor="middle">主模型判断并选择目的地</text></g><g><rect x="25" y="335" width="280" height="140" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="165.0" y="395.5" font-size="19" fill="#34475b" text-anchor="middle">条件后台复盘</text><text x="165.0" y="431.5" font-size="17" fill="#5c6d80" text-anchor="middle">额外LLM看历史副本或摘要</text></g><g><rect x="340" y="215" width="280" height="150" rx="12" fill="#eef4fc" stroke="#6b87ac" stroke-width="1.5"/><text x="480.0" y="269.0" font-size="19" fill="#34475b" text-anchor="middle">记忆 / 方法维护工具</text><text x="480.0" y="305.0" font-size="17" fill="#5c6d80" text-anchor="middle">程序校验、加锁、重读合并、原</text><text x="480.0" y="328.0" font-size="17" fill="#5c6d80" text-anchor="middle">子保存</text></g><path d="M305,170 L325,170 L325,265 L335,265" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-8-arrow)"/><path d="M305,405 L325,405 L325,315 L335,315" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-8-arrow)"/><g><rect x="655" y="100" width="280" height="160" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="159.0" font-size="19" fill="#34475b" text-anchor="middle">memories/两份短文本</text><text x="795.0" y="195.0" font-size="17" fill="#5c6d80" text-anchor="middle">MEMORY.md / USER.md；条目可</text><text x="795.0" y="218.0" font-size="17" fill="#5c6d80" text-anchor="middle">增改删</text></g><g><rect x="655" y="390" width="280" height="160" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="449.0" font-size="19" fill="#34475b" text-anchor="middle">skills/.../SKILL.md</text><text x="795.0" y="485.0" font-size="17" fill="#5c6d80" text-anchor="middle">较长任务方法与相关纠正优先放</text><text x="795.0" y="508.0" font-size="17" fill="#5c6d80" text-anchor="middle">这里</text></g><path d="M620,265 L635,265 L635,180 L650,180" fill="none" stroke="#548775" stroke-width="2" marker-end="url(#memory13-8-arrow)"/><path d="M620,315 L635,315 L635,470 L650,470" fill="none" stroke="#548775" stroke-width="2" marker-end="url(#memory13-8-arrow)"/><g><rect x="25" y="650" width="910" height="125" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="480.0" y="703.0" font-size="19" fill="#34475b" text-anchor="middle">两份短文本与技能库属于当前配置身份，多项目共用</text><text x="480.0" y="739.0" font-size="17" fill="#5c6d80" text-anchor="middle">文件已更新不等于提示快照已刷新；条目和方法仍须标适用范围</text></g><text x="25" y="840" font-size="17" fill="#5c6d80" text-anchor="start">默认工具写入预算不等于磁盘绝对上限；手改超量文件加载会警告。方法学习属于此产品所称程序性记忆，不泛指所</text><text x="25" y="865" font-size="17" fill="#5c6d80" text-anchor="start">有Skills。</text></g></svg>