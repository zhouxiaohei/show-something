<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1000" role="img" aria-labelledby="memory13-3-title memory13-3-desc"><title id="memory13-3-title">索引与向量如何加工保存</title><desc id="memory13-3-desc">向量编码与生成式提炼分开；实际语料范围逐产品标明。</desc><defs><marker id="memory13-3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">索引生成：先有内容，再建立查找表示</text><g><rect x="25" y="100" width="280" height="140" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="165.0" y="160.5" font-size="19" fill="#34475b" text-anchor="middle">原文 / 已有笔记</text><text x="165.0" y="196.5" font-size="17" fill="#5c6d80" text-anchor="middle">会话、主题、daily等启用语料</text></g><g><rect x="340" y="100" width="280" height="140" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="480.0" y="160.5" font-size="19" fill="#34475b" text-anchor="middle">程序切片并标来源</text><text x="480.0" y="196.5" font-size="17" fill="#5c6d80" text-anchor="middle">路径、范围、片段及版本</text></g><g><rect x="655" y="100" width="280" height="140" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="160.5" font-size="19" fill="#34475b" text-anchor="middle">词项 / 向量编码</text><text x="795.0" y="196.5" font-size="17" fill="#5c6d80" text-anchor="middle">程序建关键词；可选编码模型</text></g><path d="M305,170.0 L335,170.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-3-arrow)"/><path d="M620,170.0 L650,170.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-3-arrow)"/><g><rect x="655" y="340" width="280" height="140" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="400.5" font-size="19" fill="#34475b" text-anchor="middle">派生检索库</text><text x="795.0" y="436.5" font-size="17" fill="#5c6d80" text-anchor="middle">可兼存正文片段、来源与向量</text></g><path d="M795,240 L795,335" fill="none" stroke="#548775" stroke-width="2" marker-end="url(#memory13-3-arrow)"/><g><rect x="25" y="340" width="550" height="140" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="300.0" y="400.5" font-size="19" fill="#34475b" text-anchor="middle">另一种原料路线</text><text x="300.0" y="436.5" font-size="17" fill="#5c6d80" text-anchor="middle">交流先经生成式LLM提炼成笔记，再对笔记建索引</text></g><path d="M300,340 L300,295 L480,295 L480,245" fill="none" stroke="#8c79b5" stroke-width="2" marker-end="url(#memory13-3-arrow)" stroke-dasharray="6 5"/><g><rect x="25" y="590" width="910" height="110" rx="12" fill="#fff5e5" stroke="#b59a67" stroke-width="1.5"/><text x="480.0" y="635.5" font-size="19" fill="#34475b" text-anchor="middle">更新由写入、监听、启动补建、手动或调度触发</text><text x="480.0" y="671.5" font-size="17" fill="#5c6d80" text-anchor="middle">取决于实现，可同步或后台；不是都等模型空闲后自动整理</text></g><g><rect x="25" y="760" width="910" height="95" rx="12" fill="#eef4fc" stroke="#6b87ac" stroke-width="1.5"/><text x="480.0" y="798.0" font-size="19" fill="#34475b" text-anchor="middle">简单使用：查询索引 → 返回片段/位置 → 需要时读取正文</text><text x="480.0" y="834.0" font-size="17" fill="#5c6d80" text-anchor="middle">主模型通常读文字，不直接读取向量数字</text></g><text x="25" y="915" font-size="17" fill="#5c6d80" text-anchor="start">绿色是派生检索数据；紫色是可选内容提炼。正文改变后索引可能滞后；记忆少时也可只用目录。</text></g></svg>