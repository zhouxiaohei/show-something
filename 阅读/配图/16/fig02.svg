<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" role="img" aria-labelledby="memory13-2-title memory13-2-desc"><title id="memory13-2-title">直接写与分阶段生成的区别</title><desc id="memory13-2-desc">分阶段是可选实现，不要求每问必提炼、每家必有候选层。</desc><defs><marker id="memory13-2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">Memory生成：直接维护，或先提炼再整合</text><text x="25" y="90" font-size="18" fill="#34475b" text-anchor="start">路径一：直接维护或纳入可复用内容</text><g><rect x="25" y="125" width="280" height="140" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="165.0" y="185.5" font-size="19" fill="#34475b" text-anchor="middle">原文 / 反馈 / 经历</text><text x="165.0" y="221.5" font-size="17" fill="#5c6d80" text-anchor="middle">人写、模型判断或程序导入</text></g><g><rect x="340" y="125" width="280" height="140" rx="12" fill="#eef4fc" stroke="#6b87ac" stroke-width="1.5"/><text x="480.0" y="185.5" font-size="19" fill="#34475b" text-anchor="middle">文件 / 条目写入</text><text x="480.0" y="221.5" font-size="17" fill="#5c6d80" text-anchor="middle">存储程序执行；不必LLM提炼</text></g><g><rect x="655" y="125" width="280" height="140" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="185.5" font-size="19" fill="#34475b" text-anchor="middle">记忆正文与来源</text><text x="795.0" y="221.5" font-size="17" fill="#5c6d80" text-anchor="middle">原文 / 笔记；可新增改删</text></g><path d="M305,195.0 L335,195.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-2-arrow)"/><path d="M620,195.0 L650,195.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-2-arrow)"/><text x="25" y="335" font-size="18" fill="#34475b" text-anchor="start">路径二：先生成局部材料，再整理为长期内容</text><g><rect x="25" y="375" width="280" height="140" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="165.0" y="435.5" font-size="19" fill="#34475b" text-anchor="middle">合格交流 / 旧任务</text><text x="165.0" y="471.5" font-size="17" fill="#5c6d80" text-anchor="middle">程序按范围与资格选材</text></g><g><rect x="340" y="375" width="280" height="140" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="480.0" y="435.5" font-size="19" fill="#34475b" text-anchor="middle">额外记忆Agent</text><text x="480.0" y="471.5" font-size="17" fill="#5c6d80" text-anchor="middle">LLM提炼摘要 / daily / 候选</text></g><g><rect x="655" y="375" width="280" height="140" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="435.5" font-size="19" fill="#34475b" text-anchor="middle">整合与采纳</text><text x="795.0" y="471.5" font-size="17" fill="#5c6d80" text-anchor="middle">LLM判断；程序可设门槛</text></g><path d="M305,445.0 L335,445.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-2-arrow)"/><path d="M620,445.0 L650,445.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-2-arrow)"/><g><rect x="655" y="585" width="280" height="130" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="640.5" font-size="19" fill="#34475b" text-anchor="middle">正式产物</text><text x="795.0" y="676.5" font-size="17" fill="#5c6d80" text-anchor="middle">综合摘要 / 精选 / digest</text></g><path d="M795,515 L795,580" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-2-arrow)" stroke-dasharray="6 5"/><g><rect x="25" y="585" width="565" height="130" rx="12" fill="#fff5e5" stroke="#b59a67" stroke-width="1.5"/><text x="307.5" y="640.5" font-size="19" fill="#34475b" text-anchor="middle">具体触发由产品决定</text><text x="307.5" y="676.5" font-size="17" fill="#5c6d80" text-anchor="middle">答复收尾、旧任务空闲、定时或手动；有的等待、有的不等</text></g><text x="25" y="790" font-size="17" fill="#5c6d80" text-anchor="start">实线表示加工，虚线表示按实现选择的后续整理。额外Agent可使用同一种模型；程序同步、加锁、预算检查不是另</text><text x="25" y="815" font-size="17" fill="#5c6d80" text-anchor="start">一次LLM提炼。</text></g></svg>