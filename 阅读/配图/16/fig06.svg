<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 915" role="img" aria-labelledby="memory13-6-title memory13-6-desc"><title id="memory13-6-title">Codex两路输入与发布</title><desc id="memory13-6-desc">旧轨迹提炼、明确便笺、跨任务整合及文件同步分别说明。</desc><defs><marker id="memory13-6-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">Codex V2：任务摘要与便笺是两路原料</text><g><rect x="25" y="100" width="280" height="140" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="165.0" y="160.5" font-size="19" fill="#34475b" text-anchor="middle">合格旧任务记录</text><text x="165.0" y="196.5" font-size="17" fill="#5c6d80" text-anchor="middle">程序筛资格、空闲、预算</text></g><g><rect x="340" y="100" width="280" height="140" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="480.0" y="160.5" font-size="19" fill="#34475b" text-anchor="middle">提炼模型</text><text x="480.0" y="196.5" font-size="17" fill="#5c6d80" text-anchor="middle">产生单次任务内容</text></g><g><rect x="655" y="100" width="280" height="140" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="160.5" font-size="19" fill="#34475b" text-anchor="middle">rollout_summaries/</text><text x="795.0" y="196.5" font-size="17" fill="#5c6d80" text-anchor="middle">程序同步所选任务摘要</text></g><path d="M305,170.0 L335,170.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-6-arrow)"/><path d="M620,170.0 L650,170.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-6-arrow)"/><g><rect x="25" y="335" width="280" height="140" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="165.0" y="395.5" font-size="19" fill="#34475b" text-anchor="middle">明确维护请求</text><text x="165.0" y="431.5" font-size="17" fill="#5c6d80" text-anchor="middle">记住 / 更正 / 忘记</text></g><g><rect x="340" y="335" width="280" height="140" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="480.0" y="395.5" font-size="19" fill="#34475b" text-anchor="middle">主模型写便笺</text><text x="480.0" y="431.5" font-size="17" fill="#5c6d80" text-anchor="middle">新建一次请求记录</text></g><g><rect x="655" y="335" width="280" height="140" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="395.5" font-size="19" fill="#34475b" text-anchor="middle">ad_hoc/notes/</text><text x="795.0" y="431.5" font-size="17" fill="#5c6d80" text-anchor="middle">不直接改综合摘要</text></g><path d="M305,405.0 L335,405.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-6-arrow)"/><path d="M620,405.0 L650,405.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-6-arrow)"/><g><rect x="340" y="600" width="280" height="140" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="480.0" y="660.5" font-size="19" fill="#34475b" text-anchor="middle">跨任务整合模型</text><text x="480.0" y="696.5" font-size="17" fill="#5c6d80" text-anchor="middle">任务摘要＋便笺＋已有记忆</text></g><path d="M795,240 L940,240 L940,555 L540,555 L540,595" fill="none" stroke="#548775" stroke-width="2" marker-end="url(#memory13-6-arrow)"/><path d="M795,475 L795,535 L420,535 L420,595" fill="none" stroke="#548775" stroke-width="2" marker-end="url(#memory13-6-arrow)"/><g><rect x="655" y="600" width="280" height="140" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="660.5" font-size="19" fill="#34475b" text-anchor="middle">memory_summary.md</text><text x="795.0" y="696.5" font-size="17" fill="#5c6d80" text-anchor="middle">发布综合信息与证据指针</text></g><path d="M620,670 L650,670" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-6-arrow)"/><text x="25" y="815" font-size="17" fill="#5c6d80" text-anchor="start">固定V2且已启用；同一Codex配置空间可含多项目，内容仍保留范围。同步、去密和淘汰是程序工作；两路会合后整</text><text x="25" y="840" font-size="17" fill="#5c6d80" text-anchor="start">合。</text></g></svg>