<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 930" role="img" aria-labelledby="memory13-13-title memory13-13-desc"><title id="memory13-13-title">记忆维护与反馈闭环</title><desc id="memory13-13-desc">服务化仍保留四类分工，正式内容和派生索引应分别更新。</desc><defs><marker id="memory13-13-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="21" fill="#34475b" text-anchor="start">维护闭环：原料、正式版本、索引和反馈分别落地</text><g><rect x="25" y="100" width="280" height="140" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="165.0" y="160.5" font-size="19" fill="#34475b" text-anchor="middle">交流 / 任务证据</text><text x="165.0" y="196.5" font-size="17" fill="#5c6d80" text-anchor="middle">保留来源与适用范围</text></g><g><rect x="340" y="100" width="280" height="140" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="480.0" y="160.5" font-size="19" fill="#34475b" text-anchor="middle">提炼 / 整理</text><text x="480.0" y="196.5" font-size="17" fill="#5c6d80" text-anchor="middle">可有候选、校验和采纳</text></g><g><rect x="655" y="100" width="280" height="140" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="160.5" font-size="19" fill="#34475b" text-anchor="middle">正式记忆版本</text><text x="795.0" y="196.5" font-size="17" fill="#5c6d80" text-anchor="middle">正文或条目，可更正/撤销</text></g><path d="M305,170.0 L335,170.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-13-arrow)"/><path d="M620,170.0 L650,170.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-13-arrow)"/><g><rect x="655" y="350" width="280" height="140" rx="12" fill="#eef4fc" stroke="#6b87ac" stroke-width="1.5"/><text x="795.0" y="410.5" font-size="19" fill="#34475b" text-anchor="middle">派生索引 / 关联</text><text x="795.0" y="446.5" font-size="17" fill="#5c6d80" text-anchor="middle">随内容更新，有自己的状态</text></g><path d="M795,240 L795,345" fill="none" stroke="#548775" stroke-width="2" marker-end="url(#memory13-13-arrow)"/><g><rect x="340" y="350" width="280" height="140" rx="12" fill="#eef4fc" stroke="#6b87ac" stroke-width="1.5"/><text x="480.0" y="410.5" font-size="19" fill="#34475b" text-anchor="middle">后续任务使用</text><text x="480.0" y="446.5" font-size="17" fill="#5c6d80" text-anchor="middle">取回实际文字，检查是否适用</text></g><path d="M655,420 L625,420" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-13-arrow)"/><g><rect x="25" y="350" width="280" height="140" rx="12" fill="#fff5e5" stroke="#b59a67" stroke-width="1.5"/><text x="165.0" y="399.0" font-size="19" fill="#34475b" text-anchor="middle">实际结果与纠正</text><text x="165.0" y="435.0" font-size="17" fill="#5c6d80" text-anchor="middle">有效 / 失效 / 范围不对 / 错</text><text x="165.0" y="458.0" font-size="17" fill="#5c6d80" text-anchor="middle">误</text></g><path d="M340,420 L310,420" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-13-arrow)"/><path d="M165,350 L165,285 L480,285 L480,245" fill="none" stroke="#b59a67" stroke-width="2" marker-end="url(#memory13-13-arrow)" stroke-dasharray="6 5"/><g><rect x="25" y="630" width="910" height="120" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="480.0" y="680.5" font-size="19" fill="#34475b" text-anchor="middle">更正需要回到正文与派生索引</text><text x="480.0" y="716.5" font-size="17" fill="#5c6d80" text-anchor="middle">后续任务验证是否生效；共享范围和内容性质分别判断</text></g><text x="25" y="820" font-size="17" fill="#5c6d80" text-anchor="start">蓝色是简单取用；回线是更正维护。只有结果真正修订存储与派生物、再由后续任务验证，才能讨论改进；没有训练</text><text x="25" y="845" font-size="17" fill="#5c6d80" text-anchor="start">步骤不改变模型权重。</text></g></svg>