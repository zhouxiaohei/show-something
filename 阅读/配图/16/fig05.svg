<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 880" role="img" aria-labelledby="memory13-5-title memory13-5-desc"><title id="memory13-5-title">Claude原料与主题产物</title><desc id="memory13-5-desc">主题正文和入口属于同一仓库的auto memory；入口与正文按不同方式读取。</desc><defs><marker id="memory13-5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">Claude自动记忆：主题保存正文，入口提示去哪里读</text><g><rect x="25" y="100" width="280" height="140" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="165.0" y="160.5" font-size="19" fill="#34475b" text-anchor="middle">值得复用的信息</text><text x="165.0" y="196.5" font-size="17" fill="#5c6d80" text-anchor="middle">Claude选择；人也可维护</text></g><g><rect x="340" y="100" width="280" height="140" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="480.0" y="160.5" font-size="19" fill="#34475b" text-anchor="middle">文件工具写主题</text><text x="480.0" y="196.5" font-size="17" fill="#5c6d80" text-anchor="middle">type标user/feedback等</text></g><g><rect x="655" y="100" width="280" height="140" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="160.5" font-size="19" fill="#34475b" text-anchor="middle">memory/主题.md</text><text x="795.0" y="196.5" font-size="17" fill="#5c6d80" text-anchor="middle">每类可多篇，不要求四目录</text></g><path d="M305,170.0 L335,170.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-5-arrow)"/><path d="M620,170.0 L650,170.0" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#memory13-5-arrow)"/><g><rect x="655" y="365" width="280" height="145" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="795.0" y="428.0" font-size="19" fill="#34475b" text-anchor="middle">memory/MEMORY.md</text><text x="795.0" y="464.0" font-size="17" fill="#5c6d80" text-anchor="middle">维护短入口；不是全部主题正文</text></g><path d="M795,240 L795,360" fill="none" stroke="#548775" stroke-width="2" marker-end="url(#memory13-5-arrow)"/><g><rect x="25" y="365" width="565" height="145" rx="12" fill="#fff5e5" stroke="#b59a67" stroke-width="1.5"/><text x="307.5" y="428.0" font-size="19" fill="#34475b" text-anchor="middle">程序处理元信息与入口预算</text><text x="307.5" y="464.0" font-size="17" fill="#5c6d80" text-anchor="middle">记忆写入可补modified；入口检查200行/25KB</text></g><g><rect x="25" y="620" width="910" height="100" rx="12" fill="#eef4fc" stroke="#6b87ac" stroke-width="1.5"/><text x="480.0" y="660.5" font-size="19" fill="#34475b" text-anchor="middle">新会话先提供短入口；主题正文需要时再用文件工具读</text><text x="480.0" y="696.5" font-size="17" fill="#5c6d80" text-anchor="middle">默认同仓库子目录和worktree共用；user标签不等于全局范围</text></g><text x="25" y="790" font-size="17" fill="#5c6d80" text-anchor="start">独立后台提炼的全版本触发仍待完整官方契约，不能画成每问必跑；入口、主题和手动指令也不是同一种文件。</text></g></svg>