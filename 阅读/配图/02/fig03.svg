<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ev02-3-title ev02-3-desc"><title id="ev02-3-title">四种正确替身与对应的证真机制</title><desc id="ev02-3-desc">四宫格：状态字段替代真实成功、原始产出替代有效产出、名称和先验替代真实能力、做完了替代可验证完成，每格带案例画面和对应的证真机制。</desc><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">四种"正确替身"：每种都对应一道证真机制</text><g><rect x="25" y="60" width="440" height="210" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="88" font-size="19" fill="#34475b">① 状态字段替代真实成功</text><text x="45" y="114" font-size="16" fill="#5c6d80">外层 success 只表示"流程走完了"</text><text x="45" y="140" font-size="16" fill="#5c6d80">异常被捕获、HTTP 200 ≠ 业务动作成功</text><text x="45" y="166" font-size="16" fill="#5c6d80">案例：查询失败被层层吞掉，仍出"暂无异常"卡</text><text x="45" y="198" font-size="17" fill="#34475b">→ 证真机制：质量门禁（结构与证据层）</text></g><g><rect x="495" y="60" width="440" height="210" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="515" y="88" font-size="19" fill="#34475b">② 原始产出替代有效产出</text><text x="515" y="114" font-size="16" fill="#5c6d80">"生成了 14 个"是吞吐量，"5 个可用"才是质量</text><text x="515" y="140" font-size="16" fill="#5c6d80">只统计产出数 → 激励制造形式完整的垃圾</text><text x="515" y="166" font-size="16" fill="#5c6d80">raw / valid / grounded / useful 要分开数</text><text x="515" y="198" font-size="17" fill="#34475b">→ 证真机制：产出分级指标 + 门禁</text></g><g><rect x="25" y="300" width="440" height="210" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="328" font-size="19" fill="#34475b">③ 名称和先验替代真实能力</text><text x="45" y="354" font-size="16" fill="#5c6d80">hook 的名字听起来"应该能拿到整轮结果"</text><text x="45" y="380" font-size="16" fill="#5c6d80">能力是经验问题，不是语言推理问题</text><text x="45" y="406" font-size="16" fill="#5c6d80">答案在派发代码、签名、探针、运行轨迹里</text><text x="45" y="438" font-size="17" fill="#34475b">→ 证真机制：探针先行</text></g><g><rect x="495" y="300" width="440" height="210" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="515" y="328" font-size="19" fill="#34475b">④ "做完了"替代可验证完成</text><text x="515" y="354" font-size="16" fill="#5c6d80">"修改完成"可能只是"方案听起来合理"</text><text x="515" y="380" font-size="16" fill="#5c6d80">"生成高质量总结卡"人人能懂，却无法验收</text><text x="515" y="406" font-size="16" fill="#5c6d80">"完成"和"理解"都需要可观察的下落</text><text x="515" y="438" font-size="17" fill="#34475b">→ 证真机制：可检验完成条件 + 独立验证</text></g><text x="480" y="545" font-size="17" fill="#5c6d80" text-anchor="middle">识别替身，本质是识别系统里哪些信号在冒充证据：状态码、数量、命名、语气，每一种都是外观</text></g></svg>
