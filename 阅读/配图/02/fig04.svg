<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ev02-4-title ev02-4-desc"><title id="ev02-4-title">质量门禁：五层串联，误杀误放两率并重</title><desc id="ev02-4-desc">左侧是门禁的三个触发条件与五层检查：结构、范围、证据、语义、业务，各配适合的执行方式。右侧是误杀与误放两个度量口径、模型判别的分层限权方案，以及门禁适用范围的提醒。</desc><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">质量门禁：五层串联，误杀误放两率并重</text><g><rect x="25" y="60" width="440" height="100" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="88" font-size="19" fill="#34475b">何时设门禁（三条同时满足）</text><text x="45" y="114" font-size="16" fill="#5c6d80">结果由系统生成或推导；会展示给用户或驱动下游</text><text x="45" y="138" font-size="16" fill="#5c6d80">输入本身不能天然保证结果有效</text></g><g><rect x="25" y="180" width="440" height="50" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="211" font-size="17" fill="#34475b">结构 · schema / 必填字段 / 类型</text><text x="445" y="211" font-size="17" fill="#5c6d80" text-anchor="end">代码</text></g><g><rect x="25" y="236" width="440" height="50" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="267" font-size="17" fill="#34475b">范围 · 长度 / 枚举 / 时间窗</text><text x="445" y="267" font-size="17" fill="#5c6d80" text-anchor="end">代码</text></g><g><rect x="25" y="292" width="440" height="50" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="323" font-size="17" fill="#34475b">证据 · 结论对应来源 / 关键数据存在</text><text x="445" y="323" font-size="17" fill="#5c6d80" text-anchor="end">代码优先，必要时模型判别</text></g><g><rect x="25" y="348" width="440" height="50" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="379" font-size="17" fill="#34475b">语义 · 是否误导 / 是否过度断言</text><text x="445" y="379" font-size="17" fill="#5c6d80" text-anchor="end">模型判别或人工抽检</text></g><g><rect x="25" y="404" width="440" height="50" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="435" font-size="17" fill="#34475b">业务 · 是否值得展示 / 失败是否降级</text><text x="445" y="435" font-size="17" fill="#5c6d80" text-anchor="end">产品规则与代码</text></g><text x="25" y="484" font-size="16" fill="#5c6d80">五层串联：低层通过 ≠ 整链合格——schema 通过只证明"可解析"，不证明"事实正确"</text><g><rect x="495" y="60" width="440" height="160" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="515" y="88" font-size="19" fill="#34475b">误杀误放：两个口径必须一起看 [推测]</text><text x="515" y="114" font-size="16" fill="#5c6d80">误杀 → 抽检复核率：抽样被拦结果交人工复核，</text><text x="515" y="136" font-size="16" fill="#5c6d80">统计其中"其实该放行"的比例</text><text x="515" y="160" font-size="16" fill="#5c6d80">误放 → 线上缺陷回流率：放过门禁的结果，</text><text x="515" y="182" font-size="16" fill="#5c6d80">在下游或生产环节被发现问题的比例</text><text x="515" y="206" font-size="16" fill="#5c6d80">只盯一头：要么拦光产出，要么形同虚设</text></g><g><rect x="495" y="240" width="440" height="150" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="515" y="268" font-size="19" fill="#34475b">用模型判别模型产出：分层限权</text><text x="515" y="294" font-size="16" fill="#5c6d80">低风险层（语义）：模型初筛，缩小人工复核范围</text><text x="515" y="318" font-size="16" fill="#5c6d80">高风险判断：真实性、业务价值、最终放行</text><text x="515" y="342" font-size="16" fill="#5c6d80">由确定性代码规则 + 固定比例人工抽检兜底</text><text x="515" y="366" font-size="16" fill="#5c6d80">判别器定期用人工标注样本校准</text></g><g><rect x="495" y="410" width="440" height="110" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="515" y="438" font-size="19" fill="#34475b">门禁不是 LLM 专属保险</text><text x="515" y="464" font-size="16" fill="#5c6d80">规则系统、模板系统、统计系统，</text><text x="515" y="488" font-size="16" fill="#5c6d80">同样会在错误输入上稳定地产出错误结果</text></g></g></svg>
