<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ev02-1-title ev02-1-desc"><title id="ev02-1-title">剪刀差：产出成本趋零，验证成本没有同比例下降</title><desc id="ev02-1-desc">坐标图中两条成本曲线：产出一条结果的成本随时间趋近于零，验证真实性的成本基本持平，两条曲线之间的剪刀差张开；右侧对比过去与现在，底部是工程重心的移动。</desc><defs><marker id="ev02-1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">剪刀差：产出边际成本趋零，验证成本没有同比例下降</text><path d="M60,80 L60,410 L600,410" fill="none" stroke="#98a4b0" stroke-width="1.5"/><text x="60" y="72" font-size="16" fill="#5c6d80" text-anchor="middle">成本</text><text x="140" y="434" font-size="16" fill="#5c6d80" text-anchor="middle">过去</text><text x="470" y="434" font-size="16" fill="#5c6d80" text-anchor="middle">现在</text><text x="600" y="434" font-size="16" fill="#5c6d80" text-anchor="end">时间</text><path d="M60,150 C220,160 340,290 600,390" fill="none" stroke="#739882" stroke-width="3"/><text x="95" y="135" font-size="16" fill="#34475b">产出一条结果的成本 → 0</text><path d="M60,190 C250,200 450,205 600,215" fill="none" stroke="#a08bb4" stroke-width="3"/><text x="330" y="192" font-size="16" fill="#34475b">验证真实性的成本（没有同比例下降）</text><path d="M470,213 L470,383" fill="none" stroke="#6d8296" stroke-width="2" stroke-dasharray="5 4"/><text x="490" y="300" font-size="19" fill="#34475b">剪刀差</text><g><rect x="655" y="60" width="280" height="112" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="675" y="88" font-size="19" fill="#34475b">过去</text><text x="675" y="112" font-size="16" fill="#5c6d80">"做出来"本身是高成本信号</text><text x="675" y="136" font-size="16" fill="#5c6d80">能运行 ≈ 有人投入了数天</text><text x="675" y="158" font-size="16" fill="#5c6d80">产出与正确之间的距离不远</text></g><g><rect x="655" y="190" width="280" height="118" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="675" y="218" font-size="19" fill="#34475b">现在</text><text x="675" y="242" font-size="16" fill="#5c6d80">产出边际成本趋零</text><text x="675" y="266" font-size="16" fill="#5c6d80">"做出来了"不再携带</text><text x="675" y="288" font-size="16" fill="#5c6d80">"大概率做对了"的信息量</text></g><g><rect x="655" y="326" width="280" height="92" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="675" y="354" font-size="19" fill="#34475b">工程重心移动</text><text x="675" y="380" font-size="16" fill="#5c6d80">从"生产结果"</text><text x="675" y="404" font-size="16" fill="#5c6d80">移向"建立证据链"</text></g><g><rect x="25" y="470" width="910" height="60" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="480" y="507" font-size="19" fill="#34475b" text-anchor="middle">最危险的失败：成功地产出了一个错误结果——schema 通过、success: true、页面正常展示</text></g></g></svg>
