<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ev02-5-title ev02-5-desc"><title id="ev02-5-title">证据链：五阶段、四道验证闸的闭环</title><desc id="ev02-5-desc">需求、设计、实现、交付、生产五个阶段，阶段之间有四道验证闸：写成可验收条件和负面用例、探针确认集成点真实能力、测试与门禁、独立验证实际产物；生产阶段的失败样本经虚线回流为下一轮需求的输入。</desc><defs><marker id="ev02-5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">证据链：五阶段、四道闸——闭环，不是流水线</text><g><rect x="25" y="100" width="140" height="90" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="95" y="132" font-size="19" fill="#34475b" text-anchor="middle">需求</text><text x="95" y="160" font-size="15" fill="#5c6d80" text-anchor="middle">同一个"正确"的定义</text></g><g><rect x="220" y="100" width="140" height="90" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="290" y="132" font-size="19" fill="#34475b" text-anchor="middle">设计</text><text x="290" y="160" font-size="15" fill="#5c6d80" text-anchor="middle">依赖的能力真实存在</text></g><g><rect x="415" y="100" width="140" height="90" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="485" y="132" font-size="19" fill="#34475b" text-anchor="middle">实现</text><text x="485" y="160" font-size="15" fill="#5c6d80" text-anchor="middle">确定性约束满足</text></g><g><rect x="610" y="100" width="140" height="90" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="680" y="132" font-size="19" fill="#34475b" text-anchor="middle">交付</text><text x="680" y="160" font-size="15" fill="#5c6d80" text-anchor="middle">结果符合需求</text></g><g><rect x="805" y="100" width="140" height="90" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="875" y="132" font-size="19" fill="#34475b" text-anchor="middle">生产</text><text x="875" y="160" font-size="15" fill="#5c6d80" text-anchor="middle">真实分布下可靠</text></g><path d="M165,145 L216,145" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ev02-5-arrow)"/><path d="M360,145 L411,145" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ev02-5-arrow)"/><path d="M555,145 L606,145" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ev02-5-arrow)"/><path d="M750,145 L801,145" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ev02-5-arrow)"/><path d="M192,200 L192,244" fill="none" stroke="#6d8296" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ev02-5-arrow)"/><path d="M387,200 L387,244" fill="none" stroke="#6d8296" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ev02-5-arrow)"/><path d="M582,200 L582,244" fill="none" stroke="#6d8296" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ev02-5-arrow)"/><path d="M777,200 L777,244" fill="none" stroke="#6d8296" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ev02-5-arrow)"/><g><rect x="118" y="250" width="150" height="100" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="193" y="278" font-size="19" fill="#34475b" text-anchor="middle">闸 1</text><text x="193" y="304" font-size="16" fill="#5c6d80" text-anchor="middle">写成可验收条件</text><text x="193" y="326" font-size="16" fill="#5c6d80" text-anchor="middle">和负面用例</text></g><g><rect x="313" y="250" width="150" height="100" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="388" y="278" font-size="19" fill="#34475b" text-anchor="middle">闸 2</text><text x="388" y="304" font-size="16" fill="#5c6d80" text-anchor="middle">探针确认集成点</text><text x="388" y="326" font-size="16" fill="#5c6d80" text-anchor="middle">真实能力</text></g><g><rect x="508" y="250" width="150" height="100" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="583" y="278" font-size="19" fill="#34475b" text-anchor="middle">闸 3</text><text x="583" y="304" font-size="16" fill="#5c6d80" text-anchor="middle">测试、schema</text><text x="583" y="326" font-size="16" fill="#5c6d80" text-anchor="middle">与业务门禁</text></g><g><rect x="703" y="250" width="150" height="100" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="778" y="278" font-size="19" fill="#34475b" text-anchor="middle">闸 4</text><text x="778" y="304" font-size="16" fill="#5c6d80" text-anchor="middle">独立验证</text><text x="778" y="326" font-size="16" fill="#5c6d80" text-anchor="middle">实际产物</text></g><path d="M875,190 L875,440 L95,440 L95,196" fill="none" stroke="#6d8296" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ev02-5-arrow)"/><text x="480" y="465" font-size="17" fill="#5c6d80" text-anchor="middle">底部回流虚线：trace、抽样评估、失败样本回流——生产阶段的失败样本是下一轮需求的输入</text><g><rect x="25" y="490" width="910" height="50" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="480" y="521" font-size="19" fill="#34475b" text-anchor="middle">判据：如果某一层只能提供一句"应该没问题"，证据链就在那里断了</text></g></g></svg>
