<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ev02-2-title ev02-2-desc"><title id="ev02-2-title">案例：总结卡功能两次推倒重来</title><desc id="ev02-2-desc">第一版挂在工具调用完成的 hook 上，只能看到当前工具结果，整版作废；第二版移到一轮结束，批量产出 14 张卡，筛选后只有 5 张可用，其余包括旧数据写成近期变化、明细描述成趋势、查询失败仍出暂无异常卡、数据不足用流畅语言补结论。底部是两次翻盘的共同根源。</desc><defs><marker id="ev02-2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">案例：一个总结卡功能，两次推倒重来 [复盘证据]</text><g><rect x="25" y="60" width="910" height="130" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="88" font-size="19" fill="#34475b">第一版 · 挂在"工具调用完成后"的 hook 上</text><text x="45" y="114" font-size="17" fill="#5c6d80">位置名字合理、触发稳定，很快"成功出卡"</text><text x="45" y="138" font-size="17" fill="#5c6d80">实际只能看到当前工具结果，看不到整轮最终回答——"电影演到一半写出的影评"</text><text x="45" y="164" font-size="17" fill="#34475b">→ 第一版整体作废</text></g><path d="M480,192 L480,206" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ev02-2-arrow)"/><g><rect x="25" y="210" width="910" height="180" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="238" font-size="19" fill="#34475b">第二版 · 移到一轮结束之后：批量运行产出 14 张卡</text><text x="45" y="264" font-size="17" fill="#5c6d80">按时间范围、数据充分性、证据一致性、展示价值筛选后：只有 5 张可用</text><g><rect x="45" y="284" width="415" height="36" rx="8" fill="#e7ecf1" stroke="#98a4b0" stroke-width="1"/><text x="252" y="308" font-size="16" fill="#5c6d80" text-anchor="middle">把旧数据写成近期变化</text></g><g><rect x="475" y="284" width="440" height="36" rx="8" fill="#e7ecf1" stroke="#98a4b0" stroke-width="1"/><text x="695" y="308" font-size="16" fill="#5c6d80" text-anchor="middle">把一批明细描述成趋势</text></g><g><rect x="45" y="330" width="415" height="36" rx="8" fill="#e7ecf1" stroke="#98a4b0" stroke-width="1"/><text x="252" y="354" font-size="16" fill="#5c6d80" text-anchor="middle">查询失败后仍生成一张"暂无异常"卡</text></g><g><rect x="475" y="330" width="440" height="36" rx="8" fill="#e7ecf1" stroke="#98a4b0" stroke-width="1"/><text x="695" y="354" font-size="16" fill="#5c6d80" text-anchor="middle">数据不足，却用流畅语言补出结论</text></g></g><g><rect x="25" y="410" width="910" height="110" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="440" font-size="19" fill="#34475b">两次翻盘，表面是集成点选错和质量不足，底层是同一个问题</text><text x="45" y="468" font-size="17" fill="#5c6d80">团队在关键节点接受了一个"足够像真的替身"，</text><text x="45" y="492" font-size="17" fill="#5c6d80">没有继续追问真实能力和真实证据</text></g></g></svg>
