<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f3-title f3-desc" viewBox="0 0 1040 350"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="f3-title">订单与库存的模块边界</title><desc id="f3-desc">静态代码依赖图：订单允许依赖库存公开API，禁止直接依赖库存内部实现。模块边界测试分析这些关系。</desc><defs><marker id="f3-teal" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17766b"/></marker><marker id="f3-red" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a84838"/></marker><marker id="f3-grey" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526a75"/></marker></defs><rect x="25" y="110" width="220" height="90" rx="9" fill="#fff" stroke="#bbd0d2" stroke-width="1.5"/><text x="135.0" y="140" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="135.0" dy="0">订单模块</tspan></text><text x="135.0" y="167" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="135.0" dy="0">只依赖库存公开接口</tspan></text><rect x="400" y="110" width="230" height="90" rx="9" fill="#edf7f3" stroke="#bbd0d2" stroke-width="1.5"/><text x="515.0" y="140" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="515.0" dy="0">库存公开 API</tspan></text><text x="515.0" y="167" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="515.0" dy="0">InventoryFacade</tspan></text><rect x="785" y="110" width="230" height="90" rx="9" fill="#fff" stroke="#bbd0d2" stroke-width="1.5"/><text x="900.0" y="140" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="900.0" dy="0">库存内部实现</tspan></text><text x="900.0" y="167" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="900.0" dy="0">inventory.internal</tspan></text><rect x="25" y="255" width="220" height="75" rx="9" fill="#edf4fa" stroke="#bbd0d2" stroke-width="1.5"/><text x="135.0" y="285" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="135.0" dy="0">模块边界测试</tspan></text><text x="135.0" y="312" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="135.0" dy="0">分析代码依赖图</tspan></text><path d="M245 155 H392" fill="none" stroke="#17766b" stroke-width="2" marker-end="url(#f3-teal)"/><text x="322" y="139" text-anchor="middle" fill="#17766b" font-size="14" font-weight="400"><tspan x="322" dy="0">允许依赖</tspan></text><path d="M630 155 H777" fill="none" stroke="#17766b" stroke-width="2" marker-end="url(#f3-teal)"/><text x="706" y="139" text-anchor="middle" fill="#17766b" font-size="14" font-weight="400"><tspan x="706" dy="0">模块内部</tspan></text><path d="M135 110 V43 H900 V102" fill="none" stroke="#a84838" stroke-width="2" marker-end="url(#f3-red)" stroke-dasharray="6 5"/><text x="516" y="28" text-anchor="middle" fill="#a84838" font-size="15" font-weight="400"><tspan x="516" dy="0">禁止订单直接引用库存内部类</tspan></text><path d="M135 255 V208" fill="none" stroke="#526a75" stroke-width="2" marker-end="url(#f3-grey)" stroke-dasharray="6 5"/><text x="270" y="240" text-anchor="middle" fill="#526a75" font-size="13" font-weight="400"><tspan x="270" dy="0">静态检查</tspan></text></svg>