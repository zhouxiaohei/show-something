<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 340" role="img" aria-label="14/Java样板容量验证.svg"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#718b9c"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:18px;font-weight:600;fill:#263f50}.small{font-size:14px;fill:#5a7383}.note{font-size:12px;fill:#6a8392}</style><rect width="100%" height="100%" fill="#f7fafb"/><text class="title" x="35" y="42">一次真实 JAR 冒烟：把容量覆盖为 2，再观察实际响应</text><rect x="45" y="95" width="270" height="110" rx="12" fill="#e5f2ed" stroke="#bdccd7"/><text class="title" x="180.0" y="132" text-anchor="middle">创建第 1 条</text><text class="small" x="180.0" y="159" text-anchor="middle">201 · 成功写入</text><path d="M316 149H360" stroke="#7891a3" stroke-width="1.7" marker-end="url(#arr)"/><rect x="365" y="95" width="270" height="110" rx="12" fill="#e5f2ed" stroke="#bdccd7"/><text class="title" x="500.0" y="132" text-anchor="middle">创建第 2 条</text><text class="small" x="500.0" y="159" text-anchor="middle">201 · 成功写入</text><path d="M636 149H680" stroke="#7891a3" stroke-width="1.7" marker-end="url(#arr)"/><rect x="685" y="95" width="270" height="110" rx="12" fill="#faeee6" stroke="#bdccd7"/><text class="title" x="820.0" y="132" text-anchor="middle">创建第 3 条</text><text class="small" x="820.0" y="159" text-anchor="middle">503 · 拒绝新增</text><text class="small" x="45" y="263">容量准入与写入共用同步边界；满容量后，已有条目的读取仍然可用。</text><text class="note" x="45" y="310">2026-11-13 作者本地复验。验证条目准入，不证明 JVM 总内存上限、无泄漏或生产吞吐量。</text></svg>