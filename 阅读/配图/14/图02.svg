<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f2-title f2-desc" viewBox="0 0 1100 345"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="f2-title">简单与模块化单体的演进</title><desc id="f2-desc">拟议演进：Lite在业务边界需要独立维护时升级为Modular；两个档位都可按需加入数据库等外部能力，服务拆分另作决策。</desc><defs><marker id="f2-teal" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17766b"/></marker><marker id="f2-red" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a84838"/></marker><marker id="f2-grey" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526a75"/></marker></defs><rect x="20" y="115" width="240" height="100" rx="9" fill="#fff" stroke="#bbd0d2" stroke-width="1.5"/><text x="140.0" y="145" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="140.0" dy="0">Lite 单体</tspan></text><text x="140.0" y="172" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="140.0" dy="0">少量功能</tspan><tspan x="140.0" dy="25">基本运行与质量要求</tspan></text><rect x="390" y="115" width="270" height="100" rx="9" fill="#edf7f3" stroke="#bbd0d2" stroke-width="1.5"/><text x="525.0" y="145" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="525.0" dy="0">Modular 单体</tspan></text><text x="525.0" y="172" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="525.0" dy="0">公开接口与内部实现</tspan><tspan x="525.0" dy="25">可执行依赖约束</tspan></text><rect x="805" y="45" width="275" height="90" rx="9" fill="#fff" stroke="#bbd0d2" stroke-width="1.5"/><text x="942.5" y="75" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="942.5" dy="0">外部能力按需加入</tspan></text><text x="942.5" y="102" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="942.5" dy="0">数据库、迁移、集成测试</tspan></text><rect x="805" y="235" width="275" height="90" rx="9" fill="#fff6e9" stroke="#bbd0d2" stroke-width="1.5"/><text x="942.5" y="265" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="942.5" dy="0">未来服务拆分</tspan></text><text x="942.5" y="292" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="942.5" dy="0">另做部署与隔离收益决策</tspan></text><path d="M260 165 H382" fill="none" stroke="#17766b" stroke-width="2" marker-end="url(#f2-teal)"/><text x="325" y="121" text-anchor="middle" fill="#18343e" font-size="14" font-weight="400"><tspan x="325" dy="0">业务边界</tspan></text><text x="325" y="142" text-anchor="middle" fill="#18343e" font-size="14" font-weight="400"><tspan x="325" dy="0">需独立维护</tspan></text><path d="M660 145 H730 V90 H797" fill="none" stroke="#17766b" stroke-width="2" marker-end="url(#f2-teal)"/><text x="729" y="67" text-anchor="middle" fill="#17766b" font-size="13" font-weight="400"><tspan x="729" dy="0">按需求</tspan></text><path d="M140 115 V25 H942 V37" fill="none" stroke="#17766b" stroke-width="2" marker-end="url(#f2-teal)"/><text x="485" y="53" text-anchor="middle" fill="#17766b" font-size="14" font-weight="400"><tspan x="485" dy="0">Lite 也可直接按需启用</tspan></text><path d="M660 187 H730 V280 H797" fill="none" stroke="#17766b" stroke-width="2" marker-end="url(#f2-teal)"/><text x="729" y="313" text-anchor="middle" fill="#17766b" font-size="13" font-weight="400"><tspan x="729" dy="0">另行评估</tspan></text></svg>