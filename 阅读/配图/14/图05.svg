<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f5-title f5-desc" viewBox="0 0 1135 345"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="f5-title">模板的生成、发布与升级</title><desc id="f5-desc">模板生成八种结果并验收后发布。业务仓库独立演进，模板更新和业务已有改动一起进入升级分支，处理冲突并验证后返回。</desc><defs><marker id="f5-teal" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17766b"/></marker><marker id="f5-red" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a84838"/></marker><marker id="f5-grey" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526a75"/></marker></defs><rect x="10" y="40" width="195" height="92" rx="9" fill="#fff" stroke="#bbd0d2" stroke-width="1.5"/><text x="107.5" y="70" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="107.5" dy="0">有版本的模板源</tspan></text><text x="107.5" y="97" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="107.5" dy="0">语言、档位、规则</tspan></text><rect x="235" y="40" width="195" height="92" rx="9" fill="#fff" stroke="#bbd0d2" stroke-width="1.5"/><text x="332.5" y="70" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="332.5" dy="0">八种基础结果</tspan></text><text x="332.5" y="97" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="332.5" dy="0">空目录与参数替换</tspan></text><rect x="460" y="40" width="195" height="92" rx="9" fill="#edf7f3" stroke="#bbd0d2" stroke-width="1.5"/><text x="557.5" y="70" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="557.5" dy="0">生成物验收</tspan></text><text x="557.5" y="97" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="557.5" dy="0">正常路径与违规反例</tspan></text><rect x="685" y="40" width="195" height="92" rx="9" fill="#fff" stroke="#bbd0d2" stroke-width="1.5"/><text x="782.5" y="70" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="782.5" dy="0">固定模板版本</tspan></text><text x="782.5" y="97" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="782.5" dy="0">支持矩阵、迁移说明</tspan></text><rect x="910" y="40" width="195" height="92" rx="9" fill="#fff" stroke="#bbd0d2" stroke-width="1.5"/><text x="1007.5" y="70" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="1007.5" dy="0">独立业务仓库</tspan></text><text x="1007.5" y="97" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="1007.5" dy="0">各自持续开发</tspan></text><path d="M205 86 H227" fill="none" stroke="#17766b" stroke-width="2" marker-end="url(#f5-teal)"/><path d="M430 86 H452" fill="none" stroke="#17766b" stroke-width="2" marker-end="url(#f5-teal)"/><path d="M655 86 H677" fill="none" stroke="#17766b" stroke-width="2" marker-end="url(#f5-teal)"/><path d="M880 86 H902" fill="none" stroke="#17766b" stroke-width="2" marker-end="url(#f5-teal)"/><rect x="780" y="245" width="295" height="80" rx="9" fill="#edf4fa" stroke="#bbd0d2" stroke-width="1.5"/><text x="927.5" y="275" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="927.5" dy="0">升级分支</tspan></text><text x="927.5" y="302" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="927.5" dy="0">处理冲突，重新验收</tspan></text><path d="M782 132 V200 H870 V237" fill="none" stroke="#17766b" stroke-width="2" marker-end="url(#f5-teal)"/><text x="720" y="183" text-anchor="middle" fill="#17766b" font-size="13" font-weight="400"><tspan x="720" dy="0">版本更新</tspan></text><path d="M1008 132 V237" fill="none" stroke="#17766b" stroke-width="2" marker-end="url(#f5-teal)"/><text x="955" y="190" text-anchor="middle" fill="#17766b" font-size="13" font-weight="400"><tspan x="955" dy="0">已有改动</tspan></text><path d="M1075 284 H1113 V177 H1028 V140" fill="none" stroke="#17766b" stroke-width="2" marker-end="url(#f5-teal)"/><text x="472" y="265" text-anchor="middle" fill="#526a75" font-size="16" font-weight="400"><tspan x="472" dy="0">先验收生成物，再发布；</tspan></text><text x="472" y="292" text-anchor="middle" fill="#526a75" font-size="16" font-weight="400"><tspan x="472" dy="0">升级不覆盖业务改动。</tspan></text></svg>