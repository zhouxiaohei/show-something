<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f4-title f4-desc" viewBox="0 0 1120 335"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="f4-title">构建产物启动验收</title><desc id="f4-desc">拟议验收顺序：干净检出、固定依赖与构建、启动、就绪及API验证、停止清理。启动或响应失败保留日志并返回失败。</desc><defs><marker id="f4-teal" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17766b"/></marker><marker id="f4-red" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a84838"/></marker><marker id="f4-grey" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526a75"/></marker></defs><rect x="15" y="55" width="190" height="92" rx="9" fill="#fff" stroke="#bbd0d2" stroke-width="1.5"/><text x="110.0" y="85" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="110.0" dy="0">干净检出</tspan></text><text x="110.0" y="112" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="110.0" dy="0">检查前置条件</tspan></text><rect x="240" y="55" width="190" height="92" rx="9" fill="#fff" stroke="#bbd0d2" stroke-width="1.5"/><text x="335.0" y="85" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="335.0" dy="0">固定依赖</tspan></text><text x="335.0" y="112" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="335.0" dy="0">构建运行产物</tspan></text><rect x="465" y="55" width="190" height="92" rx="9" fill="#fff" stroke="#bbd0d2" stroke-width="1.5"/><text x="560.0" y="85" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="560.0" dy="0">启动本次进程</tspan></text><text x="560.0" y="112" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="560.0" dy="0">等待应用就绪</tspan></text><rect x="690" y="55" width="190" height="92" rx="9" fill="#fff" stroke="#bbd0d2" stroke-width="1.5"/><text x="785.0" y="85" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="785.0" dy="0">健康与真实 API</tspan></text><text x="785.0" y="112" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="785.0" dy="0">验证响应行为</tspan></text><rect x="915" y="55" width="190" height="92" rx="9" fill="#fff" stroke="#bbd0d2" stroke-width="1.5"/><text x="1010.0" y="85" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="1010.0" dy="0">停止与清理</tspan></text><text x="1010.0" y="112" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="1010.0" dy="0">汇总退出状态</tspan></text><path d="M205 101 H232" fill="none" stroke="#17766b" stroke-width="2" marker-end="url(#f4-teal)"/><path d="M430 101 H457" fill="none" stroke="#17766b" stroke-width="2" marker-end="url(#f4-teal)"/><path d="M655 101 H682" fill="none" stroke="#17766b" stroke-width="2" marker-end="url(#f4-teal)"/><path d="M880 101 H907" fill="none" stroke="#17766b" stroke-width="2" marker-end="url(#f4-teal)"/><rect x="535" y="235" width="340" height="80" rx="9" fill="#fff2ed" stroke="#d6b2aa" stroke-width="1.5"/><text x="705.0" y="265" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="705.0" dy="0">失败也执行清理</tspan></text><text x="705.0" y="292" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="705.0" dy="0">保留日志、返回非零状态</tspan></text><path d="M560 147 V185 H635 V227" fill="none" stroke="#a84838" stroke-width="2" marker-end="url(#f4-red)" stroke-dasharray="6 5"/><path d="M785 147 V227" fill="none" stroke="#a84838" stroke-width="2" marker-end="url(#f4-red)" stroke-dasharray="6 5"/><text x="537" y="205" text-anchor="middle" fill="#a84838" font-size="13" font-weight="400"><tspan x="537" dy="0">启动失败</tspan></text><text x="844" y="197" text-anchor="middle" fill="#a84838" font-size="13" font-wei