<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f1-title f1-desc" viewBox="0 0 1120 310"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><title id="f1-title">模板、规则、检查与审阅</title><desc id="f1-desc">拟议协作结构：模板和共同规则帮助开发，hooks可选调用相同检查，失败返回修改，通过后交维护者审阅。</desc><defs><marker id="f1-teal" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17766b"/></marker><marker id="f1-red" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a84838"/></marker><marker id="f1-grey" orient="auto-start-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526a75"/></marker></defs><rect x="20" y="130" width="180" height="92" rx="9" fill="#fff" stroke="#bbd0d2" stroke-width="1.5"/><text x="110.0" y="160" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="110.0" dy="0">可运行模板</tspan></text><text x="110.0" y="187" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="110.0" dy="0">目录、示例与配置</tspan></text><rect x="275" y="130" width="235" height="92" rx="9" fill="#fff" stroke="#bbd0d2" stroke-width="1.5"/><text x="392.5" y="160" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="392.5" dy="0">人和 AI 修改</tspan></text><text x="392.5" y="187" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="392.5" dy="0">按规则开发</tspan></text><rect x="585" y="130" width="235" height="92" rx="9" fill="#fff" stroke="#bbd0d2" stroke-width="1.5"/><text x="702.5" y="160" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="702.5" dy="0">本地与 CI 检查</tspan></text><text x="702.5" y="187" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="702.5" dy="0">使用同一组实现</tspan></text><rect x="895" y="130" width="205" height="92" rx="9" fill="#fff" stroke="#bbd0d2" stroke-width="1.5"/><text x="997.5" y="160" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="997.5" dy="0">维护者审阅</tspan></text><text x="997.5" y="187" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="997.5" dy="0">业务与规则变更</tspan></text><rect x="275" y="15" width="235" height="78" rx="9" fill="#edf7f3" stroke="#bbd0d2" stroke-width="1.5"/><text x="392.5" y="45" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="392.5" dy="0">AGENTS 与规范</tspan></text><text x="392.5" y="72" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="392.5" dy="0">位置、边界、完成条件</tspan></text><rect x="585" y="15" width="235" height="78" rx="9" fill="#edf4fa" stroke="#bbd0d2" stroke-width="1.5"/><text x="702.5" y="45" text-anchor="middle" fill="#18343e" font-size="17" font-weight="600"><tspan x="702.5" dy="0">可选 Agent hooks</tspan></text><text x="702.5" y="72" text-anchor="middle" fill="#526a75" font-size="14" font-weight="400"><tspan x="702.5" dy="0">调用已有检查</tspan></text><path d="M200 176 H267" fill="none" stroke="#17766b" stroke-width="2" marker-end="url(#f1-teal)"/><path d="M510 176 H577" fill="none" stroke="#17766b" stroke-width="2" marker-end="url(#f1-teal)"/><path d="M820 176 H887" fill="none" stroke="#17766b" stroke-width="2" marker-end="url(#f1-teal)"/><path d="M392 93 V122" fill="none" stroke="#17766b" stroke-width="2" marker-end="url(#f1-teal)"/><path d="M702 93 V122" fill="none" stroke="#526a75" stroke-width="2" marker-end="url(#f1-grey)" stroke-dasharray="6 5"/><text x="858" y="158" text-anchor="middle" fill="#17766b" font-size="13" font-weight="400"><tspan x="858" dy="0">通过</tspan></text><path d="M702 222 V267 H392 V230" fill="none" stroke="#a84838" stroke-width="2" marker-end="url(#f1-red)"/><text x="548" y="291" text-anchor="middle" fill="#a84838" font-size="13" font-weight="4