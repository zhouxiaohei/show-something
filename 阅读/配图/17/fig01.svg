<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm17-1-title dm17-1-desc"><title id="dm17-1-title">代码、9B 小脑与大模型的三层分工</title><desc id="dm17-1-desc">一次请求进来后按顺序经过代码确定性逻辑、9B 决策小脑和大模型三层，每层标注典型工作、延迟成本与分流判据。</desc><defs><marker id="dm17-1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">一次请求进来：每层只接自己那一段活</text><g><rect x="25" y="62" width="180" height="42" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="115" y="89" font-size="19" fill="#34475b" text-anchor="middle">用户请求 / 事件</text></g><path d="M115,104 L115,126" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-1-arrow)"/><g><rect x="25" y="130" width="910" height="118" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="158" font-size="19" fill="#34475b">第一层 · 代码（确定性逻辑）｜0 推理、0 模型调用</text><text x="45" y="184" font-size="17" fill="#5c6d80">Schema 校验 · 权限检查 · 幂等控制 · 重试与超时 · 状态机 · 审计日志</text><text x="45" y="212" font-size="17" fill="#5c6d80">判据：凡能写成 if-else 的，不交给任何模型</text></g><path d="M480,248 L480,270" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-1-arrow)"/><g><rect x="25" y="274" width="910" height="128" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="302" font-size="19" fill="#34475b">第二层 · 9B 决策小脑｜约 0.5 秒 · 成本约大模型的 1/27（厂商自评）</text><text x="45" y="328" font-size="17" fill="#5c6d80">从有限选项里挑一个：选哪个工具 · 走哪条分支 · 抽哪几个参数 · 要不要拦截</text><text x="45" y="354" font-size="17" fill="#5c6d80">输出 = 选项 + 置信度；置信度不够就上交，不硬猜</text><text x="45" y="382" font-size="17" fill="#5c6d80">判据：答案落在有限集合内，且错了有兜底</text></g><path d="M480,402 L480,424" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-1-arrow)"/><g><rect x="25" y="428" width="910" height="94" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="45" y="456" font-size="19" fill="#34475b">第三层 · 大模型｜秒级 · 贵，但只有它干得了</text><text x="45" y="482" font-size="17" fill="#5c6d80">开放性思考：理解模糊意图 · 长上下文推理 · 多步规划 · 生成内容 · 接住小脑上交的判断</text><text x="45" y="506" font-size="17" fill="#5c6d80">判据：有限选项装不下的时候才出场</text></g><path d="M480,522 L480,540" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-1-arrow)"/><g><rect x="360" y="544" width="240" height="0" rx="0" fill="none"/></g><text x="480" y="550" font-size="17" fill="#5c6d80" text-anchor="middle">↓ 执行工具 / 落库 / 指挥设备（代码收尾）</text></g></svg>
