<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="dm17-7-title dm17-7-desc"><title id="dm17-7-title">置信度校准前后对比</title><desc id="dm17-7-desc">左侧校准前：模型报的置信度普遍高于实际正确率，高分段差距最大，是盲目自信；右侧校准后：报分与实际正确率对齐。校准的含义是报 0.9 的那批判断真实正确率约九成。</desc><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">校准的目标：报出的分数 = 真实的正确率</text><text x="230" y="70" font-size="19" fill="#34475b" text-anchor="middle">校准前：盲目自信（微调后的常见病）</text><g><line x1="70" y1="100" x2="70" y2="380" stroke="#98a4b0" stroke-width="1.5"/><line x1="70" y1="380" x2="420" y2="380" stroke="#98a4b0" stroke-width="1.5"/><line x1="70" y1="100" x2="420" y2="380" stroke="#98a4b0" stroke-width="1.5" stroke-dasharray="5,4"/><rect x="105" y="304" width="30" height="76" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><rect x="139" y="278" width="30" height="102" fill="#f9ecec" stroke="#b97a7a" stroke-width="1.5"/><rect x="175" y="252" width="30" height="128" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><rect x="209" y="213" width="30" height="167" fill="#f9ecec" stroke="#b97a7a" stroke-width="1.5"/><rect x="245" y="177" width="30" height="203" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><rect x="279" y="146" width="30" height="234" fill="#f9ecec" stroke="#b97a7a" stroke-width="1.5"/><rect x="313" y="115" width="30" height="265" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><rect x="347" y="112" width="30" height="268" fill="#f9ecec" stroke="#b97a7a" stroke-width="1.5"/><text x="154" y="272" font-size="17" fill="#8a3030" text-anchor="middle">差 6 分</text><text x="224" y="207" font-size="17" fill="#8a3030" text-anchor="middle">差 13 分</text><text x="294" y="140" font-size="17" fill="#8a3030" text-anchor="middle">差 15 分</text><text x="245" y="404" font-size="17" fill="#5c6d80" text-anchor="middle">模型报的置信度（越右越高）</text><text x="58" y="245" font-size="17" fill="#5c6d80" text-anchor="middle" transform="rotate(-90 58 245)">实际正确率</text><text x="70" y="94" font-size="15" fill="#5c6d80" text-anchor="start">100%</text></g><g><text x="470" y="230" font-size="19" fill="#34475b" text-anchor="middle">温度缩放</text><text x="470" y="254" font-size="17" fill="#5c6d80" text-anchor="middle">在独立校准集上</text><text x="470" y="278" font-size="17" fill="#5c6d80" text-anchor="middle">调一个参数</text><path d="M432,240 L508,240" fill="none" stroke="#739882" stroke-width="2.5" marker-end="url(#dm17-7-arrow)"/></g><defs><marker id="dm17-7-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="730" y="70" font-size="19" fill="#34475b" text-anchor="middle">校准后：分数诚实，阈值才有意义</text><g><line x1="570" y1="100" x2="570" y2="380" stroke="#98a4b0" stroke-width="1.5"/><line x1="570" y1="380" x2="920" y2="380" stroke="#98a4b0" stroke-width="1.5"/><line x1="570" y1="100" x2="920" y2="380" stroke="#739882" stroke-width="1.5" stroke-dasharray="5,4"/><rect x="605" y="304" width="30" height="76" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><rect x="639" y="278" width="30" height="102" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><rect x="675" y="252" width="30" height="128" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><rect x="709" y="213" width="30" height="167" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><rect x="745" y="177" width="30" height="203" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><rect x="779" y="146" width="30" height="234" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><rect x="813" y="112" width="30" height="268" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><rect x="847" y="112" width="30" height="268" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="745" y="404" font-size="17" fill="#5c6d80" text-anchor="middle">模型报的置信度</text><text x="745" y="428" font-size="17" fill="#34475b" text-anchor="middle">说 0.9 的那批，真实正确率就是约 90%</text></g><text x="480" y="456" font-size="17" fill="#34475b" text-anchor="middle">分数一诚实，"0.95 直接办 / 0.7 上交"这套分档才敢真用</text></g></svg>
