<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="dm17-4-title dm17-4-desc"><title id="dm17-4-title">三种错误的处理路径</title><desc id="dm17-4-desc">第一种错：9B 没把握，事前上交大模型，判断根本没出门；第二种错：9B 有把握但错了，靠执行结果校验抓出，重试后升级；第三种错：贵动作错了赔不起，不搞事后补救，改为大模型复核后才执行。</desc><defs><marker id="dm17-4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">"错了怎么重新分"：三种错，三条路</text><g><rect x="25" y="62" width="290" height="150" rx="12" fill="#f9ecec" stroke="#b97a7a" stroke-width="1.5"/><text x="45" y="92" font-size="19" fill="#34475b">错一：它自己没把握</text><text x="45" y="120" font-size="17" fill="#5c6d80">分数低于阈值</text><text x="45" y="146" font-size="17" fill="#5c6d80">→ 事前转大模型，判断没出门</text><text x="45" y="176" font-size="17" fill="#34475b">最干净的兜底</text></g><g><rect x="335" y="62" width="290" height="150" rx="12" fill="#fdf3e3" stroke="#c49a58" stroke-width="1.5"/><text x="355" y="92" font-size="19" fill="#34475b">错二：有把握，但真错了</text><text x="355" y="120" font-size="17" fill="#5c6d80">置信度骗不过，只能靠结果抓：</text><text x="355" y="146" font-size="17" fill="#5c6d80">工具报错 → 重试 1 次 → 升级大模型</text><text x="355" y="176" font-size="17" fill="#34475b">"动作办没办成"由代码说了算</text></g><g><rect x="645" y="62" width="290" height="150" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="665" y="92" font-size="19" fill="#34475b">错三：贵动作错了赔不起</text><text x="665" y="120" font-size="17" fill="#5c6d80">退款、付款、部署等不可逆动作</text><text x="665" y="146" font-size="17" fill="#5c6d80">不搞"错了再补救"：9B 只出拟办单</text><text x="665" y="176" font-size="17" fill="#34475b">大模型复核签字后才准执行</text></g><path d="M315,137 L331,137" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-4-arrow)"/><path d="M625,137 L641,137" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-4-arrow)"/><g><rect x="25" y="244" width="910" height="94" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="272" font-size="19" fill="#34475b">原则：兜底方案的档次，跟着动作的代价走，不是全局一刀切</text><text x="45" y="300" font-size="17" fill="#5c6d80">便宜动作（查物流、改地址）允许"错了重试"；不可逆动作（退款、部署）必须事前复核</text><text x="45" y="324" font-size="17" fill="#5c6d80">复核签字、重试记录、拦截原因都要进审计日志</text></g><g><rect x="25" y="362" width="910" height="94" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="390" font-size="19" fill="#34475b">一个完整例子：客服退款</text><text x="45" y="416" font-size="17" fill="#5c6d80">"东西有质量问题，给我退了" → 9B 判 0.93（黄档）+ 不可逆 → 出拟办单 → 大模型查订单符合政策 → 签字执行</text><text x="45" y="440" font-size="17" fill="#5c6d80">9B 干了九成活，大模型只花几秒签字；错案与改判案自动进教材回流</text></g></g></svg>
