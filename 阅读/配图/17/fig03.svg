<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="dm17-3-title dm17-3-desc"><title id="dm17-3-title">一次判断的完整链路：置信度分档与三层保险</title><desc id="dm17-3-desc">请求经代码校验进入 9B 打分，按置信度分三档处理：高分直接办、中档看动作代价、低分上交大模型；执行后有结果校验，失败重试后升级；旁路有熔断降级与错案回流。</desc><defs><marker id="dm17-3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">一次判断的完整链路：置信度分档 + 三层保险</text><g><rect x="370" y="56" width="220" height="40" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="480" y="82" font-size="19" fill="#34475b" text-anchor="middle">用户请求</text></g><path d="M480,96 L480,116" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-3-arrow)"/><g><rect x="270" y="120" width="420" height="76" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="480" y="146" font-size="19" fill="#34475b" text-anchor="middle">9B 小脑打分（温度=0，只准输出 JSON 枚举）</text><text x="480" y="172" font-size="17" fill="#5c6d80" text-anchor="middle">退款 0.87 / 查物流 0.08 / 其他 0.05</text><text x="480" y="192" font-size="17" fill="#5c6d80" text-anchor="middle">置信度 = 最高选项的概率，不编造、不加解释</text></g><path d="M480,196 L480,216" fill="none" stroke="#6d8296" stroke-width="2"/><path d="M150,216 L810,216" fill="none" stroke="#6d8296" stroke-width="2"/><path d="M150,216 L150,240" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-3-arrow)"/><path d="M480,216 L480,240" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-3-arrow)"/><path d="M810,216 L810,240" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-3-arrow)"/><g><rect x="40" y="244" width="220" height="118" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="150" y="272" font-size="19" fill="#34475b" text-anchor="middle">≥ 0.95 直接办</text><text x="150" y="298" font-size="17" fill="#5c6d80" text-anchor="middle">查物流、改地址、分流会话</text><text x="150" y="322" font-size="17" fill="#5c6d80" text-anchor="middle">便宜且可回滚的动作</text><text x="150" y="348" font-size="17" fill="#5c6d80" text-anchor="middle">事后按比例抽检</text></g><g><rect x="370" y="244" width="220" height="118" rx="12" fill="#fdf3e3" stroke="#c49a58" stroke-width="1.5"/><text x="480" y="272" font-size="19" fill="#34475b" text-anchor="middle">0.70 ~ 0.95 看代价</text><text x="480" y="298" font-size="17" fill="#5c6d80" text-anchor="middle">便宜动作：办 + 抽检</text><text x="480" y="322" font-size="17" fill="#5c6d80" text-anchor="middle">退款、部署等不可逆动作：</text><text x="480" y="348" font-size="17" fill="#5c6d80" text-anchor="middle">出拟办单 → 大模型复核才准动</text></g><g><rect x="700" y="244" width="220" height="118" rx="12" fill="#f9ecec" stroke="#b97a7a" stroke-width="1.5"/><text x="810" y="272" font-size="19" fill="#34475b" text-anchor="middle">&lt; 0.70 上交</text><text x="810" y="298" font-size="17" fill="#5c6d80" text-anchor="middle">不硬猜，转大模型处理</text><text x="810" y="322" font-size="17" fill="#5c6d80" text-anchor="middle">这不算错，是交卷</text><text x="810" y="348" font-size="17" fill="#5c6d80" text-anchor="middle">常见约 5~15% 流量</text></g><path d="M150,362 L150,400 L370,400" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-3-arrow)"/><g><rect x="372" y="384" width="250" height="76" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="497" y="410" font-size="19" fill="#34475b" text-anchor="middle">执行 + 结果校验</text><text x="497" y="436" font-size="17" fill="#5c6d80" text-anchor="middle">工具报错 / 参数不符 / 业务复验不过</text><text x="497" y="456" font-size="17" fill="#5c6d80" text-anchor="middle">→ 自动重试 1 次 → 还败 → 升级</text></g><g><rect x="700" y="384" width="220" height="76" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="810" y="410" font-size="19" fill="#34475b" text-anchor="middle">大模型值班主管</text><text x="810" y="436" font-size="17" fill="#5c6d80" text-anchor="middle">接住红档 + 升级件 + 复核件</text><text x="810" y="456" font-size="17" fill="#5c6d80" text-anchor="middle">它也摆不平 → 人工队列</text></g><path d="M622,422 L696,422" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-3-arrow)"/><path d="M810,360 L810,380" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-3-arrow)"/><g><rect x="40" y="384" width="250" height="76" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5" stroke-dasharray="6,4"/><text x="165" y="410" font-size="19" fill="#34475b" text-anchor="middle">保险丝：9B 挂了 / 超时</text><text x="165" y="436" font-size="17" fill="#5c6d80" text-anchor="middle">熔断开关 → 全量降级走大模型</text><text x="165" y="456" font-size="17" fill="#5c6d80" text-anchor="middle">业务不断，只是变慢变贵</text></g><path d="M497,460 L497,500" fill="none" stroke="#6d8296" stroke-width="2"/><g><rect x="372" y="504" width="250" height="60" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="497" y="530" font-size="19" fill="#34475b" text-anchor="middle">错案 + 改判案 → 教材</text><text x="497" y="554" font-size="17" fill="#5c6d80" text-anchor="middle">定期回炉重训（RSI 的实际含义）</text></g><path d="M497,504 L497,488 L60,488 L60,168 L266,158" fill="none" stroke="#739882" stroke-width="2" marker-end="url(#dm17-3-arrow)"/><text x="180" y="480" font-size="17" fill="#34475b">回流</text><g><rect x="660" y="504" width="260" height="60" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="790" y="530" font-size="19" fill="#34475b" text-anchor="middle">确定性三件套</text><text x="790" y="554" font-size="17" fill="#5c6d80" text-anchor="middle">温度 0 · 输出锁 JSON 枚举 · 版本锁定</text></g><text x="480" y="600" font-size="17" fill="#5c6d80" text-anchor="middle">总原则：9B 是加速器不是必需品——拔掉它系统照样转，只是慢和贵</text></g></svg>
