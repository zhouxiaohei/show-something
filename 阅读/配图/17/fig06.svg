<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="dm17-6-title dm17-6-desc"><title id="dm17-6-title">教材配方：四类题型及占比</title><desc id="dm17-6-desc">训练教材不能全是标准答案：常规题约七成给正确选项，模糊题约一成半标签是上交，陷阱题约一成看着像 A 其实是 B，罕见题约半成给正确选项或上交。下方标注错例来源。</desc><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">教材配方：往标准答案里掺"脏东西"</text><g><rect x="25" y="60" width="640" height="60" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="97" font-size="19" fill="#34475b">常规题 ~70%：标准答案 = 正确选项</text></g><g><rect x="665" y="60" width="135" height="60" fill="#fdf3e3" stroke="#c49a58" stroke-width="1.5"/><text x="732" y="90" font-size="19" fill="#34475b" text-anchor="middle">模糊题</text><text x="732" y="112" font-size="17" fill="#5c6d80" text-anchor="middle">~15%</text></g><g><rect x="800" y="60" width="90" height="60" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="845" y="90" font-size="19" fill="#34475b" text-anchor="middle">陷阱题</text><text x="845" y="112" font-size="17" fill="#5c6d80" text-anchor="middle">~10%</text></g><g><rect x="890" y="60" width="45" height="60" fill="#f9ecec" stroke="#b97a7a" stroke-width="1.5"/><text x="912" y="92" font-size="17" fill="#34475b" text-anchor="middle">罕见</text></g><g><rect x="25" y="140" width="910" height="118" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="168" font-size="19" fill="#34475b">四种题各教一件事</text><text x="45" y="196" font-size="17" fill="#5c6d80">常规题：教"怎么做对"；模糊题：教"什么时候说不知道"（标签就是"上交"）</text><text x="45" y="222" font-size="17" fill="#5c6d80">陷阱题：教"看着像 A 其实是 B"；罕见题：教"少见场景不乱猜"</text><text x="45" y="246" font-size="17" fill="#5c6d80">占比是工程经验值 [经验]，按业务流量分布调整，不存在固定配比</text></g><g><rect x="25" y="278" width="910" height="118" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="306" font-size="19" fill="#34475b">错例和陷阱题从哪来</text><text x="45" y="334" font-size="17" fill="#5c6d80">真实错案：回流闭环里大模型纠正过的、用户改判的那批（最值钱的教材）</text><text x="45" y="360" font-size="17" fill="#5c6d80">对抗样本：让大模型当出题人，批量造"我不想要了但过了 7 天"这类边界表述</text><text x="45" y="384" font-size="17" fill="#5c6d80">历史捞底：工单、客服记录里现成的"输入 + 正确结果"配对</text></g></g></svg>
