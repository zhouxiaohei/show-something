<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="dm17-2-title dm17-2-desc"><title id="dm17-2-title">Agnes Harness 的四层结构</title><desc id="dm17-2-desc">照人的结构分的四层：大脑对应大模型，小脑对应 9B 决策模型，记忆对应 Harness 本体与经验沉淀，身体对应统一设备协议；外部闭环是复盘自进化。依据厂商公开自述整理。</desc><defs><marker id="dm17-2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">Agnes Harness：照着人的结构搭的四层（厂商公开自述）</text><g><rect x="25" y="62" width="450" height="96" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="45" y="90" font-size="19" fill="#34475b">大脑 · LLM（Agnes 3.0 Flash 等）</text><text x="45" y="116" font-size="17" fill="#5c6d80">理解意图 · 规划 · 处理异常 · 生成表达</text><text x="45" y="140" font-size="17" fill="#5c6d80">只干"需要想"的活，被小脑分流减负</text></g><g><rect x="505" y="62" width="430" height="96" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="525" y="90" font-size="19" fill="#34475b">小脑 · Agnes Sys1（9B 决策模型）</text><text x="525" y="116" font-size="17" fill="#5c6d80">高频条件判断直接拍板：选工具、走分支、抽参数</text><text x="525" y="140" font-size="17" fill="#5c6d80">官方自评：快决策 0.53 秒 vs 纯 LLM 7.6 秒</text></g><g><rect x="25" y="186" width="450" height="96" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="214" font-size="19" fill="#34475b">记忆 · Harness 本体（事件账本）</text><text x="45" y="240" font-size="17" fill="#5c6d80">记录执行轨迹；跑通的流程沉淀成 Skills 与 Playbook</text><text x="45" y="264" font-size="17" fill="#5c6d80">带版本号，跨项目复用</text></g><g><rect x="505" y="186" width="430" height="96" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="525" y="214" font-size="19" fill="#34475b">身体 · MHS 模型硬件标准</text><text x="525" y="240" font-size="17" fill="#5c6d80">统一协议接机械臂、机器人、传感器</text><text x="525" y="264" font-size="17" fill="#5c6d80">一般 Harness 只管屏幕内的事，这是它独特的部分</text></g><path d="M250,158 L250,182" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-2-arrow)"/><path d="M720,158 L720,182" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-2-arrow)"/><path d="M480,234 L501,234" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-2-arrow)"/><path d="M480,110 L501,110" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-2-arrow)"/><g><rect x="25" y="310" width="910" height="110" rx="12" fill="#fdf3e3" stroke="#c49a58" stroke-width="1.5"/><text x="45" y="338" font-size="19" fill="#34475b">自进化闭环（官方称 TTT + RSI，未独立验证）</text><text x="45" y="364" font-size="17" fill="#5c6d80">TTT：小脑在单次请求内临时适应材料；RSI：系统复盘失败、验证新策略、沉淀成手册</text><text x="45" y="392" font-size="17" fill="#5c6d80">官方案例：设备入库验收首次 30 分钟超时，复盘后第二次 8 分钟结案（自述）</text></g><path d="M480,282 L480,306" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-2-arrow)"/><path d="M480,420 L480,444" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-2-arrow)"/><g><rect x="25" y="448" width="910" height="52" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="481" font-size="17" fill="#5c6d80">生态位：卡在"模型能力"和"企业现场"之间——开源底座（Apache-2.0）+ FDE 交付，模型走开放平台 API 收费</text></g></g></svg>
