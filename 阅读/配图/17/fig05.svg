<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="dm17-5-title dm17-5-desc"><title id="dm17-5-title">9B 决策模型的训练闭环</title><desc id="dm17-5-desc">五步闭环：先用大模型跑业务攒教材，再做 SFT 微调，然后用正常题加陷阱题考试，带兜底上岗，错案和改判案回流成新教材定期重训。回流箭头从第五步指回第一二步。</desc><defs><marker id="dm17-5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">9B 决策模型怎么训练：像带一个新员工</text><g><rect x="25" y="60" width="440" height="90" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="88" font-size="19" fill="#34475b">① 攒教材（最花功夫的一步）</text><text x="45" y="114" font-size="17" fill="#5c6d80">让大模型先干 1~3 个月业务，把每次判断记下来</text><text x="45" y="138" font-size="17" fill="#5c6d80">输入一句话 → 应选哪个工具 + 抽什么参数</text></g><g><rect x="495" y="60" width="440" height="90" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="515" y="88" font-size="19" fill="#34475b">② 照着答案学（SFT 微调）</text><text x="515" y="114" font-size="17" fill="#5c6d80">几千~几万条就够；LoRA 单卡几小时~几天</text><text x="515" y="138" font-size="17" fill="#5c6d80">它不是在学全世界，只是在学你家业务的判断习惯</text></g><path d="M465,105 L491,105" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-5-arrow)"/><path d="M715,150 L715,176" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-5-arrow)"/><g><rect x="495" y="180" width="440" height="104" rx="12" fill="#fdf3e3" stroke="#c49a58" stroke-width="1.5"/><text x="515" y="208" font-size="19" fill="#34475b">③ 考试（决定敢不敢上线）</text><text x="515" y="234" font-size="17" fill="#5c6d80">留 10~20% 数据当考卷：正常题准确率多少</text><text x="515" y="260" font-size="17" fill="#5c6d80">再考陷阱题：模糊该上交的 case 会不会乱答</text><text x="515" y="282" font-size="17" fill="#34475b">置信度阈值在这一步校准</text></g><path d="M715,284 L715,310" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-5-arrow)"/><g><rect x="495" y="314" width="440" height="90" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="515" y="342" font-size="19" fill="#34475b">④ 上岗（带兜底）</text><text x="515" y="368" font-size="17" fill="#5c6d80">前面：代码规则校验挡一道</text><text x="515" y="392" font-size="17" fill="#5c6d80">旁边：低置信度 → 转交大模型"值班主管"</text></g><g><rect x="25" y="314" width="440" height="90" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="45" y="342" font-size="19" fill="#34475b">⑤ 复盘回流（越用越准）</text><text x="45" y="368" font-size="17" fill="#5c6d80">大模型纠正过的、用户改判的 case</text><text x="45" y="392" font-size="17" fill="#5c6d80">攒成新教材，定期回炉再训</text></g><path d="M491,359 L469,359" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm17-5-arrow)"/><path d="M245,314 L245,290 L245,154" fill="none" stroke="#739882" stroke-width="2"/><path d="M245,154 L480,154 L480,105 L491,105" fill="none" stroke="#739882" stroke-width="2" marker-end="url(#dm17-5-arrow)"/><text x="255" y="150" font-size="17" fill="#34475b">新数据 → 回到 ①② 重训</text><g><rect x="495" y="430" width="440" height="0" fill="none"/></g><g><rect x="25" y="60" width="0" height="0" fill="none"/></g><g><rect x="25" y="430" width="910" height="0" fill="none"/></g><text x="480" y="448" font-size="17" fill="#5c6d80" text-anchor="middle">结果：亚秒级出判断、成本约大模型 1/27（厂商自评），且同样的输入倾向给同样的答案</text></g></svg>
