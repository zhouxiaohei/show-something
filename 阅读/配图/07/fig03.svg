<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm07-3-title dm07-3-desc"><title id="dm07-3-title">知识正本：事实依据与文档正本分开，知识按职责分流</title><desc id="dm07-3-desc">事实依据回答为什么认为成立，文档正本回答团队在哪里维护说明；一个重要事实要能追到对象、范围、依据与复核人；项目知识按规则、事实策略、设计解释、个人记录分四处归属。</desc><defs><marker id="dm07-3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">知识正本 · 权威来源不是"我们决定相信这份 Markdown"</text><g><rect x="25" y="62" width="445" height="110" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="92" font-size="19" fill="#34475b">事实依据｜为什么认为这件事成立</text><text x="45" y="118" font-size="17" fill="#5c6d80">程序行为 → 代码与测试；运行配置 → 对应</text><text x="45" y="140" font-size="17" fill="#5c6d80">环境的证据；操作策略 → 负责人确认</text></g><g><rect x="490" y="62" width="445" height="110" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="510" y="92" font-size="19" fill="#34475b">文档正本｜团队在哪里维护这件事的说明</text><text x="510" y="118" font-size="17" fill="#5c6d80">文档把它们组织成可追溯的知识，</text><text x="510" y="140" font-size="17" fill="#5c6d80">不能自己任命自己为真相</text></g><path d="M480,172 L480,190" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm07-3-arrow)"/><g><rect x="25" y="194" width="910" height="64" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="220" font-size="19" fill="#34475b">一个重要事实，要让读者追到四件事</text><text x="45" y="244" font-size="17" fill="#5c6d80">说的是什么对象｜适用什么范围｜依据在哪里｜谁负责复核（文件修改时间 ≠ 内容核验时间）</text></g><path d="M480,258 L480,280" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm07-3-arrow)"/><g><rect x="25" y="284" width="910" height="180" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="312" font-size="19" fill="#34475b">同一项目的知识分工：区分职责，不是强制目录名</text><text x="45" y="340" font-size="17" fill="#5c6d80">执行时必须遵守的规则（答题前先确认环境与版本）→ 精简的项目指令入口，任务开始前获得</text><text x="45" y="368" font-size="17" fill="#5c6d80">项目事实与操作策略（等待上限、超时后怎样查询）→ 有维护者和来源的项目文档，按任务读取</text><text x="45" y="396" font-size="17" fill="#5c6d80">设计解释与历史经验（为什么延长等待）→ 决策记录与复盘，帮助理解当前规则</text><text x="45" y="424" font-size="17" fill="#5c6d80">个人偏好与临时工作记录 → 个人配置或工作记录，不自动升级成团队项目事实</text><text x="45" y="450" font-size="17" fill="#34475b">反例："等待上限改成 60 秒"靠私人记忆维持——换个协作者，就丢规则或带上错误的旧值</text></g><g><rect x="25" y="478" width="910" height="56" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="512" font-size="19" fill="#34475b">判断标准：它是否帮助完成一个实际任务，维护方式能否承受它的变化速度</text></g></g></svg>
