<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm07-4-title dm07-4-desc"><title id="dm07-4-title">使用验证：三类检查对象与五类 Golden 题</title><desc id="dm07-4-desc">事实是否仍成立、回答是否有资料支持、任务是否被正确处理三类检查分开；Golden 题分事实题、决策题、缺证题、语义题、条件变化题五类，预期答案由策略与审核依据产生。</desc><defs><marker id="dm07-4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">使用验证 · 三类检查对象分开，别合成一个"知识库准确率"</text><g><rect x="25" y="62" width="290" height="140" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="92" font-size="19" fill="#34475b">① 事实是否仍成立</text><text x="45" y="118" font-size="17" fill="#5c6d80">文档写的策略，是否符合相应</text><text x="45" y="140" font-size="17" fill="#5c6d80">版本与环境的审核依据？</text></g><g><rect x="335" y="62" width="290" height="140" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="355" y="92" font-size="19" fill="#34475b">② 回答是否有资料支持</text><text x="355" y="118" font-size="17" fill="#5c6d80">Agent 的说法，能否从它实际</text><text x="355" y="140" font-size="17" fill="#5c6d80">取得的资料里推出来？</text></g><g><rect x="645" y="62" width="290" height="140" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="665" y="92" font-size="19" fill="#34475b">③ 任务是否被正确处理</text><text x="665" y="118" font-size="17" fill="#5c6d80">建议或行动，是否满足当前</text><text x="665" y="140" font-size="17" fill="#5c6d80">策略与权限边界？</text></g><path d="M480,202 L480,224" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm07-4-arrow)"/><g><rect x="25" y="228" width="910" height="190" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="256" font-size="19" fill="#34475b">Golden 题：从高风险疑问、近期变更、已发生的误用中挑——不为题量把每页改成阅读理解</text><text x="45" y="284" font-size="17" fill="#5c6d80">事实题：release-2 生产等待上限是多少 → 60 秒，并带版本、环境与出处</text><text x="45" y="312" font-size="17" fill="#5c6d80">决策题：J17 运行 45 秒、状态 running → 查询原任务；不能仅凭耗时取消或重提</text><text x="45" y="340" font-size="17" fill="#5c6d80">缺证题：只给测试环境说明，生产上限是多少 → 明确"生产值未知"，不套用测试值</text><text x="45" y="368" font-size="17" fill="#5c6d80">语义题：客户端等待等满 60 秒，后台是否一定失败 → 区分等待结束与后台状态，查询原任务</text><text x="45" y="396" font-size="17" fill="#5c6d80">条件变化题：用户明确要求取消且服务返回可取消 → 承认取消路径成立，执行时服务端仍复核</text></g><path d="M480,418 L480,440" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm07-4-arrow)"/><g><rect x="25" y="444" width="910" height="96" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="474" font-size="19" fill="#34475b">预期答案由策略与审核依据产生，不从被测文档抄——一起复制旧错误，越忠实假成绩越漂亮</text><text x="45" y="504" font-size="17" fill="#5c6d80">报告保留失败分布：是事实题错，还是读到事实在决策题上错？正常题通过但缺证题仍猜？比平均数更能指导维护</text></g></g></svg>
