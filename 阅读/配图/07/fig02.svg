<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm07-2-title dm07-2-desc"><title id="dm07-2-title">总体方案：四部分职责与依赖</title><desc id="dm07-2-desc">知识正本、阅读与导航、使用验证、变更维护四部分各回答什么、维护什么、不承担什么；导航引用正本，正本提供内容，验证反馈缺口给维护，维护复核修订正本并调整入口。</desc><defs><marker id="dm07-2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">总体方案 · 四部分职责与依赖（不要求四个服务或四套文件夹）</text><g><rect x="25" y="62" width="430" height="180" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="92" font-size="19" fill="#34475b">① 知识正本</text><text x="45" y="118" font-size="17" fill="#5c6d80">回答：当前说明是什么，适用于谁，</text><text x="45" y="140" font-size="17" fill="#5c6d80">凭什么成立。对象：事实参考、策略、</text><text x="45" y="162" font-size="17" fill="#5c6d80">设计理由、来源与范围</text><text x="45" y="192" font-size="17" fill="#34475b">不承担：不以文件名代替运行事实核实</text></g><g><rect x="505" y="62" width="430" height="180" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="525" y="92" font-size="19" fill="#34475b">② 阅读与导航</text><text x="525" y="118" font-size="17" fill="#5c6d80">回答：针对这个问题，应该取得</text><text x="525" y="140" font-size="17" fill="#5c6d80">哪些资料。对象：入口、目录、查询</text><text x="525" y="162" font-size="17" fill="#5c6d80">路径、导读及派生视图</text><text x="525" y="192" font-size="17" fill="#34475b">不承担：不手工维护另一套当前事实</text></g><g><rect x="25" y="300" width="430" height="180" rx="12" fill="#fdf3e3" stroke="#c49a58" stroke-width="1.5"/><text x="45" y="330" font-size="19" fill="#34475b">④ 变更维护</text><text x="45" y="356" font-size="17" fill="#5c6d80">回答：什么变了，由谁复核哪些</text><text x="45" y="378" font-size="17" fill="#5c6d80">依赖。对象：来源关系、责任人、</text><text x="45" y="400" font-size="17" fill="#5c6d80">版本状态、模板与本地差异</text><text x="45" y="430" font-size="17" fill="#34475b">不承担：不把所有差异当错误强行同步</text></g><g><rect x="505" y="300" width="430" height="180" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="525" y="330" font-size="19" fill="#34475b">③ 使用验证</text><text x="525" y="356" font-size="17" fill="#5c6d80">回答：实际取得了什么，回答或</text><text x="525" y="378" font-size="17" fill="#5c6d80">动作是否有据。对象：任务、读取</text><text x="525" y="400" font-size="17" fill="#5c6d80">记录、参考依据、判据与检查结果</text><text x="525" y="430" font-size="17" fill="#34475b">不承担：一个成绩不等于全部事实正确</text></g><path d="M505,120 L457,120" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm07-2-arrow)"/><text x="480" y="110" font-size="17" fill="#5c6d80" text-anchor="middle">引用</text><path d="M360,242 L540,296" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm07-2-arrow)"/><text x="450" y="262" font-size="17" fill="#5c6d80" text-anchor="middle">提供内容</text><path d="M505,390 L457,390" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm07-2-arrow)"/><text x="480" y="380" font-size="17" fill="#5c6d80" text-anchor="middle">缺口反馈</text><path d="M240,300 L240,246" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm07-2-arrow)"/><text x="252" y="278" font-size="17" fill="#5c6d80" text-anchor="start">复核修订</text><g><rect x="25" y="492" width="910" height="60" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="480" y="516" font-size="19" fill="#34475b" text-anchor="middle">三个边界：正本与事实依据分开｜内容与入口分开｜文档建议与实际执行分开</text><text x="480" y="540" font-size="17" fill="#5c6d80" text-anchor="middle">验证不是把文档读一遍就盖章；维护也不只是修改正本那一个文件</text></g></g></svg>
