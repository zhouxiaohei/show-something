<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm07-1-title dm07-1-desc"><title id="dm07-1-title">文档写全了协作仍然出错：开场案例与四个难点</title><desc id="dm07-1-desc">开场案例是 J17 导出任务该不该取消的错误建议；四个难点分别是同一知识点要支持不同阅读任务、文档正本不等于当前事实、保存了知识不代表本次取得并用对、变化跨越代码文档和多个项目。</desc><defs><marker id="dm07-1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">文档写全了，协作仍然出错：一条开场案例，四个难点</text><g><rect x="25" y="62" width="910" height="110" rx="12" fill="#fdf3e3" stroke="#c49a58" stroke-width="1.5"/><text x="45" y="92" font-size="19" fill="#34475b">开场案例：release-2 生产，导出任务 J17 已运行 45 秒、状态仍是 running——该取消，还是重新提交？</text><text x="45" y="120" font-size="17" fill="#5c6d80">Agent 答："已经超过 30 秒，建议终止后重试。"——当前规则是什么、它实际看了什么、建议是否成立，都要核对</text><text x="45" y="144" font-size="17" fill="#5c6d80">文档体系要同时支持事实查询、机制理解和条件判断，不能只提供一个叫"超时"的数字</text></g><path d="M480,172 L480,194" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm07-1-arrow)"/><g><rect x="25" y="198" width="445" height="150" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="228" font-size="19" fill="#34475b">难点一 · 同一知识点，要支持不同阅读任务</text><text x="45" y="254" font-size="17" fill="#5c6d80">查等待上限要简洁参考；理解客户端等待与</text><text x="45" y="278" font-size="17" fill="#5c6d80">后台作业的关系要解释；判断能否取消还要</text><text x="45" y="302" font-size="17" fill="#5c6d80">状态与授权条件。混成长文查询费劲</text></g><g><rect x="490" y="198" width="445" height="150" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="510" y="228" font-size="19" fill="#34475b">难点二 · 文档正本 ≠ 当前事实</text><text x="510" y="254" font-size="17" fill="#5c6d80">文件叫"现行策略"，不代表它已跟随生产</text><text x="510" y="278" font-size="17" fill="#5c6d80">变化；一个参数有唯一正本，也可能全库</text><text x="510" y="302" font-size="17" fill="#5c6d80">一起沿用旧值。不同问题的依据不同</text></g><g><rect x="25" y="358" width="445" height="150" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="388" font-size="19" fill="#34475b">难点三 · 保存了知识 ≠ 本次取得并用对</text><text x="45" y="414" font-size="17" fill="#5c6d80">可能搜到旧文件、读到的片段缺版本标识，</text><text x="45" y="438" font-size="17" fill="#5c6d80">或读到正确规则却把"客户端不再等待"理</text><text x="45" y="462" font-size="17" fill="#5c6d80">解成"后台任务失败"。只查最终答案查不出</text></g><g><rect x="490" y="358" width="445" height="150" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="510" y="388" font-size="19" fill="#34475b">难点四 · 变化跨代码、文档和多个项目</text><text x="510" y="414" font-size="17" fill="#5c6d80">一次策略调整影响正本、排障解释、生成</text><text x="510" y="438" font-size="17" fill="#5c6d80">手册和测试预期；模板复制到别的项目，</text><text x="510" y="462" font-size="17" fill="#5c6d80">还产生公共改进与本地差异两种要求</text></g><text x="480" y="540" font-size="17" fill="#5c6d80" text-anchor="middle">本文讨论本地项目文档：Agent 用搜索、读文件和链接取得资料，不默认向量库与自动召回</text></g></svg>
