<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm07-5-title dm07-5-desc"><title id="dm07-5-title">案例：一条错误建议的排查链</title><desc id="dm07-5-desc">从错误建议出发查看实际读取记录，定位到导航缺口；对照实验帮助缩小原因；修订落在导航、历史片段范围标识与排障指南三处；底部是观察到的缺口与优先修改对象的对应表。</desc><defs><marker id="dm07-5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">案例 · 一条错误建议的排查链：从缺口到修订对象</text><g><rect x="25" y="62" width="280" height="120" rx="12" fill="#f9ecec" stroke="#b97a7a" stroke-width="1.5"/><text x="41" y="92" font-size="19" fill="#34475b">开场：错误建议</text><text x="41" y="118" font-size="17" fill="#5c6d80">"超过 30 秒，建议终止</text><text x="41" y="140" font-size="17" fill="#5c6d80">后重试"（构造示例）</text></g><path d="M305,122 L329,122" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm07-5-arrow)"/><g><rect x="333" y="62" width="280" height="120" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="349" y="92" font-size="19" fill="#34475b">看实际读取记录</text><text x="349" y="118" font-size="17" fill="#5c6d80">搜索命中 archive/release-1</text><text x="349" y="140" font-size="17" fill="#5c6d80">旧片段；读出的区域缺版本标识</text></g><path d="M613,122 L637,122" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm07-5-arrow)"/><g><rect x="641" y="62" width="294" height="120" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="657" y="92" font-size="19" fill="#34475b">定位缺口</text><text x="657" y="118" font-size="17" fill="#5c6d80">正本没过期，也没证据是模型</text><text x="657" y="140" font-size="17" fill="#5c6d80">解释错——缺口是没取得当前</text><text x="657" y="162" font-size="17" fill="#5c6d80">策略及适用范围</text></g><path d="M788,182 L788,204" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm07-5-arrow)"/><g><rect x="505" y="208" width="430" height="120" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="525" y="236" font-size="19" fill="#34475b">对照实验（帮助选下一项调查）</text><text x="525" y="262" font-size="17" fill="#5c6d80">另开受控会话，直接提供已审核的</text><text x="525" y="284" font-size="17" fill="#5c6d80">当前策略 → 改为"查询 J17，不直接</text><text x="525" y="306" font-size="17" fill="#5c6d80">取消或重提"。单次对照不是唯一性证明</text></g><path d="M505,268 L457,268" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm07-5-arrow)"/><g><rect x="25" y="208" width="430" height="120" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="236" font-size="19" fill="#34475b">修订三处（性质不同）</text><text x="45" y="262" font-size="17" fill="#5c6d80">导航：明确当前操作策略的位置</text><text x="45" y="284" font-size="17" fill="#5c6d80">历史片段：关键段附近补 release-1</text><text x="45" y="306" font-size="17" fill="#5c6d80">范围；排障指南注明何时读当前策略</text></g><path d="M240,328 L240,350" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm07-5-arrow)"/><g><rect x="25" y="354" width="910" height="160" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="382" font-size="19" fill="#34475b">观察到的缺口 → 优先检查或修改的对象</text><text x="45" y="410" font-size="17" fill="#5c6d80">现行文档与已审核依据不符 → 当前事实说明、来源核验与维护责任</text><text x="45" y="438" font-size="17" fill="#5c6d80">正本适用，但只取得旧页或缺范围 → 导航、历史标识、读取范围与追溯指令</text><text x="45" y="466" font-size="17" fill="#5c6d80">给了当前策略仍把等待结束当后台失败 → 策略表达、语义区别、任务条件与模型解释</text><text x="45" y="494" font-size="17" fill="#5c6d80">答案与策略相符却被评分标错 → 参考答案、判据与评分实现</text></g><text x="480" y="540" font-size="17" fill="#5c6d80" text-anchor="middle">复测从原问题、原工具、原入口跑——把正确片段直接交给模型，等于没检验导航</text></g></svg>
