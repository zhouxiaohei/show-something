<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="ct01-4-title ct01-4-desc"><title id="ct01-4-title">机制二：自我纠错盲区——改变身份，而不是增加强调</title><desc id="ct01-4-desc">上方对比两种身份：同一份错误内容被称为"你刚才的结论"时更像既定前提，被称为"另一份待审查材料"时可以从零审查。左下是经常无效的强调式提示，右下是有效的四步做法，底部是高风险时的补充手段。</desc><defs><marker id="ct01-4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">机制二 · 自我纠错盲区：改变身份，而不是增加强调</text><g><rect x="25" y="60" width="440" height="110" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="88" font-size="19" fill="#34475b">身份 A："这是你刚才的结论"</text><text x="45" y="114" font-size="17" fill="#5c6d80">前面的判断更像既定前提，不是待审对象</text><text x="45" y="138" font-size="17" fill="#5c6d80">自回归：已生成内容成为后续生成的条件</text></g><g><rect x="495" y="60" width="440" height="110" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="515" y="88" font-size="19" fill="#34475b">身份 B："这是另一份待审查材料"</text><text x="515" y="114" font-size="17" fill="#5c6d80">可以像审外部材料一样，从零开始证伪</text><text x="515" y="138" font-size="17" fill="#5c6d80">Self-Correction Bench：任务越复杂，盲区越重 [模型证据]</text></g><g><rect x="25" y="200" width="440" height="130" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="45" y="228" font-size="19" fill="#34475b">只加强调：经常无效</text><text x="45" y="254" font-size="17" fill="#5c6d80">"请深入复盘你刚才的修改"</text><text x="45" y="278" font-size="17" fill="#5c6d80">"请认真检查是否遗漏了什么"</text><text x="45" y="302" font-size="17" fill="#5c6d80">→ 同一框架内更长、更自洽的解释</text></g><g><rect x="495" y="200" width="440" height="130" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="515" y="228" font-size="19" fill="#34475b">改变身份：把产物变成外部证据</text><text x="515" y="254" font-size="17" fill="#5c6d80">新开上下文 · 提供 diff、测试输出、原始需求</text><text x="515" y="278" font-size="17" fill="#5c6d80">称它"这份修改"，不是"你刚才写的"</text><text x="515" y="302" font-size="17" fill="#5c6d80">逐条寻找反例，不解释设计意图</text></g><g><rect x="25" y="360" width="910" height="100" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="388" font-size="19" fill="#34475b">高风险时再加一道</text><text x="45" y="414" font-size="17" fill="#5c6d80">换一个模型或独立评审者——验证者不继承原作者的全部隐含前提</text><text x="45" y="438" font-size="17" fill="#5c6d80">测试、编译器、验证器等外部信号，比"再想想"更可靠 [模型证据]</text></g></g></svg>
