<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ct01-1-title ct01-1-desc"><title id="ct01-1-title">越聊越浅：三个独立机制的叠加与解法总览</title><desc id="ct01-1-desc">症状清单先经过零号变量分诊，排除配置问题后指向三个机制：上下文腐烂、自我纠错盲区、交接成本；底部是解法——把仍约束未来的决定写进稳定载体，让干净上下文读取原始证据。</desc><defs><marker id="ct01-1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">越聊越浅通常不是变笨：三个独立机制的叠加</text><g><rect x="25" y="60" width="910" height="96" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="88" font-size="19" fill="#34475b">症状清单｜Agent 仍在高速执行，人开始替它维护任务记忆</text><text x="45" y="114" font-size="17" fill="#5c6d80">重复读取看过文件 · 复活已否决方案 · 修复又引入旧问题</text><text x="45" y="138" font-size="17" fill="#5c6d80">要求"深入复盘"，得到的是更完整的自我解释，不是问题清单</text></g><path d="M480,156 L480,172" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ct01-1-arrow)"/><g><rect x="25" y="176" width="910" height="56" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="480" y="210" font-size="17" fill="#5c6d80" text-anchor="middle">零号变量分诊：第一轮就浅 → 先查推理档位与模型配置；前面深、后面浅 → 才轮到下面三个机制</text></g><path d="M171,232 L171,252" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ct01-1-arrow)"/><path d="M480,232 L480,252" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ct01-1-arrow)"/><path d="M789,232 L789,252" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ct01-1-arrow)"/><g><rect x="25" y="256" width="293" height="170" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="284" font-size="19" fill="#34475b">机制一 · 上下文腐烂</text><text x="45" y="312" font-size="17" fill="#5c6d80">有效事实被历史噪声包围</text><text x="45" y="338" font-size="17" fill="#5c6d80">"哪份是权威版本"判断不稳</text><text x="45" y="364" font-size="17" fill="#5c6d80">不一定稳定变笨，</text><text x="45" y="390" font-size="17" fill="#5c6d80">更常见的是方差变大</text></g><g><rect x="334" y="256" width="292" height="170" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="354" y="284" font-size="19" fill="#34475b">机制二 · 自我纠错盲区</text><text x="354" y="312" font-size="17" fill="#5c6d80">审查自己产出 弱于 审查外部材料</text><text x="354" y="338" font-size="17" fill="#5c6d80">复盘 = 同一框架内更长的解释</text><text x="354" y="364" font-size="17" fill="#5c6d80">靠"再想想""认真检查"</text><text x="354" y="390" font-size="17" fill="#5c6d80">救不回来</text></g><g><rect x="643" y="256" width="292" height="170" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="663" y="284" font-size="19" fill="#34475b">机制三 · 交接成本</text><text x="663" y="312" font-size="17" fill="#5c6d80">搬全背景太贵 → 忍着不换</text><text x="663" y="338" font-size="17" fill="#5c6d80">腐烂得以持续的经济学原因</text><text x="663" y="364" font-size="17" fill="#5c6d80">多 Agent 不自动解决</text><text x="663" y="390" font-size="17" fill="#5c6d80">紧耦合任务</text></g><path d="M480,426 L480,446" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ct01-1-arrow)"/><g><rect x="25" y="450" width="910" height="94" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="478" font-size="19" fill="#34475b">解法不是把提示词写得更凶，而是管理信息</text><text x="45" y="504" font-size="17" fill="#5c6d80">仍约束未来的决定 → 写进稳定载体（AGENTS.md / NOTES.md）</text><text x="45" y="528" font-size="17" fill="#5c6d80">干净上下文 → 直接读取原始证据（diff / 测试 / 日志）；自我复盘 → 独立审查</text></g></g></svg>
