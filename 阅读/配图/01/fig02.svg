<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="ct01-2-title ct01-2-desc"><title id="ct01-2-title">零号变量：时间轴上的分诊台</title><desc id="ct01-2-desc">左侧是四步排查顺序：推理档位是否匹配任务、模型与窗口配置是否变化、前几轮是否正常之后才退化、再分析上下文与协作机制。右侧对比两种时间线：前面深后面浅指向上下文累积问题，从第一轮就浅指向配置问题，并注明输出简洁不等于推理深入。</desc><defs><marker id="ct01-2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">零号变量：先分诊，再谈上下文</text><g><rect x="25" y="60" width="430" height="84" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="88" font-size="19" fill="#34475b">① 推理档位是否匹配任务</text><text x="45" y="112" font-size="17" fill="#5c6d80">格式化、重命名、样板代码：低预算</text><text x="45" y="134" font-size="17" fill="#5c6d80">竞态、架构审查、安全检查、跨仓迁移：高预算</text></g><path d="M240,144 L240,160" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ct01-2-arrow)"/><g><rect x="25" y="164" width="430" height="64" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="190" font-size="19" fill="#34475b">② 模型、版本、窗口配置近期是否变化</text><text x="45" y="214" font-size="17" fill="#5c6d80">回答变浅可能是配置漂移，不是会话问题</text></g><path d="M240,228 L240,244" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ct01-2-arrow)"/><g><rect x="25" y="248" width="430" height="64" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="274" font-size="19" fill="#34475b">③ 前几轮是否正常、之后才退化</text><text x="45" y="298" font-size="17" fill="#5c6d80">时间轴形态决定往哪边分诊</text></g><path d="M240,312 L240,328" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ct01-2-arrow)"/><g><rect x="25" y="332" width="430" height="58" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="367" font-size="19" fill="#34475b">④ 排除配置后，再分析上下文与协作机制</text></g><g><rect x="495" y="60" width="440" height="74" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="515" y="88" font-size="19" fill="#34475b">前面深、后面浅</text><text x="515" y="114" font-size="17" fill="#5c6d80">→ 上下文累积问题（本文三个机制）</text></g><g><rect x="495" y="150" width="440" height="74" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="515" y="178" font-size="19" fill="#34475b">从第一轮就浅</text><text x="515" y="204" font-size="17" fill="#5c6d80">→ 先查推理预算、版本与窗口配置</text></g><g><rect x="495" y="240" width="440" height="100" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="515" y="268" font-size="19" fill="#34475b">注意：输出简洁 ≠ 推理深入</text><text x="515" y="294" font-size="17" fill="#5c6d80">让模型少说一点，不等于让它少想一点</text><text x="515" y="318" font-size="17" fill="#5c6d80">这是两个不同维度，别混着调</text></g><g><rect x="495" y="356" width="440" height="74" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="515" y="384" font-size="19" fill="#34475b">零号变量是时间轴上的分诊台</text><text x="515" y="410" font-size="17" fill="#5c6d80">把"一直浅"（配置问题）与"后来浅"（本文主题）分开</text></g></g></svg>
