<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ct01-5-title ct01-5-desc"><title id="ct01-5-title">解法：按变化速度分层——现场层不搬运，手工只维护决策层</title><desc id="ct01-5-desc">旧会话的知识按变化速度分成三层：地基层写进 AGENTS.md 自动加载，决策层写进 NOTES.md 与 ADR 增量更新，现场层的 diff 与测试日志不搬运，由新上下文直接读取原始证据，然后进入独立审查。</desc><defs><marker id="ct01-5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">解法 · 不按任务切知识，按变化速度分层</text><g><rect x="25" y="230" width="180" height="110" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="115" y="270" font-size="19" fill="#34475b" text-anchor="middle">旧会话</text><text x="115" y="296" font-size="16" fill="#5c6d80" text-anchor="middle">（腐烂的上下文）</text></g><g><rect x="245" y="60" width="280" height="115" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="265" y="88" font-size="19" fill="#34475b">地基层 · AGENTS.md</text><text x="265" y="114" font-size="16" fill="#5c6d80">技术栈 · 规范 · 目录结构 · 禁区</text><text x="265" y="140" font-size="16" fill="#5c6d80">长期维护，自动加载</text></g><g><rect x="245" y="200" width="280" height="135" rx="12" fill="#f3eff9" stroke="#a08bb4" stroke-width="1.5"/><text x="265" y="228" font-size="19" fill="#34475b">决策层 · NOTES.md / ADR</text><text x="265" y="254" font-size="16" fill="#5c6d80">已定方案 · 已否决路径与理由</text><text x="265" y="280" font-size="16" fill="#5c6d80">设计意图 · 当前卡点</text><text x="265" y="306" font-size="16" fill="#5c6d80">增量更新，经人确认</text></g><g><rect x="245" y="360" width="280" height="115" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="265" y="388" font-size="19" fill="#34475b">现场层 · Git / 测试 / 日志</text><text x="265" y="414" font-size="16" fill="#5c6d80">当前 diff · 报错 · 运行结果</text><text x="265" y="440" font-size="16" fill="#5c6d80">不搬运</text></g><path d="M205,262 L241,122" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ct01-5-arrow)"/><path d="M205,285 L241,268" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ct01-5-arrow)"/><path d="M205,308 L241,412" fill="none" stroke="#6d8296" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ct01-5-arrow)"/><g><rect x="565" y="230" width="180" height="110" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="655" y="270" font-size="19" fill="#34475b" text-anchor="middle">新上下文</text><text x="655" y="296" font-size="16" fill="#5c6d80" text-anchor="middle">干净起步</text></g><path d="M525,120 L561,258" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ct01-5-arrow)"/><path d="M525,268 L561,275" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ct01-5-arrow)"/><path d="M525,412 L561,292" fill="none" stroke="#6d8296" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ct01-5-arrow)"/><g><rect x="785" y="230" width="150" height="110" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="860" y="270" font-size="19" fill="#34475b" text-anchor="middle">独立审查</text><text x="860" y="296" font-size="16" fill="#5c6d80" text-anchor="middle">（见机制二）</text></g><path d="M745,285 L781,285" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#ct01-5-arrow)"/><text x="655" y="380" font-size="16" fill="#5c6d80" text-anchor="middle">虚线：不让旧 Agent 转述，</text><text x="655" y="404" font-size="16" fill="#5c6d80" text-anchor="middle">直接读取当前工作区的事实</text><text x="480" y="530" font-size="19" fill="#34475b" text-anchor="middle">判据：只保留仍然会约束未来推理的信息——手工只维护决策层</text></g></svg>
