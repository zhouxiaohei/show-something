<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ct01-3-title ct01-3-desc"><title id="ct01-3-title">机制一：上下文腐烂——有效信息被噪声包围</title><desc id="ct01-3-desc">左侧示意一个越聊越长的会话窗口：仍然有效的事实被失效旧方案、重复文件片段、相似搜索结果、被覆盖的早期要求、报错重试和自我总结包围。右侧是研究证据与典型症状。底部一句话：问题不是信息丢了，而是权威版本判断不稳。</desc><defs><marker id="ct01-3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">机制一 · 上下文腐烂：不是信息丢了，是权威版本判断不稳</text><g><rect x="25" y="60" width="470" height="330" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="88" font-size="19" fill="#34475b">会话窗口（每次搜索、读文件、跑测试都往里堆）</text><g><rect x="45" y="104" width="200" height="44" rx="8" fill="#e7ecf1" stroke="#98a4b0" stroke-width="1"/><text x="145" y="131" font-size="16" fill="#5c6d80" text-anchor="middle">失效的旧方案</text></g><g><rect x="255" y="104" width="200" height="44" rx="8" fill="#e7ecf1" stroke="#98a4b0" stroke-width="1"/><text x="355" y="131" font-size="16" fill="#5c6d80" text-anchor="middle">重复的文件片段</text></g><g><rect x="45" y="158" width="200" height="44" rx="8" fill="#e7ecf1" stroke="#98a4b0" stroke-width="1"/><text x="145" y="185" font-size="16" fill="#5c6d80" text-anchor="middle">相似的搜索结果</text></g><g><rect x="255" y="158" width="200" height="44" rx="8" fill="#e7ecf1" stroke="#98a4b0" stroke-width="1"/><text x="355" y="185" font-size="16" fill="#5c6d80" text-anchor="middle">被覆盖的早期要求</text></g><g><rect x="45" y="212" width="200" height="44" rx="8" fill="#e7ecf1" stroke="#98a4b0" stroke-width="1"/><text x="145" y="239" font-size="16" fill="#5c6d80" text-anchor="middle">工具报错与重试</text></g><g><rect x="255" y="212" width="200" height="44" rx="8" fill="#e7ecf1" stroke="#98a4b0" stroke-width="1"/><text x="355" y="239" font-size="16" fill="#5c6d80" text-anchor="middle">Agent 的自我总结</text></g><g><rect x="140" y="286" width="240" height="72" rx="10" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="260" y="316" font-size="19" fill="#34475b" text-anchor="middle">仍然有效的事实</text><text x="260" y="340" font-size="16" fill="#5c6d80" text-anchor="middle">（被噪声包围的少数派）</text></g></g><text x="25" y="414" font-size="17" fill="#5c6d80">机制假设：检索与推理共享注意力，噪声越多留给当前推理的份额越少 [推测]</text><g><rect x="515" y="60" width="420" height="150" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="535" y="88" font-size="19" fill="#34475b">证据 [模型证据]</text><text x="535" y="114" font-size="17" fill="#5c6d80">Context Rot：答案就在上下文里，</text><text x="535" y="138" font-size="17" fill="#5c6d80">周围信息一多，表现照样下降（Chroma）</text><text x="535" y="162" font-size="17" fill="#5c6d80">多轮分散提供差于单次提供；</text><text x="535" y="186" font-size="17" fill="#5c6d80">重组后质量大幅恢复（arXiv 2505.06120）</text></g><g><rect x="515" y="230" width="420" height="150" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="535" y="258" font-size="19" fill="#34475b">典型症状</text><text x="535" y="284" font-size="17" fill="#5c6d80">重复读取没变化的文件 · 忘记已否决方案</text><text x="535" y="308" font-size="17" fill="#5c6d80">只响应最新一句，遗漏累计约束</text><text x="535" y="332" font-size="17" fill="#5c6d80">计划、修改与最终总结对不上</text><text x="535" y="356" font-size="17" fill="#5c6d80">时而深时而浅 = 方差变大（线索，非定论）</text></g><g><rect x="25" y="450" width="910" height="76" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="480" y="482" font-size="19" fill="#34475b" text-anchor="middle">这一节要说清的只有一件：上下文腐烂不是"信息丢了"，</text><text x="480" y="508" font-size="19" fill="#34475b" text-anchor="middle">而是"哪份是权威版本"这个判断本身变得不稳定</text></g></g></svg>
