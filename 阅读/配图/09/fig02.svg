<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm09-2-title dm09-2-desc"><title id="dm09-2-title">七步展开：每步的主要工作与产物</title><desc id="dm09-2-desc">从锁定范围与快照、读码建立候选地图、核对数据源、追踪关键业务路径、核对组件关系、反查运行来源，到对账并交付，每一步标注主要工作与本步形成的产物。</desc><defs><marker id="dm09-2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">七步展开：每步的主要工作与产物</text><g><circle cx="57" cy="86" r="15" fill="#e3e9ef" stroke="#98a4b0" stroke-width="1.5"/><text x="57" y="91" font-size="17" fill="#34475b" text-anchor="middle">1</text><rect x="25" y="62" width="910" height="48" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="85" y="82" font-size="18" fill="#34475b">锁定范围与快照</text><text x="85" y="102" font-size="15" fill="#5c6d80">明确决策、仓库、环境、身份和时点 → 产物：调查范围与比较基准</text></g><path d="M480,110 L480,122" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm09-2-arrow)"/><g><circle cx="57" cy="148" r="15" fill="#e3e9ef" stroke="#98a4b0" stroke-width="1.5"/><text x="57" y="153" font-size="17" fill="#34475b" text-anchor="middle">2</text><rect x="25" y="124" width="910" height="48" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="85" y="144" font-size="18" fill="#34475b">读码建立候选地图</text><text x="85" y="164" font-size="15" fill="#5c6d80">找入口、组件、配置来源及关键业务代码 → 产物：候选结构、待核实命题</text></g><path d="M480,172 L480,184" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm09-2-arrow)"/><g><circle cx="57" cy="210" r="15" fill="#e3e9ef" stroke="#98a4b0" stroke-width="1.5"/><text x="57" y="215" font-size="17" fill="#34475b" text-anchor="middle">3</text><rect x="25" y="186" width="910" height="48" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="85" y="206" font-size="18" fill="#34475b">核对数据源</text><text x="85" y="226" font-size="15" fill="#5c6d80">关联有效配置、访问身份、业务对象及用途 → 产物：有范围的数据依赖记录</text></g><path d="M480,234 L480,246" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm09-2-arrow)"/><g><circle cx="57" cy="272" r="15" fill="#e3e9ef" stroke="#98a4b0" stroke-width="1.5"/><text x="57" y="277" font-size="17" fill="#34475b" text-anchor="middle">4</text><rect x="25" y="248" width="910" height="48" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="85" y="268" font-size="18" fill="#34475b">追踪关键业务路径</text><text x="85" y="288" font-size="15" fill="#5c6d80">对齐接口清单，连接输入、处理和结果 → 产物：业务路径及已验证范围</text></g><path d="M480,296 L480,308" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm09-2-arrow)"/><g><circle cx="57" cy="334" r="15" fill="#e3e9ef" stroke="#98a4b0" stroke-width="1.5"/><text x="57" y="339" font-size="17" fill="#34475b" text-anchor="middle">5</text><rect x="25" y="310" width="910" height="48" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="85" y="330" font-size="18" fill="#34475b">核对组件关系</text><text x="85" y="350" font-size="15" fill="#5c6d80">区分服务调用、任务传递和共享数据访问 → 产物：有依据的组件关系图</text></g><path d="M480,358 L480,370" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm09-2-arrow)"/><g><circle cx="57" cy="396" r="15" fill="#e3e9ef" stroke="#98a4b0" stroke-width="1.5"/><text x="57" y="401" font-size="17" fill="#34475b" text-anchor="middle">6</text><rect x="25" y="372" width="910" height="48" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="85" y="392" font-size="18" fill="#34475b">反查运行来源</text><text x="85" y="412" font-size="15" fill="#5c6d80">关联实例、制品、构建、源码与配置 → 产物：运行身份与来源链条</text></g><path d="M480,420 L480,432" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm09-2-arrow)"/><g><circle cx="57" cy="458" r="15" fill="#e3e9ef" stroke="#98a4b0" stroke-width="1.5"/><text x="57" y="463" font-size="17" fill="#34475b" text-anchor="middle">7</text><rect x="25" y="434" width="910" height="48" rx="10" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="85" y="454" font-size="18" fill="#34475b">对账并交付</text><text x="85" y="474" font-size="15" fill="#5c6d80">处理差异，判断剩余未知的影响 → 产物：可支持当前决策的系统画像</text></g><text x="25" y="510" font-size="14" fill="#5c6d80">第一份范围说明是后续比较的基准；后续证据无法对应这些条件时，先补齐对象信息再比较。</text></g></svg>
