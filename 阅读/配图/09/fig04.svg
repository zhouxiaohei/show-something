<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm09-4-title dm09-4-desc"><title id="dm09-4-title">证据修订后的导出链与五组证据</title><desc id="dm09-4-desc">用户提交导出请求，导出 API 创建与读取任务并发送任务消息，任务队列把消息交给导出 worker，worker 读取业务库、更新任务状态并写入文件存储，API 读取结果文件并交付；E1 到 E5 五组构造证据分别支撑双执行角色、两套数据资源、任务通道、结果交付和运行版本差异。</desc><defs><marker id="dm09-4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">完整案例：证据把"一个应用连一个库"改成两条数据线</text><g><rect x="25" y="64" width="120" height="46" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="85" y="93" font-size="18" fill="#34475b" text-anchor="middle">用户</text></g><path d="M145,87 L211,87" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm09-4-arrow)"/><text x="178" y="78" font-size="14" fill="#5c6d80" text-anchor="middle">提交导出</text><g><rect x="215" y="64" width="150" height="46" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="290" y="93" font-size="18" fill="#34475b" text-anchor="middle">导出 API</text></g><path d="M365,87 L441,87" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm09-4-arrow)"/><text x="403" y="78" font-size="14" fill="#5c6d80" text-anchor="middle">发送任务消息</text><g><rect x="445" y="64" width="140" height="46" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="515" y="93" font-size="18" fill="#34475b" text-anchor="middle">任务队列</text></g><path d="M585,87 L661,87" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm09-4-arrow)"/><text x="623" y="78" font-size="14" fill="#5c6d80" text-anchor="middle">消息被消费</text><g><rect x="665" y="64" width="150" height="46" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="740" y="93" font-size="18" fill="#34475b" text-anchor="middle">导出 worker</text></g><path d="M280,110 L180,192" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm09-4-arrow)"/><path d="M730,110 L500,192" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm09-4-arrow)"/><path d="M760,110 L800,192" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm09-4-arrow)"/><g><rect x="25" y="200" width="270" height="68" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><ellipse cx="160" cy="200" rx="135" ry="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><ellipse cx="160" cy="268" rx="135" ry="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="160" y="232" font-size="18" fill="#34475b" text-anchor="middle">任务库 T</text><text x="160" y="252" font-size="14" fill="#5c6d80" text-anchor="middle">API 创建与读取任务</text></g><g><rect x="345" y="200" width="270" height="68" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><ellipse cx="480" cy="200" rx="135" ry="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><ellipse cx="480" cy="268" rx="135" ry="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="480" y="232" font-size="18" fill="#34475b" text-anchor="middle">业务库 B</text><text x="480" y="252" font-size="14" fill="#5c6d80" text-anchor="middle">worker 读取业务数据</text></g><g><rect x="665" y="200" width="270" height="68" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><ellipse cx="800" cy="200" rx="135" ry="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><ellipse cx="800" cy="268" rx="135" ry="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="800" y="232" font-size="18" fill="#34475b" text-anchor="middle">文件存储 F</text><text x="800" y="252" font-size="14" fill="#5c6d80" text-anchor="middle">worker 写入；API 读取并交付</text></g><g><rect x="25" y="320" width="910" height="140" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="348" font-size="17" fill="#34475b">支撑这条结构的证据（E1—E5，构造材料）</text><text x="45" y="372" font-size="15" fill="#5c6d80">E1 源码与启动：API 与 worker 有各自启动入口，两种执行角色需分别调查</text><text x="45" y="394" font-size="15" fill="#5c6d80">E2 配置与资源：API 用任务库 T，worker 用业务库 B 并回写 T，两套资源分开记录</text><text x="45" y="416" font-size="15" fill="#5c6d80">E3 任务关联：一笔测试请求对应任务 t_demo，消息发送、消费与 worker 处理记录齐全</text><text x="45" y="438" font-size="15" fill="#5c6d80">E4 结果交付：任务完成、文件位于 F，API 读取并交付，内容与独立参考一致</text><text x="45" y="460" font-size="15" fill="#5c6d80">E5 运行与构建：API 制品关联提交 R2，worker 制品关联 R1，不能按本地单一提交概括</text></g><text x="25" y="490" font-size="14" fill="#5c6d80">箭头表示已取得证据的关系，不表达吞吐、时延或所有任务的覆盖率；</text><text x="25" y="510" font-size="14" fill="#5c6d80">API 与 worker 虽来自同一仓库，调查和迁移时仍需分别识别各自的版本与有效配置。</text></g></svg>
