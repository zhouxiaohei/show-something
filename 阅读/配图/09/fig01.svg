<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm09-1-title dm09-1-desc"><title id="dm09-1-title">先建图，再观察，最后对账：三阶段调查闭环</title><desc id="dm09-1-desc">调查从明确当前决策、调查对象、环境与时点开始，经读码建立候选结构与业务路径、选出待核实命题，再受控观察核对关键行为，随后运行溯源关联实例、制品、源码与有效配置，最后对账判断：证据与候选解释一致且足够则交付系统画像、证据索引与未知项；矛盾或不足则定位版本、配置、身份、路由或观察覆盖差异，回到待核实命题。</desc><defs><marker id="dm09-1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">先建图，再观察，最后对账：三阶段调查的推进与回环</text><g><rect x="25" y="60" width="860" height="46" rx="10" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="89" font-size="19" fill="#34475b">准备 · 明确当前决策、调查对象、环境与时点</text></g><path d="M455,106 L455,124" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm09-1-arrow)"/><g><rect x="25" y="128" width="860" height="64" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="156" font-size="19" fill="#34475b">读码 · 形成候选结构与业务路径</text><text x="45" y="182" font-size="17" fill="#5c6d80">产物：带出处的候选地图与待核实命题（例：API 创建任务后，是否经消息队列通知 worker？）</text></g><path d="M455,192 L455,210" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm09-1-arrow)"/><g><rect x="25" y="214" width="860" height="64" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="242" font-size="19" fill="#34475b">观察 · 核对关键行为、数据和结果</text><text x="45" y="268" font-size="17" fill="#5c6d80">在明确的环境与身份下进行；用同一任务 ID 关联请求受理、任务创建、worker 处理和文件结果</text></g><path d="M455,278 L455,296" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm09-1-arrow)"/><g><rect x="25" y="300" width="860" height="64" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="328" font-size="19" fill="#34475b">溯源 · 关联实例、制品、源码与有效配置</text><text x="45" y="354" font-size="17" fill="#5c6d80">例：worker 用的源码提交早于本地代码，就能解释新增处理逻辑为何没出现在任务记录</text></g><path d="M455,364 L455,382" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm09-1-arrow)"/><g><rect x="205" y="386" width="500" height="52" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="455" y="418" font-size="19" fill="#34475b" text-anchor="middle">对账：证据与候选解释一致吗？</text></g><path d="M340,438 L245,474" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm09-1-arrow)"/><path d="M570,438 L695,474" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm09-1-arrow)"/><g><rect x="25" y="478" width="420" height="62" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="503" font-size="18" fill="#34475b">一致且足够 → 交付</text><text x="45" y="527" font-size="16" fill="#5c6d80">系统画像 · 证据索引 · 未知及影响</text></g><g><rect x="515" y="478" width="420" height="62" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="535" y="503" font-size="18" fill="#34475b">矛盾或不足 → 定位差异</text><text x="535" y="527" font-size="16" fill="#5c6d80">版本 · 配置 · 身份 · 路由 · 观察覆盖</text></g><path d="M935,509 L950,509 L950,160 L889,160" fill="none" stroke="#6d8296" stroke-width="2" marker-end="url(#dm09-1-arrow)"/><text x="25" y="553" font-size="13" fill="#5c6d80">箭头表示信息如何推进与修正判断；实际执行可以往返，运行身份通常需要提前确认。</text></g></svg>
