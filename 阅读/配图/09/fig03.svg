<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="dm09-3-title dm09-3-desc"><title id="dm09-3-title">事实底账：声明、观察、推断、未知各带限定</title><desc id="dm09-3-desc">事实底账把每条重要判断的当前依据分为声明、观察、推断、未知四类，各类给出导出案例中的记录示例与必须保留的限定；下方是一条记录的书写链与命题可引用多类记录的说明。</desc><defs><marker id="dm09-3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="35" font-size="22" fill="#34475b" text-anchor="start">事实底账：每条重要判断都记录当前依据</text><g><rect x="25" y="62" width="217" height="230" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="45" y="92" font-size="19" fill="#34475b">声明</text><line x1="45" y1="104" x2="222" y2="104" stroke="#98a4b0" stroke-width="1"/><text x="45" y="128" font-size="15" fill="#5c6d80">某提交中的 API 代码</text><text x="45" y="150" font-size="15" fill="#5c6d80">包含任务创建逻辑</text><text x="45" y="188" font-size="14" fill="#739882">必须保留的限定</text><text x="45" y="212" font-size="15" fill="#5c6d80">文件位置 · 源码版本</text><text x="45" y="234" font-size="15" fill="#5c6d80">是否有本地改动</text></g><g><rect x="256" y="62" width="217" height="230" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="276" y="92" font-size="19" fill="#34475b">观察</text><line x1="276" y1="104" x2="453" y2="104" stroke="#98a4b0" stroke-width="1"/><text x="276" y="128" font-size="15" fill="#5c6d80">测试环境一笔任务被</text><text x="276" y="150" font-size="15" fill="#5c6d80">worker 处理并生成文件</text><text x="276" y="188" font-size="14" fill="#739882">必须保留的限定</text><text x="276" y="212" font-size="15" fill="#5c6d80">对象 · 身份 · 时间</text><text x="276" y="234" font-size="15" fill="#5c6d80">输入与观察范围</text></g><g><rect x="487" y="62" width="217" height="230" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="507" y="92" font-size="19" fill="#34475b">推断</text><line x1="507" y1="104" x2="684" y2="104" stroke="#98a4b0" stroke-width="1"/><text x="507" y="128" font-size="15" fill="#5c6d80">两个组件可能访问</text><text x="507" y="150" font-size="15" fill="#5c6d80">同一个业务数据源</text><text x="507" y="188" font-size="14" fill="#739882">必须保留的限定</text><text x="507" y="212" font-size="15" fill="#5c6d80">支持依据 · 竞争解释</text><text x="507" y="234" font-size="15" fill="#5c6d80">需要补的证据</text></g><g><rect x="718" y="62" width="217" height="230" rx="12" fill="#f3f5f7" stroke="#98a4b0" stroke-width="1.5"/><text x="738" y="92" font-size="19" fill="#34475b">未知</text><line x1="738" y1="104" x2="915" y2="104" stroke="#98a4b0" stroke-width="1"/><text x="738" y="128" font-size="15" fill="#5c6d80">未取得 worker 当前</text><text x="738" y="150" font-size="15" fill="#5c6d80">制品的构建来源记录</text><text x="738" y="188" font-size="14" fill="#739882">必须保留的限定</text><text x="738" y="212" font-size="15" fill="#5c6d80">缺口影响什么判断</text><text x="738" y="234" font-size="15" fill="#5c6d80">由谁或何种证据补齐</text></g><g><rect x="25" y="316" width="910" height="96" rx="12" fill="#edf6f0" stroke="#739882" stroke-width="1.5"/><text x="45" y="344" font-size="17" fill="#34475b">一条记录的书写链</text><text x="45" y="376" font-size="16" fill="#34475b">问题 → 对象 / 环境 / 身份 / 时点 → 证据位置 → 取得的内容 → 当前结论及范围 → 剩余未知 / 下一步</text><text x="45" y="400" font-size="15" fill="#5c6d80">证据位置指向有权限复查的原始材料；正文保留必要摘要，避免只留一张难以追溯的结果表</text></g><text x="25" y="452" font-size="16" fill="#34475b">一条命题可同时引用多类记录："这笔任务由当前 worker 完成"需要任务处理记录和实例身份；</text><text x="25" y="476" font-size="16" fill="#34475b">若还要说明"由某提交的逻辑完成"，就要继续关联构建来源。</text><text x="25" y="506" font-size="14" fill="#5c6d80">四类描述的是信息性质，不是从低到高的固定等级：源码能证明实现存在，运行观察适合核对环境行为。</text></g></svg>
